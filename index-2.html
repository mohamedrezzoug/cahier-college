const LVX=[];          // exercices écrits à la main avec niveau : [sid, li, lv, exercice]
function gen(sid,li,lv,fn){((GEN[sid]=GEN[sid]||{})[li]=GEN[sid][li]||[]).push([lv,fn])}
function LV(sid,li,lv,arr){arr.forEach(E=>LVX.push([sid,li,lv,E]))}
const RNG={
  int:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  shuf:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},
  sample:(a,n)=>RNG.shuf(a).slice(0,n),
  sign:()=>Math.random()<.5?-1:1,
  coin:p=>Math.random()<(p==null?.5:p)
};
const I=RNG.int,PK=RNG.pick;
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1}
// nombre au format français (virgule, signe −, espaces des milliers)
function N(x,dec){if(typeof x!=="number"||!isFinite(x))return"NaN";const d=dec==null?2:dec;let v=Math.round(x*Math.pow(10,d))/Math.pow(10,d);if(Object.is(v,-0))v=0;
  const neg=v<0;let [ip,fp]=Math.abs(v).toString().split(".");if(ip.length>4)ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g," ");return(neg?"−":"")+ip+(fp?","+fp:"")}
// fraction simplifiée (chaîne au format [[a/b]])
function FR(n,d){if(d===0)return"NaN";if(d<0){n=-n;d=-d}const g=gcd(n,d);n/=g;d/=g;if(d===1)return N(n);return(n<0?"[[−"+(-n)+"/"+d+"]]":"[["+n+"/"+d+"]]")}
function FRraw(n,d){return(n<0?"[[−"+(-n)+"/"+d+"]]":"[["+n+"/"+d+"]]")}
const SUP="⁰¹²³⁴⁵⁶⁷⁸⁹";function sup(n){return(n<0?"⁻":"")+String(Math.abs(n)).split("").map(c=>SUP[+c]).join("")}
// a·x + b joliment
function term(a,v,first){if(a===0)return"";const s=a<0?"−":first?"":"+";const m=Math.abs(a);return s+(v?(m===1?"":m)+v:m)}
function poly(...cs){// poly([a,"x²"],[b,"x"],[c,""])
  let s="";cs.forEach(([a,v])=>{if(a)s+=term(a,v,!s)});return s||"0"}
// constructeurs d'exercices (renvoient null si invalides)
function bad(s){return s==null||/NaN|Infinity|undefined/.test(String(s))}
function Q(text,correct,dis,help){const c=String(correct);if(bad(c))return null;const seen=new Set([c]),o=[c];
  for(const d of dis){const s=String(d);if(!bad(s)&&s!==""&&!seen.has(s)){seen.add(s);o.push(s)}if(o.length>=4)break}
  if(o.length<3)return null;const order=RNG.shuf(o.map((_,i)=>i));return["q",text,order.map(i=>o[i]),order.indexOf(0),help]}
function VF(text,val,help){return["vf",text,!!val,help]}
function GAP(text,ans,dis,help){const a=ans.map(String);if(a.some(bad))return null;const d=[];dis.map(String).forEach(s=>{if(!bad(s)&&!a.includes(s)&&!d.includes(s))d.push(s)});
  if((text.match(/___/g)||[]).length!==a.length||new Set(a).size!==a.length)return null;return["g",text,a,d.slice(0,3),help]}
function ORD(text,items,help){if(new Set(items).size!==items.length)return null;return["o",text,items,help]}
function REL(text,pairs,help){if(new Set(pairs.map(p=>p[1])).size!==pairs.length||new Set(pairs.map(p=>p[0])).size!==pairs.length)return null;return["m",text,pairs,help]}
function numDis(x,extra){const c=[x+1,x-1,x*2,x/2,x+10,x-10,x*10,x/10,-x].concat(extra||[]);return c.map(v=>N(v))}
// produit une série de n exercices pour (sid, li, lv)
function genSeries(sid,li,lv,n){const list=(GEN[sid]&&GEN[sid][li]||[]).filter(g=>g[0]===lv);if(!list.length)return[];
  const out=[],seen=new Set();let tries=0;while(out.length<n&&tries<n*30){tries++;const fn=list[(out.length+tries)%list.length][1];let E=null;try{E=fn()}catch(e){E=null}
    if(!E)continue;const key=JSON.stringify(E);if(seen.has(key))continue;seen.add(key);E.gen=1;E.lv=lv;out.push(E)}return out}

// ===== Générateurs — Mathématiques (index = ordre du manuel) =====
(()=>{const M="math";
const fv=(n,d)=>n/d;
const cp=(...p)=>{for(let i=0;i<p.length;i+=2)if(gcd(p[i],p[i+1])!==1||p[i]===p[i+1])return false;return true};
const PR=s=>String(s).startsWith("−")&&!String(s).includes("[[")?"("+s+")":s;
const frDis=(n,d,extra)=>{const c=[[d,n],[n+1,d],[n,d+1],[n*2,d],[n,d*2],[-n,d],[n-1,d]].concat(extra||[]);return c.filter(p=>p[1]!==0&&Math.abs(fv(...p)-n/d)>1e-9).map(p=>FR(p[0],p[1]))};

/* 0 — Introduction des nombres rationnels */
gen(M,0,1,()=>{const q=I(2,9),p=I(1,q-1),k=I(2,6);if(gcd(p,q)!==1)return null;
  return Q("Simplifie `"+FRraw(p*k,q*k)+"`.",FR(p,q),frDis(p,q,[[p*k,q]]),"On divise "+(p*k)+" et "+(q*k)+" par "+k+". | `"+(p*k)+"÷"+k+"="+p+"` et `"+(q*k)+"÷"+k+"="+q+"`. | Résultat : `"+FR(p,q)+"`.")});
gen(M,0,1,()=>{const a=I(1,9),b=I(2,9),m=I(2,6);return Q("Trouve `x` : `[["+a+"/"+b+"]]=[[x/"+(b*m)+"]]`",N(a*m),[N(a+m),N(a*m+1),N(b*m-a),N(a*b)],"`"+(b*m)+"="+b+"×"+m+"` | Donc `x="+a+"×"+m+"="+(a*m)+"`.")});
gen(M,0,1,()=>{const a=I(1,9),b=I(2,9),s=PK([["[[−"+a+"/"+b+"]]",-1],["[["+a+"/−"+b+"]]",-1],["[[−"+a+"/−"+b+"]]",1]]);
  return Q("`"+s[0]+"` est égal à :",FR(s[1]*a,b),[FR(-s[1]*a,b),FR(b,a),FR(-s[1]*b,a)],"Deux signes « − » donnent « + ». | Un seul signe « − » : le quotient est négatif.")});
gen(M,0,2,()=>{const q=I(3,12),p=I(1,q-1),k=I(3,9);if(gcd(p,q)!==1)return null;const s=RNG.sign();
  const shown=s<0?(RNG.coin()?"[[−"+(p*k)+"/"+(q*k)+"]]":"[["+(p*k)+"/−"+(q*k)+"]]"):"[["+(p*k)+"/"+(q*k)+"]]";
  return Q("Écris sous forme simplifiée : `"+shown+"`",FR(s*p,q),frDis(s*p,q,[[-s*p,q]]),"Cherche le plus grand diviseur commun de "+(p*k)+" et "+(q*k)+" : c'est "+k+". | Puis place le signe.")});
gen(M,0,2,()=>{const a=I(1,8),b=I(2,9),m=I(2,7);return Q("Trouve `x` : `[["+(a*m)+"/x]]=[["+a+"/"+b+"]]`",N(b*m),[N(b+m),N(a*b),N(b*m+a),N(m)],"Produit en croix : `"+(a*m)+"×"+b+"="+a+"×x`. | `x="+(a*m*b)+"÷"+a+"="+(b*m)+"`.")});
gen(M,0,3,()=>{const a=I(1,9),b=I(2,9);if(!cp(a,b))return null;const m=I(2,4),c=RNG.coin()?a*m:a*m+PK([1,-1]),d=b*m;const eq=a*d===b*c;
  return VF("`[["+a+"/"+b+"]]=[["+c+"/"+d+"]]`",eq,"Produit en croix : `"+a+"×"+d+"="+(a*d)+"` et `"+b+"×"+c+"="+(b*c)+"`. | "+(eq?"Les produits sont égaux : vrai.":"Les produits sont différents : faux."))});
gen(M,0,3,()=>{const q=I(5,15),p=I(2,q-1),k=I(6,13);if(gcd(p,q)!==1)return null;
  return Q("Forme irréductible de `"+FRraw(p*k,q*k)+"`",FR(p,q),frDis(p,q,[[p*k/ (k%2?1:2),q*k/(k%2?1:2)]]),"Le plus grand diviseur commun de "+(p*k)+" et "+(q*k)+" est "+k+". | On divise les deux par "+k+".")});
gen(M,0,3,()=>{const a=I(2,9),b=I(2,9),c=I(2,6);return Q("Trouve `x` : `[[x/"+b+"]]=[["+(a*c)+"/"+(b*c)+"]]`",N(a),[N(a*c),N(a+c),N(b),N(a*b)],"Simplifie d'abord `[["+(a*c)+"/"+(b*c)+"]]` par "+c+" : `[["+a+"/"+b+"]]`. | Donc `x="+a+"`.")});
gen(M,0,2,()=>{const q=PK([2,4,5,10,20,25]),p=I(1,q-1);if(gcd(p,q)!==1)return null;return Q("Écriture décimale de `[["+p+"/"+q+"]]`",N(p/q,3),[N(q/p,3),N(p/q*10,3),N((p+1)/q,3),N(p+q/10,2)],"On divise : `"+p+"÷"+q+"`.")});

/* 1 — Addition et soustraction */
const addHelp=(a,b,c,d,op)=>{const D=b*d/gcd(b,d),A=a*D/b,C=c*D/d,R=op>0?A+C:A-C;return"Dénominateur commun : `"+D+"`. | `"+FRraw(a,b)+"="+FRraw(A,D)+"` et `"+FRraw(c,d)+"="+FRraw(C,D)+"`. | "+(op>0?"`"+A+"+"+C:"`"+A+"−"+(C<0?"("+C+")":C))+"="+R+"` | Résultat : `"+FR(R,D)+"`."};
gen(M,1,1,()=>{const d=I(3,12),a=I(1,d-1),b=I(1,d-1),op=RNG.sign();const r=op>0?a+b:a-b;
  return Q("Calcule `[["+a+"/"+d+"]]"+(op>0?"+":"−")+"[["+b+"/"+d+"]]`",FR(r,d),[FR(r,2*d),FR(op>0?a-b:a+b,d),FR(a*b,d),FR(-r,d)],"Même dénominateur `"+d+"` : on calcule `"+a+(op>0?"+":"−")+b+"="+r+"`. | On garde `"+d+"` puis on simplifie.")});
gen(M,1,1,()=>{const d=I(2,6),m=I(2,4),a=I(1,d-1),b=I(1,d*m-1),op=RNG.sign();const D=d*m,r=op>0?a*m+b:a*m-b;
  return Q("Calcule `[["+a+"/"+d+"]]"+(op>0?"+":"−")+"[["+b+"/"+D+"]]`",FR(r,D),[FR(op>0?a+b:a-b,d+D),FR(op>0?a+b:a-b,D),FR(-r,D),FR(r+1,D)],"`"+D+"` est un multiple de `"+d+"`. | `"+FRraw(a,d)+"="+FRraw(a*m,D)+"` | `"+(a*m)+(op>0?"+":"−")+b+"="+r+"`")});
gen(M,1,2,()=>{let b=I(2,9),d=I(2,9);if(b===d)return null;const a=I(1,9),c=I(1,9);if(!cp(a,b,c,d))return null;const op=RNG.sign(),D=b*d/gcd(b,d),r=op>0?a*D/b+c*D/d:a*D/b-c*D/d;
  return Q("Calcule `[["+a+"/"+b+"]]"+(op>0?"+":"−")+"[["+c+"/"+d+"]]`",FR(r,D),[FR(op>0?a+c:a-c,b+d),FR(-r,D),FR(r+1,D),FR(op>0?a*d+c*b:a*d-c*b,b+d)],addHelp(a,b,c,d,op))});
gen(M,1,2,()=>{const n=I(1,4),b=I(2,9),a=I(1,b-1),op=RNG.sign();const r=op>0?n*b+a:n*b-a;
  return Q("Calcule `"+n+(op>0?"+":"−")+"[["+a+"/"+b+"]]`",FR(r,b),[FR(n+a,b),FR(op>0?n+a:n-a,1+b),FR(-r,b),FR(r+b,b)],"`"+n+"=[["+(n*b)+"/"+b+"]]` | `"+(n*b)+(op>0?"+":"−")+a+"="+r+"`")});
gen(M,1,2,()=>{let b=I(2,8),d=I(2,8);if(b===d)return null;const a=I(1,7),c=I(1,7),D=b*d/gcd(b,d),r=-a*D/b-c*D/d;
  return Q("Calcule `[[−"+a+"/"+b+"]]−[["+c+"/"+d+"]]`",FR(r,D),[FR(-r,D),FR(-a*D/b+c*D/d,D),FR(-a-c,b+d)],"Dénominateur commun : `"+D+"`. | `−"+(a*D/b)+"−"+(c*D/d)+"="+r+"` | Résultat : `"+FR(r,D)+"`.")});
gen(M,1,3,()=>{const b=I(2,6),d=I(2,6),f=I(2,6);if(new Set([b,d,f]).size<3)return null;const a=I(1,b-1),c=I(1,d-1),e=I(1,f-1);if(!cp(a,b,c,d,e,f))return null;const D=[b,d,f].reduce((x,y)=>x*y/gcd(x,y));
  const s2=RNG.sign(),s3=RNG.sign(),r=a*D/b+s2*c*D/d+s3*e*D/f;
  return Q("Calcule `[["+a+"/"+b+"]]"+(s2>0?"+":"−")+"[["+c+"/"+d+"]]"+(s3>0?"+":"−")+"[["+e+"/"+f+"]]`",FR(r,D),[FR(-r,D),FR(r+D,D*2),FR(a+s2*c+s3*e,b+d+f),FR(r-1,D)],"Dénominateur commun de "+b+", "+d+" et "+f+" : `"+D+"`. | On transforme chaque fraction. | On additionne les numérateurs : `"+r+"`.")});
gen(M,1,3,()=>{let b=I(2,9),d=I(2,9);if(b===d)return null;const a=I(1,9),c=I(1,9);if(!cp(a,b,c,d))return null;const D=b*d/gcd(b,d),r=a*D/b+c*D/d;
  return GAP("`[["+a+"/"+b+"]]+[["+c+"/"+d+"]]` : le dénominateur commun est ___ et le numérateur de la somme est ___.",[N(D),N(r)],[N(b+d),N(a+c),N(b*d===D?b*d+1:b*d)],addHelp(a,b,c,d,1))});
gen(M,1,3,()=>{const x=I(1,3),b=PK([3,4,5,6]),a=I(1,b-1);const tot=x*b+a;const used=I(1,tot-1);if(used===tot)return null;
  return Q("Sara lit `[["+a+"/"+b+"]]` d'un livre le matin et `[["+used+"/"+(b*2)+"]]` le soir. Quelle fraction a-t-elle lue ?",FR(2*a+used,2*b),[FR(a+used,3*b),FR(a+used,b),FR(2*a+used,b)],"Dénominateur commun : `"+(2*b)+"`. | `[["+a+"/"+b+"]]=[["+(2*a)+"/"+(2*b)+"]]` | `"+(2*a)+"+"+used+"="+(2*a+used)+"`")});

/* 2 — Symétrie axiale */
gen(M,2,1,()=>{const l=N(I(15,95)/10);return Q("`AB = "+l+" cm`. `[A'B']` est le symétrique de `[AB]` par rapport à `(D)`. `A'B'` =",l+" cm",[N(parseFloat(l.replace(",","."))*2)+" cm",N(parseFloat(l.replace(",","."))/2)+" cm"],"La symétrie axiale conserve les longueurs.")});
gen(M,2,1,()=>{const a=I(20,160);return Q("Un angle mesure `"+a+"°`. Son symétrique par rapport à une droite mesure :",N(a)+"°",[N(180-a)+"°",N(a*2)+"°",N(90)+"°"],"La symétrie axiale conserve les angles.")});
gen(M,2,2,()=>{const a=I(3,9),b=I(3,9),c=I(3,9);if(a+b<=c||a+c<=b||b+c<=a)return null;return Q("Un triangle a des côtés de `"+a+" cm`, `"+b+" cm` et `"+c+" cm`. Quel est le périmètre de son symétrique ?",N(a+b+c)+" cm",[N(2*(a+b+c))+" cm",N((a+b+c)/2)+" cm",N(a*b)+" cm"],"Le symétrique a les mêmes côtés. | `"+a+"+"+b+"+"+c+"="+(a+b+c)+"`")});
gen(M,2,2,()=>{const x=I(3,12),y=I(2,10);return Q("`M` est sur la médiatrice de `[AB]`. `MA = "+x+" cm` et `AB = "+y+" cm`. Périmètre du triangle `MAB` ?",N(2*x+y)+" cm",[N(x+y)+" cm",N(2*x)+" cm",N(2*y+x)+" cm"],"`M` est sur la médiatrice : `MB=MA="+x+"`. | `"+x+"+"+x+"+"+y+"="+(2*x+y)+"`")});
gen(M,2,3,()=>{const a=2*I(10,70);const b=(180-a)/2;return Q("`ABC` est isocèle en `A` : la médiatrice de `[BC]` est un axe de symétrie. `Â="+a+"°`. Combien mesure `B̂` ?",N(b)+"°",[N(180-a)+"°",N(a/2)+"°",N(90-a/2+10)+"°"],"Par symétrie `B̂=Ĉ`. | `B̂+Ĉ=180−"+a+"="+(180-a)+"` | `B̂="+(180-a)+"÷2="+b+"°`")});
gen(M,2,3,()=>{const b=I(25,80);const a=180-2*b;return Q("`ABC` est isocèle en `A`. `B̂="+b+"°`. Combien mesure `Â` ?",N(a)+"°",[N(b)+"°",N(180-b)+"°",N(90-b)+"°"],"`Ĉ=B̂="+b+"°` (symétrie). | `Â=180−"+b+"−"+b+"="+a+"°`")});

/* 3 — Multiplication et division */
gen(M,3,1,()=>{const a=I(1,9),b=I(2,9),c=I(1,9),d=I(2,9);if(!cp(a,b,c,d))return null;return Q("Calcule `[["+a+"/"+b+"]]×[["+c+"/"+d+"]]`",FR(a*c,b*d),[FR(a+c,b+d),FR(a*d,b*c),FR(a*c,b+d)],"En haut : `"+a+"×"+c+"="+(a*c)+"`. | En bas : `"+b+"×"+d+"="+(b*d)+"`. | On simplifie si possible.")});
gen(M,3,1,()=>{const a=I(1,9),b=I(2,9),s=RNG.sign();if(a===b)return null;return Q("L'inverse de `"+FR(s*a,b)+"` est :",FR(s*b,a),[FR(-s*b,a),FR(-s*a,b),FR(s*a,b)].filter(x=>x!==FR(s*b,a)),"On retourne la fraction. | Le signe ne change pas.")});
gen(M,3,2,()=>{const a=I(1,9),b=I(2,9),c=I(1,9),d=I(2,9),s=RNG.sign(),t=RNG.sign();if(!cp(a,b,c,d))return null;return Q("Calcule `"+FR(s*a,b)+"÷"+PR(FR(t*c,d))+"`",FR(s*t*a*d,b*c),[FR(s*t*a*c,b*d),FR(-s*t*a*d,b*c),FR(s*t*b*c,a*d)],"Diviser = multiplier par l'inverse. | `"+FR(s*a,b)+"×"+FR(t*d,c)+"` | Signe : "+(s*t>0?"positif":"négatif")+".")});
gen(M,3,2,()=>{const a=I(1,9),b=I(2,9),n=I(2,12),s=RNG.sign();return Q("Calcule `"+N(s*n)+"×[["+a+"/"+b+"]]`",FR(s*n*a,b),[FR(s*a,n*b),FR(-s*n*a,b),FR(s*(n+a),b)],"`"+N(s*n)+"×"+a+"="+N(s*n*a)+"` | On garde le dénominateur `"+b+"` puis on simplifie.")});
gen(M,3,3,()=>{const a=I(1,6),b=I(2,6),c=I(1,6),d=I(2,6),e=I(1,6),f=I(2,6),s=RNG.sign();if(!cp(a,b,c,d,e,f))return null;return Q("Calcule `[["+a+"/"+b+"]]×"+PR(FR(s*c,d))+"×[["+e+"/"+f+"]]`",FR(s*a*c*e,b*d*f),[FR(-s*a*c*e,b*d*f),FR(s*(a+c+e),b+d+f),FR(s*a*c*e,b+d+f)],"Numérateurs : `"+a+"×"+c+"×"+e+"="+(a*c*e)+"`. | Dénominateurs : `"+b+"×"+d+"×"+f+"="+(b*d*f)+"`. | Signe et simplification.")});
gen(M,3,3,()=>{const a=I(1,6),b=I(2,6),c=I(1,6),d=I(2,6),e=I(1,6),f=I(2,6);if(!cp(a,b,c,d,e,f))return null;return Q("Calcule `([["+a+"/"+b+"]]÷[["+c+"/"+d+"]])×[["+e+"/"+f+"]]`",FR(a*d*e,b*c*f),[FR(a*c*e,b*d*f),FR(b*c*e,a*d*f),FR(a*d*f,b*c*e)],"`[["+a+"/"+b+"]]÷[["+c+"/"+d+"]]="+FR(a*d,b*c)+"` | Puis × `[["+e+"/"+f+"]]`.")});
gen(M,3,3,()=>{const n=PK([12,18,24,30,36,40,48,60]),b=PK([2,3,4,5,6]),a=I(1,b-1);if(n%b)return null;return Q("Un élève a `"+n+" DH`. Il dépense les `[["+a+"/"+b+"]]` de son argent. Combien dépense-t-il ?",N(n*a/b)+" DH",[N(n/b)+" DH",N(n-n*a/b)+" DH",N(n*b/a)+" DH"],"`[["+a+"/"+b+"]]` de `"+n+"` = `[["+a+"/"+b+"]]×"+n+"` | `"+n+"÷"+b+"×"+a+"="+(n*a/b)+"`")});

/* 4 — Triangle et parallèles */
gen(M,4,1,()=>{const bc=I(4,20);const fig="triMid:BC="+N(bc)+" cm|IJ=?";const E=Q("`I` et `J` sont les milieux de `[AB]` et `[AC]`. `BC="+bc+" cm`. `IJ` =",N(bc/2)+" cm",[N(bc*2)+" cm",N(bc)+" cm",N(bc/4)+" cm"],"`IJ` est la moitié de `BC`. | `"+bc+"÷2="+N(bc/2)+"`");if(E)E.fig=fig;return E});

DET("math",[
/*0*/{d:[["Qu'est-ce qu'un nombre rationnel ?","Quand on partage une quantité en parts égales, on obtient une fraction. Le nombre `[[a/b]]` est le résultat de la division de `a` par `b`. On l'appelle un quotient, ou un nombre rationnel. Le dénominateur `b` ne peut jamais être `0`, car on ne peut pas partager en zéro parts."],
 ["Écritures égales d'un même nombre","Un même nombre peut s'écrire de plusieurs façons : `[[1/2]]=[[2/4]]=[[3/6]]=0,5`. Pour passer d'une écriture à l'autre, on multiplie ou on divise le numérateur et le dénominateur par le même nombre (jamais par 0). Quand on divise, on simplifie. Une fraction est irréductible quand on ne peut plus la simplifier."],
 ["Le signe d'un quotient","On applique la règle des signes de la division : si le numérateur et le dénominateur ont le même signe, le quotient est positif ; s'ils ont des signes contraires, il est négatif. On écrit d'habitude le signe « − » devant la fraction ou au numérateur : `[[3/−4]]=[[−3/4]]`."],
 ["Le produit en croix","Deux quotients `[[a/b]]` et `[[c/d]]` sont égaux si et seulement si `a×d=b×c`. Cette règle sert à vérifier une égalité ou à trouver un nombre inconnu."]],
 wx:[["Simplifier `[[42/56]]`.",["On cherche un diviseur commun à 42 et 56 : les deux sont dans la table de 7.","`42÷7=6` et `56÷7=8`, donc `[[42/56]]=[[6/8]]`.","6 et 8 sont pairs : on divise encore par 2.","`[[6/8]]=[[3/4]]`. On ne peut plus simplifier : c'est la forme irréductible."]],
  ["Trouver `x` tel que `[[x/15]]=[[4/6]]`.",["On simplifie d'abord `[[4/6]]=[[2/3]]`.","`15=3×5`, donc on multiplie le haut et le bas de `[[2/3]]` par 5.","`[[2/3]]=[[10/15]]`.","Donc `x=10`. Vérification par produit en croix : `10×6=60` et `15×4=60`."]]]},
/*1*/{d:[["Additionner avec le même dénominateur","Si les deux fractions ont le même dénominateur, les parts ont la même taille. On additionne seulement le nombre de parts, c'est-à-dire les numérateurs, et on garde le dénominateur : `[[2/9]]+[[5/9]]=[[7/9]]`."],
 ["Réduire au même dénominateur","Si les dénominateurs sont différents, on ne peut pas additionner directement. On cherche un dénominateur commun, de préférence le plus petit multiple commun des deux dénominateurs. Puis on transforme chaque fraction en multipliant le haut et le bas par le même nombre."],
 ["Soustraction et nombres négatifs","Soustraire, c'est ajouter l'opposé : `[[1/3]]−[[−1/6]]=[[1/3]]+[[1/6]]`. On fait attention aux signes en additionnant les numérateurs, puis on simplifie le résultat."],
 ["Ajouter un entier et une fraction","On écrit l'entier comme une fraction de même dénominateur : `2+[[3/5]]=[[10/5]]+[[3/5]]=[[13/5]]`."]],
 wx:[["Calculer `[[5/6]]−[[3/4]]`.",["Multiples de 6 : 6, 12, 18… Multiples de 4 : 4, 8, 12… Le dénominateur commun est 12.","`[[5/6]]=[[10/12]]` (on multiplie par 2) et `[[3/4]]=[[9/12]]` (on multiplie par 3).","`[[10/12]]−[[9/12]]=[[1/12]]`.","Résultat : `[[1/12]]`."]],
  ["Calculer `[[−2/3]]+[[1/2]]−[[1/6]]`.",["Dénominateur commun de 3, 2 et 6 : c'est 6.","`[[−2/3]]=[[−4/6]]` et `[[1/2]]=[[3/6]]`.","`[[−4/6]]+[[3/6]]−[[1/6]]=[[−4+3−1/6]]=[[−2/6]]`.","On simplifie par 2 : `[[−1/3]]`."]]]},
/*2*/{d:[["Le symétrique d'un point","Le symétrique du point `M` par rapport à la droite `(D)` est le point `M'` tel que `(D)` soit la médiatrice du segment `[MM']`. Pour le construire : on trace la perpendiculaire à `(D)` qui passe par `M`, puis on reporte la même distance de l'autre côté."],
 ["Ce que conserve la symétrie","Une figure et son symétrique sont superposables : on peut plier la feuille le long de l'axe et les deux figures se recouvrent. Donc la symétrie conserve les longueurs, les angles, les aires, le parallélisme et l'alignement."],
 ["La médiatrice d'un segment","La médiatrice de `[AB]` est la droite perpendiculaire à `[AB]` en son milieu. Tout point de la médiatrice est à égale distance de `A` et de `B`. Et réciproquement, un point équidistant de `A` et `B` est sur la médiatrice."],
 ["Axes de symétrie d'une figure","Une droite est un axe de symétrie d'une figure si la figure est son propre symétrique. Le triangle isocèle a 1 axe, le rectangle et le losange 2, le triangle équilatéral 3, le carré 4, le cercle une infinité."]],
 wx:[["`ABC` est isocèle en `A` avec `Â=40°`. Calculer `B̂`.",["La médiatrice de `[BC]` est un axe de symétrie du triangle.","Par symétrie, `B̂=Ĉ`.","La somme des angles vaut `180°` : `B̂+Ĉ=180−40=140°`.","Donc `B̂=140÷2=70°`."]],
  ["`M` est sur la médiatrice de `[AB]`, `MA=6 cm`, `AB=5 cm`. Périmètre de `MAB` ?",["`M` est sur la médiatrice, donc `MB=MA=6 cm`.","Périmètre `=MA+MB+AB`.","`6+6+5=17`.","Le périmètre est `17 cm`."]]]},
/*3*/{d:[["Multiplier deux quotients","On multiplie les numérateurs entre eux et les dénominateurs entre eux : `[[a/b]]×[[c/d]]=[[a×c/b×d]]`. Il n'y a pas besoin de dénominateur commun. On applique la règle des signes : deux facteurs de même signe donnent un produit positif."],
 ["Simplifier avant de calculer","Avant de multiplier, on peut simplifier un numérateur avec un dénominateur, même s'ils sont dans deux fractions différentes. Exemple : `[[4/9]]×[[3/8]]` : on simplifie 4 avec 8 et 3 avec 9, on obtient `[[1/3]]×[[1/2]]=[[1/6]]`."],
 ["L'inverse","Deux nombres sont inverses si leur produit vaut 1. L'inverse de `[[a/b]]` est `[[b/a]]`. Le nombre 0 n'a pas d'inverse. Attention : l'inverse garde le même signe, alors que l'opposé change le signe."],
 ["Diviser","Diviser par un nombre non nul, c'est multiplier par son inverse : `[[a/b]]÷[[c/d]]=[[a/b]]×[[d/c]]`."]],
 wx:[["Calculer `[[−6/5]]÷[[9/10]]`.",["On remplace la division par la multiplication par l'inverse : `[[−6/5]]×[[10/9]]`.","Signe : négatif × positif = négatif.","On simplifie : 6 et 9 par 3 ; 10 et 5 par 5 → `[[−2/1]]×[[2/3]]`.","Résultat : `[[−4/3]]`."]],
  ["Sara a 120 DH. Elle dépense les `[[3/8]]`. Combien lui reste-t-il ?",["Elle dépense `[[3/8]]×120`.","`120÷8=15`, puis `15×3=45` DH.","Il reste `120−45=75` DH.","Autre méthode : il reste `[[5/8]]` de 120, soit `75` DH."]]]},
/*4*/{d:[["La droite des milieux","Dans un triangle `ABC`, si `I` est le milieu de `[AB]` et `J` le milieu de `[AC]`, alors la droite `(IJ)` est parallèle à `(BC)`. On l'appelle souvent la droite des milieux."],
 ["La longueur du segment des milieux","Dans la même situation, `IJ=[[BC/2]]`. Le segment qui joint les milieux de deux côtés mesure la moitié du troisième côté."],
 ["La réciproque utile","Si une droite passe par le milieu d'un côté et est parallèle à un deuxième côté, alors elle coupe le troisième côté en son milieu. Cette propriété sert à démontrer qu'un point est un milieu."],
 ["Rédiger une démonstration","On écrit toujours trois parties : 1) ce que l'on sait (les données) ; 2) la propriété utilisée ; 3) la conclusion. Cette méthode est demandée dans les devoirs."]],
 wx:[["`ABC` : `AB=8`, `AC=10`, `BC=12`. `I`, `J` milieux de `[AB]`, `[AC]`. Périmètre de `AIJ` ?",["`I` est le milieu de `[AB]`, donc `AI=8÷2=4`.","`J` est le milieu de `[AC]`, donc `AJ=10÷2=5`.","Droite des milieux : `IJ=BC÷2=6`.","Périmètre : `4+5+6=15`."]],
  ["Montrer que `IJKL` (milieux des côtés d'un quadrilatère `ABCD`) est un parallélogramme.",["Dans le triangle `ABC` : `(IJ)∥(AC)` et `IJ=[[AC/2]]`.","Dans le triangle `ACD` : `(LK)∥(AC)` et `LK=[[AC/2]]`.","Donc `(IJ)∥(LK)` et `IJ=LK`.","Un quadrilatère qui a deux côtés opposés parallèles et de même longueur est un parallélogramme."]]]},
/*5*/{d:[["L'ordre des opérations","Dans un calcul, on effectue d'abord les calculs entre parenthèses, puis les multiplications et les divisions de gauche à droite, et enfin les additions et soustractions de gauche à droite. Cette règle est la même pour les entiers, les décimaux et les fractions."],
 ["Une étape par ligne","Pour éviter les erreurs, on recopie le calcul à chaque étape en ne changeant qu'une opération. On souligne l'opération que l'on fait. C'est plus long, mais beaucoup plus sûr."],
 ["La distributivité","`k×(a+b)=k×a+k×b` et `k×(a−b)=k×a−k×b`. On peut l'utiliser dans les deux sens pour calculer plus vite : `7×13+7×7=7×(13+7)=7×20=140`."],
 ["Écrire un entier en fraction","Pour additionner un entier et une fraction, on écrit l'entier avec le même dénominateur : `3=[[12/4]]`."]],
 wx:[["Calculer `A=[[1/2]]−[[1/3]]×[[3/4]]`.",["La multiplication est prioritaire : `[[1/3]]×[[3/4]]=[[3/12]]=[[1/4]]`.","`A=[[1/2]]−[[1/4]]`.","`[[1/2]]=[[2/4]]`, donc `A=[[2/4]]−[[1/4]]`.","`A=[[1/4]]`."]],
  ["Calculer `B=([[2/3]]+[[1/6]])÷[[5/2]]`.",["Parenthèses : `[[2/3]]=[[4/6]]`, donc `[[4/6]]+[[1/6]]=[[5/6]]`.","`B=[[5/6]]÷[[5/2]]=[[5/6]]×[[2/5]]`.","On simplifie les 5 : `[[1/6]]×[[2/1]]=[[2/6]]`.","`B=[[1/3]]`."]]]},
/*6*/{d:[["La médiatrice","La médiatrice d'un côté est perpendiculaire à ce côté en son milieu. Les trois médiatrices d'un triangle se coupent en un point `O`, centre du cercle qui passe par les trois sommets (cercle circonscrit) : `OA=OB=OC`."],
 ["La hauteur","La hauteur issue d'un sommet est la droite qui passe par ce sommet et qui est perpendiculaire au côté opposé. Les trois hauteurs se coupent en un point `H` appelé orthocentre. La hauteur sert à calculer l'aire : `aire=[[base×hauteur/2]]`."],
 ["La médiane et le centre de gravité","La médiane issue d'un sommet relie ce sommet au milieu du côté opposé. Les trois médianes se coupent en `G`, le centre de gravité. `G` est situé aux deux tiers de chaque médiane en partant du sommet : `AG=[[2/3]]AM` et `GM=[[1/3]]AM`."],
 ["La bissectrice","La bissectrice d'un angle le partage en deux angles égaux. Les trois bissectrices se coupent au centre du cercle inscrit (cercle qui touche les trois côtés)."]],
 wx:[["La médiane `[AM]` mesure `12 cm`. Calculer `AG` et `GM`.",["`AG=[[2/3]]×AM`.","`12÷3=4`, puis `4×2=8` : `AG=8 cm`.","`GM=AM−AG=12−8=4 cm`.","Vérification : `GM` est bien le tiers de `AM`."]],
  ["Dans `ABC`, `B̂=50°` et `Ĉ=70°`. La bissectrice de `Â` coupe `[BC]` en `D`. Calculer `BÂD`.",["Somme des angles : `Â=180−50−70=60°`.","La bissectrice partage `Â` en deux angles égaux.","`BÂD=60÷2=30°`."]]]},
/*7*/{d:[["Définition","`aⁿ` est le produit de `n` facteurs égaux à `a`. Exemple : `5³=5×5×5=125`. On lit « 5 puissance 3 » ou « 5 au cube ». Par convention `a¹=a` et `a⁰=1` (avec `a≠0`)."],
 ["Exposants négatifs","`a⁻ⁿ` est l'inverse de `aⁿ` : `a⁻ⁿ=[[1/aⁿ]]`. Exemple : `10⁻²=[[1/100]]=0,01`."],
 ["Les règles de calcul","Même base : `aⁿ×aᵐ=aⁿ⁺ᵐ` et `[[aⁿ/aᵐ]]=aⁿ⁻ᵐ`. Puissance d'une puissance : `(aⁿ)ᵐ=aⁿˣᵐ`. Même exposant : `aⁿ×bⁿ=(a×b)ⁿ`. Attention : on n'additionne jamais les bases."],
 ["Le signe","`(−a)ⁿ` est positif si `n` est pair et négatif si `n` est impair. Ne pas confondre `(−2)⁴=16` et `−2⁴=−16` : sans parenthèses, le signe « − » ne fait pas partie de la puissance."],
 ["L'écriture scientifique","Elle s'écrit `a×10ⁿ` avec `1≤a<10`. Elle sert pour les très grands et très petits nombres. Exemple : la distance Terre-Soleil `150 000 000 km=1,5×10⁸ km`."]],
 wx:[["Écrire `A=[[3⁵×3²/3⁴]]` sous forme d'une puissance puis calculer.",["Numérateur : `3⁵×3²=3⁵⁺²=3⁷`.","`A=[[3⁷/3⁴]]=3⁷⁻⁴=3³`.","`3³=3×3×3=27`."]],
  ["Écriture scientifique de `B=(4×10⁵)×(3×10⁻²)`.",["On regroupe : `(4×3)×(10⁵×10⁻²)`.","`4×3=12` et `10⁵×10⁻²=10³`.","`B=12×10³`, mais 12 n'est pas entre 1 et 10.","`12=1,2×10`, donc `B=1,2×10⁴`."]]]},
/*8*/{d:[["Expression littérale","Une expression littérale contient des lettres qui représentent des nombres. On peut supprimer le signe × devant une lettre ou une parenthèse : `3×x=3x` et `2×(x+1)=2(x+1)`."],
 ["Développer","Développer, c'est transformer un produit en somme. Simple distributivité : `k(a+b)=ka+kb`. Double distributivité : `(a+b)(c+d)=ac+ad+bc+bd` : chaque terme de la première parenthèse multiplie chaque terme de la deuxième."],
 ["Réduire","Réduire, c'est regrouper les termes de même nature : les `x²` ensemble, les `x` ensemble, les nombres ensemble. `3x+2−5x+7=−2x+9`."],
 ["Factoriser","Factoriser, c'est transformer une somme en produit en mettant en évidence un facteur commun : `ka+kb=k(a+b)`. Pour vérifier, on redéveloppe et on doit retrouver l'expression de départ."],
 ["Supprimer des parenthèses","Une parenthèse précédée de « + » : on garde les signes. Précédée de « − » : on change tous les signes à l'intérieur."]],
 wx:[["Développer et réduire `A=(2x−3)(x+4)`.",["`2x×x=2x²`.","`2x×4=8x` et `−3×x=−3x`.","`−3×4=−12`.","`A=2x²+8x−3x−12=2x²+5x−12`."]],
  ["Factoriser `B=6x²−9x`.",["Facteur commun de 6 et 9 : 3. Facteur commun de `x²` et `x` : `x`.","Donc le facteur commun est `3x`.","`6x²=3x×2x` et `9x=3x×3`.","`B=3x(2x−3)`. Vérification : `3x×2x−3x×3=6x²−9x`."]]]},
/*9*/{d:[["Cercle circonscrit d'un triangle rectangle","Si un triangle est rectangle, alors le milieu de son hypoténuse est le centre de son cercle circonscrit. Le rayon de ce cercle est la moitié de l'hypoténuse."],
 ["La médiane relative à l'hypoténuse","Dans un triangle `ABC` rectangle en `A`, si `I` est le milieu de `[BC]`, alors `IA=IB=IC=[[BC/2]]`."],
 ["Démontrer qu'un triangle est rectangle (1)","Si un triangle est inscrit dans un cercle et qu'un de ses côtés est un diamètre, alors ce triangle est rectangle. L'angle droit est au sommet opposé au diamètre."],
 ["Démontrer qu'un triangle est rectangle (2)","Si la médiane issue d'un sommet mesure la moitié du côté opposé, alors le triangle est rectangle en ce sommet."]],
 wx:[["`ABC` rectangle en `A`, `BC=9 cm`. `I` milieu de `[BC]`. Calculer `AI` et le rayon du cercle circonscrit.",["Le triangle est rectangle en `A` et `[BC]` est l'hypoténuse.","Propriété : `AI=[[BC/2]]=9÷2=4,5 cm`.","Le centre du cercle circonscrit est `I`, le rayon est `IB=4,5 cm`."]],
  ["`[EF]` est un diamètre d'un cercle `(C)`. `G` est un point de `(C)`. Quelle est la nature de `EFG` ?",["`G` est sur le cercle de diamètre `[EF]`.","Propriété : un triangle inscrit dans un cercle avec un côté diamètre est rectangle.","Donc `EFG` est rectangle en `G`."]]]},
/*10*/{d:[["Le vocabulaire","Dans un triangle rectangle, le côté opposé à l'angle droit s'appelle l'hypoténuse. C'est le plus long des trois côtés."],
 ["Le théorème de Pythagore","Si un triangle `ABC` est rectangle en `A`, alors `BC²=AB²+AC²`. On l'utilise pour calculer la longueur d'un côté quand on connaît les deux autres."],
 ["Calculer un côté de l'angle droit","On transforme l'égalité : `AC²=BC²−AB²`. Puis on prend la racine carrée. La calculatrice donne souvent une valeur approchée qu'on arrondit."],
 ["La réciproque","Si dans un triangle `BC²=AB²+AC²` (avec `BC` le plus grand côté), alors le triangle est rectangle en `A`. Si l'égalité est fausse, le triangle n'est pas rectangle."]],
 wx:[["`ABC` rectangle en `A`, `AB=5 cm`, `AC=12 cm`. Calculer `BC`.",["Le triangle est rectangle en `A`, d'après le théorème de Pythagore : `BC²=AB²+AC²`.","`BC²=5²+12²=25+144=169`.","`BC=√169=13`.","`BC=13 cm`."]],
  ["Le triangle `EFG` a des côtés `EF=8`, `FG=15`, `EG=17`. Est-il rectangle ?",["Le plus grand côté est `EG=17`.","`EG²=17²=289`.","`EF²+FG²=64+225=289`.","Les deux résultats sont égaux : d'après la réciproque, `EFG` est rectangle en `F`."]]]},
/*11*/{d:[["Côté adjacent et hypoténuse","Dans un triangle rectangle, pour un angle aigu, l'hypoténuse est le côté opposé à l'angle droit, et le côté adjacent est l'autre côté qui forme l'angle."],
 ["Définition du cosinus","`cos B̂=[[côté adjacent à B̂/hypoténuse]]`. C'est un nombre sans unité, toujours compris entre 0 et 1 pour un angle aigu."],
 ["Calculer une longueur","Si on connaît l'hypoténuse et l'angle : `adjacent=hypoténuse×cos`. Si on connaît l'adjacent et l'angle : `hypoténuse=adjacent÷cos`."],
 ["Calculer un angle","Avec la calculatrice en mode degrés, on utilise la touche `cos⁻¹` (ou Arccos). Valeurs à retenir : `cos 60°=0,5`, `cos 45°≈0,71`, `cos 30°≈0,87`."]],
 wx:[["`ABC` rectangle en `A`, `BC=10`, `B̂=60°`. Calculer `AB`.",["Le côté adjacent à `B̂` est `AB`, l'hypoténuse est `BC`.","`cos B̂=[[AB/BC]]` donc `AB=BC×cos B̂`.","`AB=10×cos 60°=10×0,5=5`."]],
  ["`ABC` rectangle en `A`, `AB=4`, `BC=8`. Calculer `B̂`.",["`cos B̂=[[AB/BC]]=[[4/8]]=0,5`.","Avec la calculatrice : `cos⁻¹(0,5)=60°`.","`B̂=60°`."]]]},
/*12*/{d:[["Qu'est-ce qu'une équation ?","Une équation est une égalité qui contient un nombre inconnu, souvent noté `x`. Résoudre l'équation, c'est trouver toutes les valeurs de `x` qui rendent l'égalité vraie. Ces valeurs sont les solutions."],
 ["Les deux règles","Règle 1 : on peut ajouter ou soustraire le même nombre aux deux membres. Règle 2 : on peut multiplier ou diviser les deux membres par le même nombre non nul. Comme une balance : ce qu'on fait d'un côté, on le fait de l'autre."],
 ["La méthode","1) On développe si nécessaire. 2) On regroupe les termes en `x` d'un côté et les nombres de l'autre. 3) On divise par le coefficient de `x`. 4) On vérifie en remplaçant `x` dans l'équation de départ."],
 ["Mettre un problème en équation","On choisit l'inconnue (« Soit `x` le prix… »), on traduit l'énoncé par une équation, on la résout, puis on répond par une phrase avec l'unité."]],
 wx:[["Résoudre `5x−4=2x+11`.",["On enlève `2x` des deux côtés : `3x−4=11`.","On ajoute 4 des deux côtés : `3x=15`.","On divise par 3 : `x=5`.","Vérification : `5×5−4=21` et `2×5+11=21`. ✓"]],
  ["Un stylo coûte 3 DH de plus qu'un crayon. Ensemble ils coûtent 11 DH. Prix du crayon ?",["Soit `x` le prix du crayon. Le stylo coûte `x+3`.","Équation : `x+(x+3)=11`.","`2x+3=11`, donc `2x=8`, `x=4`.","Le crayon coûte 4 DH et le stylo 7 DH."]]]},
/*13*/{d:[["Le vecteur","Le vecteur {AB} est caractérisé par trois choses : sa direction (la droite `(AB)`), son sens (de `A` vers `B`) et sa longueur (la distance `AB`). On le dessine par une flèche."],
 ["Vecteurs égaux","Deux vecteurs sont égaux s'ils ont la même direction, le même sens et la même longueur. {AB}`=`{DC} équivaut à : `ABCD` est un parallélogramme (attention à l'ordre des lettres)."],
 ["La translation","La translation de vecteur {AB} fait glisser chaque point `M` en un point `M'` tel que {MM'}`=`{AB}. La figure glisse sans tourner ni changer de taille : la translation conserve les longueurs, les angles, les aires et l'alignement."],
 ["La relation de Chasles","{AB}`+`{BC}`=`{AC}. Quand la fin du premier vecteur est le début du second, on peut « raccourcir » le chemin."]],
 wx:[["Simplifier {AB}`+`{CA}.",["On change l'ordre : {CA}`+`{AB}.","La fin du premier est `A`, le début du second est `A`.","Chasles : {CA}`+`{AB}`=`{CB}."]],
  ["`ABCD` est un parallélogramme. Compléter : {AB}`=`… et {AD}`=`…",["Dans un parallélogramme, les côtés opposés sont parallèles, de même longueur.","`[AB]` et `[DC]` sont opposés et vont dans le même sens : {AB}`=`{DC}.","De même : {AD}`=`{BC}."]]]},
/*14*/{d:[["Comparer des nombres relatifs","Un nombre négatif est toujours plus petit qu'un nombre positif. Entre deux négatifs, le plus petit est celui qui a la plus grande distance à zéro : `−8<−3`."],
 ["Comparer des fractions","Avec le même dénominateur positif, on compare les numérateurs. Sinon on réduit au même dénominateur, ou on compare les écritures décimales."],
 ["Ordre et addition","Si `a<b`, alors `a+c<b+c` et `a−c<b−c` : ajouter ou soustraire le même nombre ne change pas l'ordre."],
 ["Ordre et multiplication","Si `a<b` et `c>0`, alors `ac<bc`. Si `a<b` et `c<0`, alors `ac>bc` : multiplier par un négatif inverse le sens de l'inégalité."]],
 wx:[["Ranger dans l'ordre croissant : `[[2/3]]`, `[[−1/2]]`, `[[3/4]]`, `0`.",["Le seul négatif est `[[−1/2]]` : il est le plus petit.","Ensuite vient `0`.","Comparer `[[2/3]]` et `[[3/4]]` : `[[8/12]]` et `[[9/12]]`, donc `[[2/3]]<[[3/4]]`.","Ordre : `[[−1/2]]<0<[[2/3]]<[[3/4]]`."]],
  ["On sait que `x<5`. Comparer `−3x` et `−15`.",["On multiplie les deux membres de `x<5` par `−3`.","`−3` est négatif : le sens change.","`−3x>−15`."]]]},
/*15*/{d:[["Reconnaître la proportionnalité","Deux grandeurs sont proportionnelles si on passe de l'une à l'autre en multipliant toujours par le même nombre, appelé coefficient de proportionnalité. Dans un graphique, cela donne des points alignés avec l'origine."],
 ["La quatrième proportionnelle","Pour trouver une valeur manquante, on peut passer par l'unité, utiliser le coefficient, ou faire un produit en croix : si `[[a/b]]=[[c/x]]` alors `x=[[b×c/a]]`."],
 ["Les pourcentages","Prendre `t%` d'un nombre, c'est le multiplier par `[[t/100]]`. Une hausse de `t%` : nouveau prix `=prix×(1+[[t/100]])`. Une baisse de `t%` : `prix×(1−[[t/100]])`."],
 ["Vitesse et échelle","Vitesse moyenne : `v=[[d/t]]`, donc `d=v×t` et `t=[[d/v]]`. Attention aux unités : `1 h 30 min=1,5 h`. Échelle : distance sur le plan ÷ distance réelle, dans la même unité."]],
 wx:[["Un pantalon coûte 250 DH. Il est soldé à −20 %. Quel est son nouveau prix ?",["Calcul de la remise : `250×[[20/100]]=50` DH.","Nouveau prix : `250−50=200` DH.","Autre méthode : `250×0,8=200` DH."]],
  ["Un bus parcourt 135 km en 1 h 30 min. Vitesse moyenne ?",["On convertit la durée : `1 h 30 min=1,5 h`.","`v=[[d/t]]=135÷1,5`.","`v=90 km/h`."]]]},
/*16*/{d:[["Le vocabulaire","La population est l'ensemble étudié (les élèves d'une classe). Le caractère est ce qu'on observe (la note). L'effectif d'une valeur est le nombre de fois où elle apparaît. L'effectif total est la somme des effectifs."],
 ["Fréquence","La fréquence d'une valeur est `[[effectif/effectif total]]`. On peut l'écrire en décimal ou en pourcentage (× 100). La somme de toutes les fréquences vaut 1, soit 100 %."],
 ["Moyenne","Pour calculer la moyenne d'une série avec des effectifs, on multiplie chaque valeur par son effectif, on additionne ces produits, puis on divise par l'effectif total."],
 ["Représentations","Le diagramme en bâtons montre les effectifs. Le diagramme circulaire montre les parts : l'angle de chaque secteur est `fréquence×360°`. L'effectif cumulé additionne les effectifs des valeurs précédentes."]],
 wx:[["Notes : 10 (2 élèves), 12 (5 élèves), 15 (3 élèves). Calculer la moyenne.",["Effectif total : `2+5+3=10`.","Produits : `10×2=20`, `12×5=60`, `15×3=45`.","Somme : `20+60+45=125`.","Moyenne : `125÷10=12,5`."]],
  ["Dans la même série, angle du secteur de la note 12 ?",["Fréquence de 12 : `[[5/10]]=0,5`.","Angle : `0,5×360°=180°`."]]]},
/*17*/{d:[["La pyramide","Une pyramide a une base qui est un polygone (triangle, carré, rectangle…), un sommet `S`, et des faces latérales qui sont des triangles. La hauteur est le segment qui part du sommet et qui est perpendiculaire à la base."],
 ["Le cône de révolution","On l'obtient en faisant tourner un triangle rectangle autour d'un côté de l'angle droit. Sa base est un disque de rayon `r`. La génératrice relie le sommet à un point du cercle de base."],
 ["Les volumes","Pyramide : `V=[[B×h/3]]` où `B` est l'aire de la base. Cône : `V=[[π×r²×h/3]]`. Le volume d'une pyramide est le tiers du volume du prisme de même base et même hauteur."],
 ["Les unités","`1 dm³=1 L=1000 cm³` et `1 cm³=1 mL`. `1 m³=1000 L`. On vérifie que toutes les longueurs sont dans la même unité avant de calculer."]],
 wx:[["Pyramide à base rectangulaire `6 cm × 4 cm`, hauteur `5 cm`. Volume ?",["Aire de la base : `B=6×4=24 cm²`.","`V=[[24×5/3]]=[[120/3]]`.","`V=40 cm³`."]],
  ["Cône : rayon `3 cm`, hauteur `10 cm`. Volume exact puis arrondi ?",["`r²=9`.","`V=[[π×9×10/3]]=30π cm³`.","Avec `π≈3,14` : `V≈94,2 cm³`."]]]}
]);

DET("pc",[
/*0*/{d:[["Où se trouve l'air ?","L'air forme autour de la Terre une couche de gaz appelée atmosphère. Elle a une épaisseur de plusieurs centaines de kilomètres, mais la plus grande partie de l'air se trouve près du sol. Plus on monte en altitude, plus l'air devient rare : c'est pourquoi les alpinistes ont du mal à respirer en haute montagne."],
 ["Les rôles de l'atmosphère","L'atmosphère nous donne le dioxygène pour respirer. Elle garde la chaleur du Soleil pendant la nuit. La couche d'ozone, située en altitude, arrête une grande partie des rayons ultraviolets dangereux pour la peau et les yeux."],
 ["Mettre l'air en évidence","On ne voit pas l'air, mais on peut montrer qu'il existe : un ballon se gonfle, des bulles sortent d'une bouteille « vide » qu'on enfonce dans l'eau, le vent fait bouger les feuilles."]],
 wx:[["On enfonce une bouteille « vide » à l'envers dans l'eau, puis on l'incline. Que se passe-t-il ?",["Des bulles sortent de la bouteille.","Ces bulles sont de l'air.","Conclusion : la bouteille n'était pas vide, elle contenait de l'air."]]]},
/*1*/{d:[["L'air est compressible et expansible","Si on bouche une seringue et qu'on pousse le piston, le volume d'air diminue : l'air est compressible. Si on tire le piston, l'air occupe tout le volume disponible : il est expansible. Les particules d'air se rapprochent ou s'éloignent, mais leur nombre ne change pas."],
 ["La pression","Quand on comprime l'air, sa pression augmente. La pression se mesure avec un manomètre. Unités : le pascal (Pa), l'hectopascal (`1 hPa=100 Pa`) et le bar (`1 bar=100 000 Pa`). La pression atmosphérique, mesurée avec un baromètre, vaut environ `1013 hPa` au niveau de la mer."],
 ["L'air a une masse","Une bouteille gonflée d'air pèse plus lourd qu'une bouteille dégonflée. Dans les conditions habituelles, `1 L` d'air a une masse d'environ `1,3 g`, et `1 m³` environ `1,3 kg`."],
 ["La composition de l'air","L'air est un mélange : environ `78 %` de diazote `N₂`, `21 %` de dioxygène `O₂`, et `1 %` d'autres gaz (argon, dioxyde de carbone, vapeur d'eau). Environ un cinquième de l'air est du dioxygène."]],
 wx:[["Calculer la masse de l'air d'une classe de `8 m × 6 m × 3 m`.",["Volume : `8×6×3=144 m³`.","`1 m³` d'air ≈ `1,3 kg`.","Masse : `144×1,3=187,2 kg`.","L'air de la classe pèse environ `187 kg`."]],
  ["Convertir `2,5 bar` en pascals puis en hectopascals.",["`1 bar=100 000 Pa`.","`2,5×100 000=250 000 Pa`.","`1 hPa=100 Pa`, donc `250 000÷100=2500 hPa`."]]]},
/*2*/{d:[["Les atomes","Toute la matière est faite de particules minuscules : les atomes. Il en existe une centaine de sortes. Chaque sorte a un nom et un symbole : `H` hydrogène, `C` carbone, `N` azote, `O` oxygène. Le symbole commence toujours par une majuscule."],
 ["Les molécules","Une molécule est un assemblage d'atomes liés. On l'écrit avec une formule chimique : les symboles des atomes, avec en indice le nombre de chaque atome (on n'écrit pas l'indice 1). `CO₂` contient 1 atome de carbone et 2 atomes d'oxygène."],
 ["Corps simple et corps composé","Un corps pur simple est formé d'une seule sorte d'atomes (`O₂`, `N₂`, `H₂`). Un corps pur composé est formé de plusieurs sortes d'atomes (`H₂O`, `CO₂`, `CH₄`)."],
 ["Coefficient et indice","Dans `3H₂O`, le 3 devant est un coefficient : il y a 3 molécules d'eau. Le 2 en bas est un indice : 2 atomes H dans chaque molécule. Donc `3H₂O` contient `6` atomes H et `3` atomes O."]],
 wx:[["Combien d'atomes dans une molécule de butane `C₄H₁₀` ?",["`C₄` : 4 atomes de carbone.","`H₁₀` : 10 atomes d'hydrogène.","Total : `4+10=14` atomes."]],
  ["Combien d'atomes d'oxygène dans `2CO₂` ?",["Une molécule `CO₂` contient 2 atomes O.","Il y a 2 molécules.","`2×2=4` atomes d'oxygène."]]]},
/*3*/{d:[["Le triangle du feu","Une combustion est une réaction chimique qui a besoin de trois éléments : un combustible (ce qui brûle : bois, butane, carbone), un comburant (le dioxygène de l'air) et une source de chaleur pour démarrer. Si on supprime un des trois, le feu s'arrête."],
 ["La combustion du carbone","Le carbone brûle dans le dioxygène et produit du dioxyde de carbone : `carbone + dioxygène → dioxyde de carbone`. On reconnaît le dioxyde de carbone parce qu'il trouble l'eau de chaux."],
 ["Combustion complète et incomplète","Quand le dioxygène est suffisant, la flamme du butane est bleue : la combustion est complète et produit du dioxyde de carbone et de l'eau. Quand le dioxygène manque, la flamme est jaune : la combustion est incomplète et produit aussi de la suie (carbone) et du monoxyde de carbone `CO`."],
 ["Les dangers","Le monoxyde de carbone est un gaz toxique, sans odeur et sans couleur. Il peut tuer. Il faut toujours aérer quand un chauffe-eau ou un chauffage à gaz fonctionne, et faire vérifier les appareils."]],
 wx:[["On retourne un verre sur une bougie allumée. Explique ce qui se passe.",["La bougie brûle en consommant le dioxygène de l'air contenu dans le verre.","L'air ne se renouvelle pas.","Quand il n'y a plus assez de dioxygène, la combustion s'arrête : la flamme s'éteint."]],
  ["Comment montrer qu'une combustion produit du dioxyde de carbone ?",["On recueille le gaz produit dans un flacon.","On ajoute de l'eau de chaux et on agite.","Si l'eau de chaux se trouble, le gaz est du dioxyde de carbone."]]]},
/*4*/{d:[["Réactifs et produits","Au cours d'une réaction chimique, des corps disparaissent (les réactifs) et de nouveaux corps apparaissent (les produits). On écrit le bilan : `réactifs → produits`. La flèche se lit « donnent »."],
 ["La conservation de la masse","Lavoisier a montré que la masse totale des réactifs consommés est égale à la masse totale des produits formés. Rien ne se perd, rien ne se crée, tout se transforme."],
 ["La conservation des atomes","Pendant la réaction, les atomes ne disparaissent pas : ils se réarrangent pour former de nouvelles molécules. Il y a donc le même nombre de chaque sorte d'atome avant et après."],
 ["Équilibrer une équation","Pour respecter la conservation des atomes, on place des coefficients devant les formules. On ne change jamais les indices. Exemple : `2H₂ + O₂ → 2H₂O` (4 H et 2 O de chaque côté)."]],
 wx:[["`12 g` de carbone brûlent dans `32 g` de dioxygène. Masse de dioxyde de carbone ?",["Loi de Lavoisier : masse des réactifs = masse des produits.","`12+32=44`.","Il se forme `44 g` de dioxyde de carbone."]],
  ["Équilibrer : `CH₄ + O₂ → CO₂ + H₂O`.",["Carbone : 1 à gauche, 1 à droite. ✓","Hydrogène : 4 à gauche, il faut `2H₂O` à droite.","Oxygène à droite : `2` (dans `CO₂`) + `2` (dans `2H₂O`) = `4`, donc `2O₂` à gauche.","`CH₄ + 2O₂ → CO₂ + 2H₂O`."]]]},
/*5*/{d:[["Matières naturelles","Elles viennent directement de la nature : des végétaux (bois, coton, lin), des animaux (laine, cuir, soie) ou du sol (pierre, sable, pétrole). On peut les transformer un peu sans changer leur nature."],
 ["Matières synthétiques","Elles sont fabriquées par l'homme dans des usines par des réactions chimiques, souvent à partir du pétrole : plastiques, nylon, polyester. Elles sont légères, solides et peu chères."],
 ["Le problème des déchets","Beaucoup de plastiques mettent des centaines d'années à se dégrader. Ils polluent les sols, les rivières et la mer, et tuent des animaux. Il faut réduire leur usage, les réutiliser, les trier et les recycler."]],
 wx:[["Classe : laine, plastique, coton, nylon, bois.",["Naturelles : laine (mouton), coton (plante), bois (arbre).","Synthétiques : plastique et nylon (fabriqués à partir du pétrole)."]]]},
/*6*/{d:[["Les sources de pollution","L'air est pollué quand il contient des substances nocives pour la santé ou l'environnement. Les principales sources sont les usines, les moyens de transport, le chauffage et la combustion des déchets."],
 ["Les principaux polluants","Monoxyde de carbone `CO` (toxique), dioxyde de soufre `SO₂` (responsable des pluies acides), oxydes d'azote, fumées et poussières fines qui pénètrent dans les poumons."],
 ["Les conséquences","Maladies respiratoires (asthme, toux), pluies acides qui abîment les forêts et les monuments, augmentation de l'effet de serre qui réchauffe la planète."],
 ["Les solutions","Utiliser les transports en commun, le vélo ou la marche ; développer les énergies renouvelables (soleil, vent) ; installer des filtres dans les usines ; planter des arbres ; ne pas brûler les déchets."]],
 wx:[["Pourquoi les pluies acides abîment-elles les monuments en pierre ?",["Les usines rejettent du dioxyde de soufre dans l'air.","Ce gaz se mélange à l'eau des nuages : la pluie devient acide.","L'acide attaque lentement le calcaire des pierres."]]]},
/*7*/{d:[["Sources primaires et objets diffusants","Une source primaire produit sa propre lumière : le Soleil, une lampe allumée, une flamme. Un objet diffusant renvoie dans toutes les directions une partie de la lumière qu'il reçoit : la Lune, un mur, un livre. Sans lumière, on ne les voit pas."],
 ["Voir un objet","Pour voir un objet, il faut que la lumière venant de cet objet entre dans l'œil. L'œil est un récepteur de lumière. Les panneaux solaires et les appareils photo sont aussi des récepteurs."],
 ["Les milieux","Un milieu transparent (verre, air, eau claire) laisse passer la lumière et on voit nettement à travers. Un milieu translucide (papier calque, verre dépoli) laisse passer une partie de la lumière, mais on ne voit pas nettement. Un milieu opaque (bois, métal) arrête la lumière."]],
 wx:[["Pourquoi voit-on la Lune la nuit alors qu'elle ne produit pas de lumière ?",["La Lune est éclairée par le Soleil.","Elle renvoie une partie de cette lumière : c'est un objet diffusant.","Cette lumière arrive dans nos yeux : nous voyons la Lune."]]]},
/*8*/{d:[["La lumière blanche","La lumière du Soleil ou d'une lampe semble blanche, mais c'est en réalité un mélange de lumières de différentes couleurs."],
 ["La dispersion","Un prisme en verre décompose la lumière blanche : on obtient un spectre continu de couleurs, du rouge au violet. Ce phénomène s'appelle la dispersion. L'arc-en-ciel est une dispersion de la lumière du Soleil par les gouttes de pluie."],
 ["La couleur des objets","Un objet éclairé en lumière blanche absorbe certaines couleurs et diffuse les autres. Un objet rouge diffuse le rouge et absorbe le reste. Un objet blanc diffuse toutes les couleurs. Un objet noir les absorbe toutes."],
 ["Les filtres","Un filtre coloré ne laisse passer que la lumière de sa couleur. Une lumière rouge qui traverse un filtre vert est arrêtée : on ne voit plus rien."]],
 wx:[["Un ballon rouge est éclairé par une lumière verte. De quelle couleur paraît-il ?",["Le ballon rouge diffuse seulement le rouge.","La lumière verte ne contient pas de rouge.","Il absorbe le vert et ne renvoie rien : il paraît noir."]]]},
/*9*/{d:[["La propagation rectiligne","Dans un milieu transparent et homogène (le même partout), la lumière se propage en ligne droite. On le vérifie avec trois cartons percés : on voit la lampe seulement quand les trous sont alignés."],
 ["Rayons et faisceaux","On représente le trajet de la lumière par une droite avec une flèche qui indique le sens : c'est un rayon lumineux. Un ensemble de rayons forme un faisceau, qui peut être convergent, divergent ou parallèle."],
 ["La vitesse de la lumière","La lumière est très rapide : environ `300 000 km/s` dans le vide et dans l'air. Elle met environ `1,3 s` pour venir de la Lune et `8 min` pour venir du Soleil."]],
 wx:[["Combien de temps met la lumière du Soleil pour arriver sur Terre (`150 000 000 km`) ?",["`t=[[d/v]]=150 000 000÷300 000`.","`t=500 s`.","`500 s=8 min 20 s`."]]]},
/*10*/{d:[["Ombre propre et ombre portée","Un objet opaque éclairé par une source a une partie éclairée et une partie sombre : l'ombre propre. Derrière lui, sur un écran, apparaît une zone sombre : l'ombre portée. Les ombres existent parce que la lumière se propage en ligne droite."],
 ["Les éclipses","Éclipse de Soleil : la Lune passe entre le Soleil et la Terre ; son ombre tombe sur une partie de la Terre. Éclipse de Lune : la Terre passe entre le Soleil et la Lune ; la Lune entre dans l'ombre de la Terre. Ne jamais regarder le Soleil directement, même pendant une éclipse."],
 ["La chambre noire","C'est une boîte fermée avec un petit trou d'un côté et un écran de l'autre. Les rayons venant de l'objet se croisent dans le trou : l'image sur l'écran est renversée. Plus l'écran est loin du trou, plus l'image est grande."]],
 wx:[["On rapproche une lampe d'un objet. Comment change l'ombre portée ?",["Les rayons qui frôlent les bords de l'objet s'écartent davantage.","La zone que l'objet cache sur l'écran devient plus large.","L'ombre portée devient plus grande."]]]},
/*11*/{d:[["Deux sortes de lentilles","Une lentille convergente a les bords minces : elle fait converger la lumière. Une lentille divergente a les bords épais : elle fait diverger la lumière. On peut les reconnaître au toucher, ou en regardant un texte : la convergente grossit les lettres proches."],
 ["Foyer et distance focale","Un faisceau parallèle à l'axe optique converge, après une lentille convergente, en un point `F'` : le foyer image. La distance `OF'` entre le centre optique `O` et le foyer est la distance focale `f`."],
 ["La vergence","`C=[[1/f]]` avec `f` en mètres et `C` en dioptries (δ). Plus la vergence est grande, plus la lentille est convergente. Une lentille de `f=0,2 m` a une vergence de `5 δ`."],
 ["Construire une image","Trois rayons particuliers : celui qui passe par `O` n'est pas dévié ; celui qui arrive parallèle à l'axe ressort en passant par `F'` ; celui qui passe par `F` ressort parallèle à l'axe. L'image du point est à l'intersection de ces rayons."]],
 wx:[["Une lentille a une vergence de `4 δ`. Quelle est sa distance focale ?",["`f=[[1/C]]=[[1/4]]`.","`f=0,25 m`.","`f=25 cm`."]]]},
/*12*/{d:[["L'œil","L'œil fonctionne comme un appareil photo. Le cristallin est une lentille convergente. La rétine, au fond de l'œil, joue le rôle d'écran. Pour voir net, l'image doit se former exactement sur la rétine."],
 ["Les défauts de la vision","Œil myope : l'image se forme avant la rétine, on voit mal de loin. On corrige avec des lentilles divergentes. Œil hypermétrope : l'image se forme après la rétine, on voit mal de près. On corrige avec des lentilles convergentes."],
 ["La loupe","La loupe est une lentille convergente. On place l'objet entre la lentille et son foyer : on voit une image droite et agrandie."],
 ["L'appareil photo","L'objectif est une lentille convergente, le capteur (ou la pellicule) joue le rôle de l'écran. On règle la distance objectif-capteur pour obtenir une photo nette."]],
 wx:[["Un élève voit mal le tableau mais lit bien son livre. Quel est son défaut et comment le corriger ?",["Il voit mal de loin : il est myope.","Chez le myope, l'image se forme avant la rétine.","On le corrige avec des lunettes à lentilles divergentes."]]]},
/*13*/{d:[["Tension continue et alternative","Une pile donne une tension continue : elle garde toujours le même signe. La prise du secteur donne une tension alternative : elle change de signe régulièrement. Sa forme, vue sur un oscilloscope, est sinusoïdale."],
 ["Période et fréquence","La période `T` est la durée d'un motif complet, en secondes. La fréquence `f` est le nombre de motifs par seconde, en hertz : `f=[[1/T]]`. Au Maroc, le secteur a une fréquence de `50 Hz`, donc `T=0,02 s=20 ms`."],
 ["Lire un oscilloscope","Horizontalement : nombre de divisions × balayage (ms/div) donne la durée. Verticalement : nombre de divisions × sensibilité (V/div) donne la tension."],
 ["Tension maximale et efficace","`Umax` est la plus grande valeur atteinte. Le voltmètre en mode alternatif (~) mesure la tension efficace : `Ueff=[[Umax/√2]]≈[[Umax/1,41]]`. Pour le secteur : `Ueff=220 V` et `Umax≈311 V`."]],
 wx:[["Sur l'oscilloscope, une période occupe `4 div` avec un balayage de `5 ms/div`. Calculer `T` et `f`.",["`T=4×5=20 ms`.","`20 ms=0,02 s`.","`f=[[1/T]]=1÷0,02=50 Hz`."]],
  ["La courbe monte de `3 div` avec une sensibilité de `2 V/div`. Calculer `Umax` puis `Ueff`.",["`Umax=3×2=6 V`.","`Ueff=6÷1,41`.","`Ueff≈4,3 V`."]]]},
/*14*/{d:[["Phase, neutre et terre","Le courant arrive dans la maison par deux fils : la phase (dangereuse, sa tension par rapport à la terre est de 220 V) et le neutre. Le fil de terre, vert et jaune, est relié aux carcasses métalliques des appareils : il évacue le courant en cas de défaut."],
 ["Le tableau électrique","Le compteur mesure l'énergie consommée en kWh. Le disjoncteur général coupe tout en cas de problème. Le disjoncteur différentiel protège les personnes contre l'électrocution. Les fusibles ou petits disjoncteurs protègent chaque circuit contre les surintensités."],
 ["Montage en dérivation","Tous les appareils de la maison sont branchés en dérivation : chacun reçoit 220 V et fonctionne indépendamment des autres."],
 ["Puissance et énergie","`P=U×I` (en watts). L'énergie consommée dépend de la puissance et de la durée : `E=P×t`. Avec `P` en kW et `t` en h, `E` est en kWh. Le coût = énergie × prix du kWh."]],
 wx:[["Un fer à repasser de `1100 W` fonctionne 2 h. Énergie consommée et coût (`1,20 DH/kWh`) ?",["`1100 W=1,1 kW`.","`E=1,1×2=2,2 kWh`.","Coût : `2,2×1,20=2,64 DH`."]],
  ["Quel fusible choisir pour un appareil de `2200 W` sous `220 V` (fusibles de 6, 10, 16 A) ?",["`I=[[P/U]]=2200÷220=10 A`.","Le fusible doit supporter au moins 10 A.","On choisit le fusible de `10 A` (ou 16 A si 10 A est trop juste)."]]]}
]);

// ===== Explications détaillées — SVT =====
DET("svt",[
/*0*/{d:[["L'idée de Wegener","En 1912, le savant allemand Alfred Wegener remarque que les côtes de l'Amérique du Sud et de l'Afrique s'emboîtent comme les pièces d'un puzzle. Il propose que les continents étaient autrefois réunis en un seul continent, la Pangée, puis qu'ils se sont séparés et ont dérivé."],
 ["Ses arguments","Arguments morphologiques : la forme des côtes. Arguments paléontologiques : les mêmes fossiles d'animaux et de plantes (par exemple le Mesosaurus) se trouvent sur des continents séparés par l'océan. Arguments géologiques : les mêmes roches et chaînes anciennes se prolongent d'un continent à l'autre."],
 ["L'expansion des fonds océaniques","Dans les années 1960, on découvre au milieu des océans de longues chaînes sous-marines : les dorsales. Du magma y monte et forme une nouvelle croûte océanique qui s'écarte de chaque côté. Plus on s'éloigne de la dorsale, plus les roches du fond de l'océan sont vieilles."],
 ["Les plaques et leur moteur","La surface de la Terre est découpée en une douzaine de grandes plaques lithosphériques rigides, qui bougent de quelques centimètres par an. Elles s'écartent au niveau des dorsales et se rapprochent au niveau des fosses (subduction) et des chaînes de montagnes. Le moteur de ces mouvements est le courant de convection dans le manteau, dû à la chaleur interne de la Terre."]],
 wx:[["Pourquoi trouve-t-on des fossiles du même reptile terrestre au Brésil et en Afrique du Sud ?",["Ce reptile vivait sur terre et ne pouvait pas traverser l'océan à la nage.","Il vivait donc sur un continent unique.","Ce continent s'est ensuite séparé : c'est un argument pour la dérive des continents."]]]},
/*1*/{d:[["Qu'est-ce qu'un séisme ?","Les roches en profondeur subissent des forces énormes dues au mouvement des plaques. Elles se déforment lentement, puis se cassent brusquement. Cette rupture libère de l'énergie sous forme d'ondes sismiques qui font vibrer le sol."],
 ["Foyer, épicentre, ondes","Le point de rupture en profondeur est le foyer. Le point à la surface juste au-dessus est l'épicentre, où les dégâts sont souvent les plus forts. Les ondes sismiques partent du foyer dans toutes les directions et sont enregistrées par des sismographes, sous forme de sismogrammes."],
 ["Mesurer un séisme","La magnitude (échelle de Richter) mesure l'énergie libérée au foyer : c'est un seul chiffre par séisme. L'intensité (échelle MSK, de I à XII) décrit les effets observés en un lieu : elle diminue quand on s'éloigne de l'épicentre."],
 ["Séismes et plaques","Sur une carte du monde, les séismes se répartissent surtout le long des limites des plaques. Au Maroc, le Rif et l'Atlas sont des régions sismiques (séisme d'Al Hoceïma en 2004, séisme d'Al Haouz en septembre 2023)."],
 ["La structure interne de la Terre","En étudiant la vitesse et le trajet des ondes sismiques, les savants ont découvert que la Terre est formée de couches : la croûte, le manteau, le noyau externe liquide et le noyau interne solide."]],
 wx:[["Un séisme est ressenti fortement à Marrakech et faiblement à Rabat. A-t-il deux magnitudes ?",["La magnitude mesure l'énergie libérée au foyer : elle est unique.","Ce qui change d'une ville à l'autre est l'intensité (les effets).","L'intensité est plus forte près de l'épicentre, donc plus forte à Marrakech."]]]},
/*2*/{d:[["Magma et lave","En profondeur, la chaleur fait fondre une partie des roches : on obtient le magma, stocké dans une chambre magmatique. Quand il monte par la cheminée et sort au cratère, on l'appelle lave."],
 ["Deux types d'éruption","Volcanisme effusif : la lave est fluide (comme du miel chaud), elle s'écoule en coulées sur de longues distances ; les éruptions sont assez calmes. Volcanisme explosif : la lave est visqueuse (épaisse) et riche en gaz ; elle bouche la cheminée, la pression monte et le volcan explose en projetant des cendres, des bombes et des nuées ardentes très dangereuses."],
 ["Volcans et plaques","Les volcans se trouvent surtout aux limites des plaques : au niveau des dorsales (volcanisme effusif sous-marin) et au niveau des zones de subduction (volcanisme explosif, comme autour de l'océan Pacifique)."],
 ["Au Maroc","Le Moyen Atlas compte de nombreux volcans éteints, avec des coulées de basalte, près d'Azrou et de Timahdite."]],
 wx:[["Pourquoi le volcanisme explosif est-il plus dangereux ?",["Sa lave visqueuse retient les gaz.","La pression augmente jusqu'à une explosion violente.","Il produit des nuées ardentes et des cendres qui détruisent tout sur leur passage."]]]},
/*3*/{d:[["Origine des roches magmatiques","Les roches magmatiques se forment quand un magma refroidit et se solidifie. Leur aspect dépend de la vitesse du refroidissement."],
 ["Roches volcaniques","Si le magma refroidit vite, à la surface, les cristaux n'ont pas le temps de grandir : la roche a de petits cristaux et parfois du verre. Exemple : le basalte, roche sombre des coulées de lave et du fond des océans."],
 ["Roches plutoniques","Si le magma refroidit lentement, en profondeur, de grands cristaux se forment : la roche a une structure grenue (entièrement cristallisée). Exemple : le granite, avec du quartz, du feldspath et du mica. On le voit en surface quand l'érosion enlève les roches au-dessus."]],
 wx:[["On observe une roche entièrement formée de cristaux visibles à l'œil nu. Où et comment s'est-elle formée ?",["Les cristaux sont grands : le refroidissement a été lent.","Un refroidissement lent se fait en profondeur.","C'est une roche plutonique, comme le granite."]]]},
/*4*/{d:[["Les contraintes","Les mouvements des plaques exercent sur les roches des forces appelées contraintes : compression (les roches sont serrées) ou distension (les roches sont étirées)."],
 ["Les plis","Quand les roches sont assez souples, elles se courbent sans se casser : ce sont des plis. Un pli bombé vers le haut, en forme de A, est un anticlinal. Un pli creux, en forme de U, est un synclinal. Les plis se forment surtout par compression."],
 ["Les failles","Quand les roches sont rigides, elles se cassent et les deux blocs glissent l'un par rapport à l'autre : c'est une faille. La faille normale se forme par distension (les blocs s'éloignent). La faille inverse se forme par compression (les blocs se rapprochent et un bloc monte sur l'autre)."]],
 wx:[["Dans une carrière, on voit des couches en forme de U. De quel pli s'agit-il et quelle force l'a formé ?",["Une forme de U est un synclinal.","Les couches sont courbées sans être cassées : déformation souple.","Ce pli a été formé par une compression."]]]},
/*5*/{d:[["Les chaînes de subduction","Quand une plaque océanique et une plaque continentale se rapprochent, la plaque océanique, plus dense, plonge sous l'autre : c'est la subduction. Il se forme une fosse océanique, une chaîne de montagnes avec beaucoup de volcans explosifs et de séismes. Exemple : la cordillère des Andes."],
 ["Les chaînes de collision","Quand l'océan entre deux continents a disparu, les deux continents se rencontrent. Aucun ne plonge facilement : les roches sont fortement plissées, faillées et empilées. Exemple : l'Himalaya (Inde contre Asie), les Alpes."],
 ["L'Atlas","Les chaînes de l'Atlas et du Rif sont liées au rapprochement de la plaque africaine et de la plaque eurasienne. C'est pourquoi on y trouve des plis, des failles et des séismes."]],
 wx:[["Pourquoi trouve-t-on des fossiles marins au sommet de certaines montagnes ?",["Ces roches se sont formées au fond d'une mer, avec les restes d'animaux marins.","La collision des plaques a plissé et soulevé ces roches.","Elles se retrouvent aujourd'hui en altitude."]]]},
/*6*/{d:[["Les gamètes","La reproduction sexuée fait intervenir deux individus de sexes différents. Le mâle produit des gamètes mâles, les spermatozoïdes, dans les testicules. La femelle produit des gamètes femelles, les ovules, dans les ovaires."],
 ["La fécondation","La fécondation est l'union d'un spermatozoïde et d'un ovule. Elle donne une cellule-œuf, point de départ d'un nouvel individu. Chez les poissons et les grenouilles, elle a lieu dans l'eau : fécondation externe. Chez les oiseaux, les reptiles et les mammifères, elle a lieu dans le corps de la femelle : fécondation interne."],
 ["Ovipares et vivipares","Les ovipares pondent des œufs ; l'embryon se développe dans l'œuf grâce aux réserves (poule, tortue). Les vivipares donnent naissance à des petits déjà formés ; l'embryon se développe dans le ventre de la mère (vache, chat, humain)."],
 ["Le développement","Développement direct : le petit ressemble à l'adulte (poussin, chaton). Développement indirect avec métamorphose : le jeune est très différent de l'adulte et se transforme (têtard → grenouille ; chenille → chrysalide → papillon)."]],
 wx:[["La grenouille pond des centaines d'œufs, le chat seulement quelques petits. Pourquoi ?",["La fécondation de la grenouille est externe et ses œufs ne sont pas protégés.","Beaucoup d'œufs et de têtards sont mangés ou meurent.","Le chat protège ses petits dans son ventre puis les allaite : peu de petits suffisent."]]]},
/*7*/{d:[["La fleur","La fleur est l'organe de la reproduction sexuée des plantes à fleurs. Les étamines (organes mâles) produisent les grains de pollen. Le pistil (organe femelle) contient l'ovaire, qui renferme les ovules."],
 ["Pollinisation et fécondation","La pollinisation est le transport du pollen des étamines jusqu'au stigmate du pistil, par le vent ou par les insectes (abeilles). Ensuite, le pollen permet la fécondation de l'ovule."],
 ["De la fleur au fruit","Après la fécondation, l'ovule devient une graine et l'ovaire devient un fruit. La graine, semée dans de bonnes conditions, germe et donne une nouvelle plante."],
 ["Plantes sans fleurs","Les fougères et les mousses n'ont pas de fleurs. Elles se reproduisent grâce à des spores, produites sous les feuilles des fougères."],
 ["Reproduction asexuée","Une plante peut aussi donner une nouvelle plante sans fécondation, à partir d'une partie d'elle-même : bouturage (tige plantée), marcottage, greffage, tubercule (pomme de terre), bulbe (oignon), stolon (fraisier). Les nouvelles plantes sont identiques à la plante mère."]],
 wx:[["Pourquoi un agriculteur installe-t-il des ruches près de ses arbres fruitiers ?",["Les abeilles transportent le pollen de fleur en fleur : c'est la pollinisation.","La pollinisation permet la fécondation.","Après la fécondation, les ovaires deviennent des fruits : la récolte est meilleure."]]]},
/*8*/{d:[["Les organes reproducteurs","Chez l'homme, les testicules produisent les spermatozoïdes à partir de la puberté et toute la vie. Chez la femme, les ovaires libèrent en général un ovule par cycle ; l'utérus accueille l'embryon."],
 ["Le cycle de la femme","Le cycle dure environ 28 jours. Il commence par les règles (environ 5 jours). L'ovulation, c'est-à-dire la libération d'un ovule, a lieu vers le 14e jour."],
 ["Fécondation et nidation","La fécondation se fait dans la trompe. La cellule-œuf se divise et arrive dans l'utérus, où elle se fixe : c'est la nidation, vers le 7e jour."],
 ["Grossesse et naissance","La grossesse dure environ 9 mois. L'embryon, puis le fœtus (à partir du 3e mois), reçoit les nutriments et le dioxygène de la mère grâce au placenta et au cordon ombilical. À la naissance (accouchement), le bébé est nourri par l'allaitement."],
 ["La régulation des naissances","Des méthodes de contraception, conseillées par le médecin, permettent aux couples de choisir le moment et le nombre de leurs enfants."]],
 wx:[["Pourquoi la mère enceinte ne doit-elle pas fumer ?",["Le fœtus reçoit ce qui passe dans le sang de la mère par le placenta.","Les substances toxiques de la cigarette passent aussi.","Elles nuisent à la croissance et à la santé du fœtus."]]]},
/*9*/{d:[["Les caractères héréditaires","Certains caractères se transmettent des parents aux enfants : la couleur des yeux, le groupe sanguin, la forme du lobe de l'oreille. On les appelle caractères héréditaires. D'autres sont acquis (une cicatrice, une langue parlée)."],
 ["Les chromosomes","Le programme héréditaire se trouve dans le noyau de chaque cellule, porté par des filaments appelés chromosomes. L'Homme possède 46 chromosomes, groupés en 23 paires. Les gamètes (spermatozoïdes et ovules) n'en ont que 23. La fécondation rétablit le nombre de 46."],
 ["Le sexe","La 23e paire détermine le sexe : `XX` chez la femme, `XY` chez l'homme. C'est le spermatozoïde (`X` ou `Y`) qui détermine le sexe de l'enfant."],
 ["Gènes et maladies héréditaires","Les chromosomes portent des gènes qui commandent les caractères. Une modification d'un gène peut provoquer une maladie héréditaire (hémophilie, daltonisme). Le risque augmente dans les mariages entre proches parents, qui peuvent porter le même gène malade."],
 ["Le clonage","Le clonage produit un individu génétiquement identique à un autre. La brebis Dolly, née en 1996, a été le premier mammifère cloné."]],
 wx:[["Une cellule de peau a 46 chromosomes. Combien en a un ovule ? Et la cellule-œuf ?",["Les gamètes ont la moitié des chromosomes : l'ovule a 23 chromosomes.","Le spermatozoïde apporte aussi 23 chromosomes.","La cellule-œuf a `23+23=46` chromosomes."]]]}
]);
