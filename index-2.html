/*0*/{d:[["قبل الأدارسة","بعد الفتح الإسلامي، كان المغرب تابعا للخلافة في المشرق، وعرف ثورات القبائل الأمازيغية ضد ظلم بعض الولاة. ثم ظهرت إمارات مستقلة صغيرة، لكن لم تكن هناك دولة تجمع البلاد."],["وصول إدريس الأول","هرب إدريس بن عبد الله، وهو من آل البيت، من المشرق بعد معركة فخ، ووصل إلى المغرب سنة 788م. استقبلته قبيلة أوربة في وليلي وبايعته، لأنه من نسل النبي ﷺ ولأنه كان عالما ورعا."],["تأسيس الدولة وتوسعها","وحّد إدريس الأول عددا من القبائل، ونشر الإسلام في المناطق التي لم يصلها. بعد وفاته، أكمل ابنه إدريس الثاني بناء الدولة، وأسس مدينة فاس واتخذها عاصمة."],["إشعاع فاس","استقبلت فاس مهاجرين من القيروان والأندلس، فازدهرت فيها التجارة والحرف والعلم. وفي سنة 859م بنت فاطمة الفهرية جامع القرويين، الذي أصبح من أقدم الجامعات في العالم."]],
 wx:[["لماذا بايعت قبيلة أوربة إدريس الأول؟",["لأنه من آل البيت، وللمغاربة احترام كبير لنسل النبي ﷺ.","لأنه كان عالما وتقيا.","لأن القبائل كانت تبحث عن قائد يوحدها."]]]},
/*1*/{d:[["المرابطون","بدأت حركة المرابطين في الصحراء مع الفقيه عبد الله بن ياسين، الذي دعا قبائل صنهاجة إلى التمسك بالدين. ثم قاد يوسف بن تاشفين الدولة، فأسس مراكش ووحد المغرب، وعبر إلى الأندلس لنصرة المسلمين، فانتصر في معركة الزلاقة سنة 1086م."],["الموحدون","دعا المهدي بن تومرت إلى التوحيد وإصلاح العقيدة، انطلاقا من تينمل في الأطلس الكبير. وأسس عبد المؤمن بن علي الدولة الموحدية بعد أن قضى على المرابطين، ووسعها حتى ليبيا. وانتصر الموحدون في معركة الأرك سنة 1195م."],["الازدهار الحضاري","عرف المغرب في هذه الفترة ازدهارا كبيرا: بُنيت مساجد ومآذن شهيرة (الكتبية بمراكش، صومعة حسان بالرباط)، وازدهر العلم مع الفيلسوف والطبيب ابن رشد."]],
 wx:[["قارن بين المرابطين والموحدين من حيث المؤسس والعاصمة.",["المرابطون: الدعوة مع عبد الله بن ياسين، والدولة مع يوسف بن تاشفين، والعاصمة مراكش.","الموحدون: الدعوة مع المهدي بن تومرت، والدولة مع عبد المؤمن بن علي، وحافظوا على مراكش عاصمة."]]]},
/*2*/{d:[["هزيمة العقاب","في سنة 1212م انهزم الموحدون أمام الممالك المسيحية في معركة العقاب بالأندلس. كانت هذه الهزيمة بداية ضعف الدولة الموحدية وتراجع المسلمين في الأندلس."],["حرب الاسترداد","استغلت الممالك المسيحية (قشتالة، أراغون، البرتغال) ضعف المسلمين، فأخذت المدن الأندلسية واحدة بعد أخرى: قرطبة، إشبيلية... وبقيت مملكة غرناطة وحدها حتى سقطت سنة 1492م."],["دولة بني مرين","حكم المرينيون المغرب بعد الموحدين. حاولوا مساعدة الأندلس بالجهاد، واهتموا بالعلم فبنوا المدارس بفاس (البوعنانية، العطارين) لإيواء الطلبة."]],
 wx:[["ما العلاقة بين معركة العقاب وسقوط غرناطة؟",["معركة العقاب (1212م) أضعفت المسلمين في الأندلس.","بعدها تقدمت حرب الاسترداد وسقطت المدن تدريجيا.","انتهت العملية بسقوط غرناطة سنة 1492م."]]]},
/*3*/{d:[["الغزو الإيبيري","في القرن 15 بدأ البرتغاليون والإسبان يحتلون مدنا على السواحل المغربية: سبتة (1415م)، ثم طنجة، وأصيلا، والجديدة (مازاغان)، وأكادير. أرادوا التحكم في التجارة والطرق البحرية ونشر نفوذهم."],["رد فعل المغاربة","قاوم المغاربة الاحتلال بحركة الجهاد التي قادها العلماء والزوايا، ثم الدولة السعدية التي حررت أكادير سنة 1541م."],["معركة وادي المخازن","في 4 غشت 1578م، قرب القصر الكبير، انتصر الجيش المغربي بقيادة السعديين على جيش البرتغال. مات فيها ثلاثة ملوك: ملك البرتغال سيباستيان، والسلطان عبد الملك السعدي، والمتوكل. فسميت معركة الملوك الثلاثة."],["النتائج","رفعت المعركة مكانة المغرب دوليا، وأضعفت البرتغال، وبدأ حكم أحمد المنصور الذهبي الذي عرف المغرب في عهده ازدهارا."]],
 wx:[["لماذا سميت معركة وادي المخازن بمعركة الملوك الثلاثة؟",["لأن ثلاثة ملوك ماتوا فيها.","ملك البرتغال سيباستيان، والسلطان عبد الملك، ومحمد المتوكل.","وبعدها تولى أحمد المنصور الحكم."]]]},
/*4*/{d:[["الظروف","بعد وفاة أحمد المنصور، دخل المغرب في فوضى: تنازع أبناؤه على الحكم، وظهرت قوى محلية متفرقة (الزوايا، المجاهدون)."],["التأسيس","انطلق العلويون من سجلماسة (تافيلالت). وتمكن المولى الرشيد من توحيد البلاد ودخول فاس ومراكش."],["المولى إسماعيل","حكم مدة طويلة من 1672م إلى 1727م. اتخذ مكناس عاصمة وبنى فيها القصور والأسوار. كوّن جيشا قويا هو جيش عبيد البخاري، وبنى القصبات لحماية الطرق، وحرر المهدية وطنجة والعرائش وأصيلا من الاحتلال الأجنبي."]],
 wx:[["اذكر إنجازين للمولى إسماعيل.",["تكوين جيش قوي هو جيش عبيد البخاري.","تحرير مدن ساحلية مثل طنجة والعرائش.","بناء مكناس واتخاذها عاصمة."]]]},
/*5*/{d:[["سياسة الانفتاح","السلطان سيدي محمد بن عبد الله (1757–1790) شجع التجارة مع أوربا وأمريكا. بنى ميناء الصويرة (موكادور) سنة 1764م ليكون مركزا للتجارة الخارجية، ووقّع معاهدات مع عدة دول، وكان المغرب من أوائل الدول التي اعترفت باستقلال الولايات المتحدة الأمريكية."],["سياسة الاحتراز","السلطان المولى سليمان (1792–1822) خاف من الأطماع الأوربية ومن انتشار أفكار الثورة الفرنسية، فقلل من التجارة مع أوربا ومن تصدير بعض المواد، وأغلق بعض الموانئ."],["التقييم","حاول كل سلطان أن يحمي مصلحة البلاد بطريقته: الأول بالاستفادة من التجارة، والثاني بالحذر من التدخل الأجنبي."]],
 wx:[["لماذا اتبع المولى سليمان سياسة الاحتراز؟",["خوفا من الأطماع الأوربية في المغرب.","وخوفا من تأثير أفكار الثورة الفرنسية.","فقلل العلاقات التجارية مع أوربا."]]]},
/*6*/{d:[["النشأة","نشأت الدولة العثمانية في الأناضول في أواخر القرن 13م مع عثمان الأول، الذي سميت باسمه. توسعت بسرعة بفضل جيش قوي ومنظم (الإنكشارية)."],["فتح القسطنطينية","في سنة 1453م فتح السلطان محمد الفاتح القسطنطينية، عاصمة الإمبراطورية البيزنطية، وسماها إسطنبول وجعلها عاصمة."],["الامتداد","امتدت الإمبراطورية على ثلاث قارات: أوربا الشرقية والبلقان، وآسيا الغربية (العراق والشام والحجاز)، وشمال إفريقيا (مصر، تونس، الجزائر). أما المغرب فقد حافظ على استقلاله."],["عوامل القوة","الموقع الاستراتيجي بين أوربا وآسيا، والجيش القوي، والتنظيم الإداري، والأسطول البحري."]],
 wx:[["علل: بقاء المغرب خارج الحكم العثماني.",["كانت للمغرب دولة قوية (السعديون ثم العلويون).","وجيش يدافع عن حدوده.","فحافظ على استقلاله رغم امتداد العثمانيين في الجزائر."]]]},
/*7*/{d:[["معنى النهضة","النهضة حركة تجديد في الفكر والعلم والفن عرفتها أوربا في القرنين 15 و16م، بدأت في المدن الإيطالية مثل فلورنسا والبندقية، ثم انتشرت في أوربا."],["العوامل","اختراع الطباعة على يد غوتنبرغ، الذي نشر الكتب. الاطلاع على التراث اليوناني والروماني وعلى علوم الحضارة الإسلامية. ثراء المدن التجارية ودعم الأغنياء للفنانين. الاكتشافات الجغرافية."],["الحركة الإنسية","فكر يجعل الإنسان في مركز الاهتمام، ويثق في العقل والتجربة. من روادها إيراسموس."],["الإصلاح الديني","انتقد مارتن لوثر سنة 1517م بعض ممارسات الكنيسة، فظهرت البروتستانتية وانقسمت المسيحية في أوربا."],["الفنون","ازدهر الرسم والنحت والعمارة مع ليوناردو دافنشي وميكيلانجلو."]],
 wx:[["كيف ساهمت الطباعة في النهضة؟",["أصبح نسخ الكتب سريعا ورخيصا.","انتشرت الأفكار الجديدة بين عدد كبير من الناس.","فساعد ذلك على تطور العلم والفكر."]]]},
/*8*/{d:[["الأسباب","أراد الأوربيون الوصول مباشرة إلى توابل وذهب آسيا وإفريقيا، دون المرور بالطرق التي يتحكم فيها المسلمون. وساعدتهم البوصلة والخرائط والسفن الجديدة (الكارافيل)."],["أهم الرحلات","كريستوف كولومبس وصل إلى أمريكا سنة 1492م وهو يظن أنه وصل إلى الهند. فاسكو دي غاما وصل إلى الهند سنة 1498م بعد الدوران حول إفريقيا عبر رأس الرجاء الصالح. ماجلان قاد أول رحلة حول العالم (1519–1522م)."],["النتائج","توسع التجارة الأوربية وتدفق الذهب إلى أوربا، وبداية الاستعمار، وإبادة واستعباد شعوب كثيرة في أمريكا وإفريقيا، وتراجع أهمية طرق التجارة القديمة."]],
 wx:[["اذكر نتيجة إيجابية ونتيجة سلبية للاكتشافات الجغرافية.",["إيجابية بالنسبة لأوربا: ازدهار التجارة ومعرفة قارات جديدة.","سلبية: استعمار الشعوب الأخرى ونهب ثرواتها واستعبادها."]]]},
/*9*/{d:[["الثورة الفلاحية","في القرن 18م بإنجلترا، تطورت الفلاحة: تسييج الأراضي، الدورة الزراعية دون ترك الأرض بورا، آلات جديدة، تحسين سلالات الماشية. فزاد الإنتاج الغذائي."],["التمهيد للصناعة","زيادة الغذاء أدت إلى زيادة السكان. وفقد كثير من الفلاحين الصغار أراضيهم فهاجروا إلى المدن، وأصبحوا يدا عاملة للمصانع. كما وفرت الفلاحة أموالا للاستثمار."],["الثورة الصناعية","اعتمدت على الآلة البخارية التي طورها جيمس واط، وعلى الفحم الحجري كمصدر للطاقة، والحديد. ظهرت المصانع الكبرى في النسيج والتعدين، والسكك الحديدية."],["الانعكاسات","نمو المدن، ظهور البرجوازية الصناعية والطبقة العاملة، ظروف عمل قاسية (ساعات طويلة، تشغيل الأطفال)، وظهور النقابات للدفاع عن العمال."]],
 wx:[["كيف مهدت الثورة الفلاحية للثورة الصناعية؟",["وفرت الغذاء فارتفع عدد السكان.","وفرت اليد العاملة بهجرة الفلاحين إلى المدن.","ووفرت رؤوس الأموال للاستثمار في الصناعة."]]]},
/*10*/{d:[["فكر الأنوار","في القرن 18م دعا فلاسفة الأنوار إلى استعمال العقل، والحرية، والمساواة، ومحاربة الاستبداد. مونتسكيو دعا إلى فصل السلط (التشريعية والتنفيذية والقضائية). روسو تحدث عن العقد الاجتماعي وسيادة الشعب. فولتير دافع عن التسامح وحرية التعبير."],["أسباب الثورة الفرنسية","حكم ملكي مطلق، وامتيازات للنبلاء ورجال الدين، وضرائب ثقيلة على الشعب، وأزمة مالية، وغلاء الخبز، وانتشار أفكار الأنوار."],["الأحداث","في 14 يوليوز 1789م هاجم الثوار سجن الباستيل، رمز الاستبداد. ثم ألغيت الامتيازات."],["النتائج","القضاء على النظام القديم، وإعلان حقوق الإنسان والمواطن سنة 1789م (الناس يولدون أحرارا ومتساوين في الحقوق)، وقيام الجمهورية فيما بعد."]],
 wx:[["ما العلاقة بين فكر الأنوار والثورة الفرنسية؟",["فكر الأنوار نشر أفكار الحرية والمساواة وفصل السلط.","تأثر الثوار بهذه الأفكار.","فظهرت في إعلان حقوق الإنسان والمواطن."]]]},
/*11*/{d:[["المستعمرات","استقر المهاجرون الأوربيون في الساحل الشرقي لأمريكا الشمالية، وكونوا 13 مستعمرة تابعة لبريطانيا."],["أسباب الثورة","فرضت بريطانيا ضرائب جديدة على المستعمرات دون أن يكون لها ممثلون في البرلمان البريطاني. رفع المستعمرون شعار: لا ضرائب بدون تمثيل."],["الاستقلال","أعلنت المستعمرات استقلالها في 4 يوليوز 1776م، وانتصرت في حرب الاستقلال بقيادة جورج واشنطن ومساعدة فرنسا. وكان المغرب من أوائل الدول التي اعترفت بها."],["الدستور والامتداد","وُضع الدستور الأمريكي سنة 1787م: نظام فيدرالي، وفصل السلط، ورئيس منتخب. وأصبح جورج واشنطن أول رئيس. ثم امتدت الدولة نحو الغرب حتى المحيط الهادي على حساب السكان الأصليين."]],
 wx:[["ما معنى شعار «لا ضرائب بدون تمثيل»؟",["المستعمرون يدفعون ضرائب لبريطانيا.","لكن ليس لهم نواب في البرلمان البريطاني الذي يقرر هذه الضرائب.","فرفضوا دفع ضرائب لم يشاركوا في قرارها."]]]},
/*12*/{d:[["الموقع","يقع المغرب في أقصى شمال غرب إفريقيا. يحده شمالا البحر الأبيض المتوسط، وغربا المحيط الأطلسي، وشرقا الجزائر، وجنوبا موريتانيا. له واجهتان بحريتان بطول يقارب 3500 كلم."],["أهمية الموقع","لا يفصله عن أوربا إلا مضيق جبل طارق (حوالي 14 كلم). وهو بوابة بين أوربا وإفريقيا، وبين المحيط الأطلسي والبحر المتوسط، وقريب من طرق الملاحة الدولية."],["الانعكاسات الإيجابية","التجارة الدولية وموانئ كبرى مثل طنجة المتوسط، جلب الاستثمارات الأجنبية، السياحة، الصيد البحري، والعلاقات مع أوربا وإفريقيا والعالم العربي."]],
 wx:[["كيف يستفيد المغرب من قربه من أوربا؟",["سهولة التجارة والتصدير نحو أوربا.","جلب المصانع الأوربية (مثل صناعة السيارات بطنجة).","ارتفاع عدد السياح الأوربيين."]]]},
/*13*/{d:[["الجبال","الريف في الشمال، والأطلس المتوسط في الوسط، والأطلس الكبير (أعلى قمة: توبقال 4167 م)، والأطلس الصغير في الجنوب. الجبال خزان للمياه، وفيها الغابات والمراعي والمعادن."],["السهول","في الغرب والوسط: الغرب، اللوكوس، الشاوية، دكالة، عبدة، الحوز، وفي الجنوب سوس. تربتها خصبة ومناسبة للفلاحة."],["الهضاب","الهضاب العليا الشرقية التي تصلح للرعي، وهضبة الفوسفاط في الوسط الغربي."],["الأقاليم الصحراوية","في الجنوب أراض منبسطة جافة، فيها الواحات على ضفاف الأودية."]],
 wx:[["لماذا تتركز الفلاحة في السهول الأطلسية؟",["لأنها أراض منبسطة يسهل حرثها.","تربتها خصبة.","وأمطارها أكثر من المناطق الداخلية."]]]},
/*14*/{d:[["المعادن","يملك المغرب أكبر احتياطي عالمي من الفوسفاط، في خريبكة واليوسفية وبوكراع. ويستخرج أيضا الرصاص والزنك والفضة والنحاس والكوبالت."],["ضعف الطاقة التقليدية","المغرب فقير في البترول والغاز والفحم، لذلك يستورد أغلب حاجته من الطاقة، وهذا يكلف ميزانية الدولة كثيرا."],["الطاقات المتجددة","يستثمر المغرب في الطاقة الشمسية (محطة نور بورزازات من أكبر المحطات في العالم) والطاقة الريحية (طرفاية، طنجة)، لتقليل التبعية للخارج وحماية البيئة."],["المياه الجوفية","توجد مياه باطنية مهمة، لكنها مهددة بالاستنزاف بسبب كثرة الآبار والجفاف."]],
 wx:[["لماذا يطور المغرب الطاقات المتجددة؟",["لأنه يستورد أغلب الطاقة ويؤدي ثمنها غاليا.","لأن الشمس والرياح متوفرة بكثرة.","ولأنها طاقات نظيفة لا تلوث."]]]},
/*15*/{d:[["عناصر الخريطة","لكل خريطة: العنوان (الموضوع)، المفتاح (شرح الألوان والرموز)، السلم (النسبة بين المسافة على الخريطة والمسافة الحقيقية)، واتجاه الشمال."],["تقنية المربعات","نرسم شبكة مربعات على الخريطة الأصلية، ونرسم شبكة مماثلة على الورقة، ثم ننقل ما في كل مربع إلى المربع المقابل. هكذا تكون الخريطة دقيقة."],["التوطين","نلون الجبال بالبني، والسهول بالأخضر، والهضاب بالأصفر، ونرمز للمعادن برموز صغيرة نشرحها في المفتاح."]],
 wx:[["سلم الخريطة `[[1/1000000]]`. ماذا يعني؟",["`1 cm` على الخريطة يساوي `1 000 000 cm` في الواقع.","`1 000 000 cm=10 km`.","إذن كل سنتيمتر يمثل 10 كيلومترات."]]]},
/*16*/{d:[["عوامل المناخ","الموقع بين البحر والصحراء، والقرب من البحر أو البعد عنه، والتضاريس (الجبال تحجز السحب)، والتيار البحري البارد للكناري الذي يلطف حرارة السواحل الأطلسية."],["المناخ المتوسطي","في الشمال والغرب: شتاء معتدل ممطر، وصيف حار وجاف."],["المناخ الجبلي والقاري","في الجبال: برد شديد وثلوج في الشتاء. في الداخل (فاس، مراكش): فرق كبير بين حرارة الصيف وحرارة الشتاء."],["المناخ الصحراوي","في الجنوب والشرق: حرارة مرتفعة وأمطار نادرة وجفاف. ينعكس المناخ على النباتات (غابات في الشمال، واحات في الجنوب) وعلى الأودية."]],
 wx:[["لماذا تكون الحرارة معتدلة صيفا في الصويرة؟",["لأنها على الساحل الأطلسي.","البحر يلطف الحرارة.","وتيار الكناري البارد يبرد الجو."]]]},
/*17*/{d:[["المبيان المناخي","يجمع في رسم واحد معطيات الحرارة والتساقطات لكل شهر من السنة في محطة معينة."],["طريقة الرسم","المحور الأفقي: أشهر السنة. محور التساقطات بالمليمتر (أعمدة زرقاء)، ومحور الحرارة بالدرجة (منحنى أحمر). نعتمد السلم `P=2T`: كل `10°C` يقابلها `20 mm`."],["القراءة","الشهر الجاف هو الذي يكون فيه عمود التساقطات تحت منحنى الحرارة، أي `P<2T`. نحسب مجموع التساقطات السنوية، والمعدل السنوي للحرارة، والمدى الحراري (أعلى حرارة − أدنى حرارة)."]],
 wx:[["شهر يوليوز: `T=26°C` و`P=2 mm`. هل هو جاف؟",["`2T=2×26=52`.","`P=2` و`2<52`.","إذن يوليوز شهر جاف."]]]},
/*18*/{d:[["عدد السكان","حسب الإحصاء العام للسكان سنة 2024، يقارب عدد سكان المغرب 37 مليون نسمة. ويعيش أكثر من 60% منهم في المدن."],["التزايد الطبيعي","هو الفرق بين عدد الولادات وعدد الوفيات. انخفضت الخصوبة (عدد الأطفال لكل امرأة) فأصبح النمو الديمغرافي أبطأ من قبل."],["البنية العمرية","مازال المغرب بلدا شابا، لكن نسبة الأطفال تنخفض ونسبة المسنين ترتفع، وهذا يطرح تحديات التقاعد والصحة."],["الهجرة","الهجرة الداخلية من البادية إلى المدن بحثا عن العمل والخدمات. والهجرة الخارجية خاصة نحو أوربا، وتحويلات المهاجرين مورد مهم للعملة الصعبة."]],
 wx:[["مدينة سجلت 900 ولادة و300 وفاة. احسب التزايد الطبيعي.",["التزايد الطبيعي = الولادات − الوفيات.","`900−300=600`.","زاد السكان بـ 600 نسمة (دون حساب الهجرة)."]]]},
/*19*/{d:[["أهمية الفلاحة","تشغل الفلاحة جزءا كبيرا من السكان، خاصة في البادية، وتوفر الغذاء والمواد الأولية للصناعة وجزءا من الصادرات."],["الإرغامات","الجفاف وعدم انتظام الأمطار، وقلة الماء، وتجزؤ الأراضي إلى قطع صغيرة، وضعف تجهيز الفلاحين الصغار، ومشاكل التسويق."],["جهود الدولة","سياسة السدود منذ الستينيات، والري الحديث (التنقيط)، ومخطط المغرب الأخضر (2008) ثم الجيل الأخضر (2020)."],["الصيد البحري","سواحل طويلة غنية بالأسماك (السردين خاصة). مشاكله: الصيد المفرط، الأساطيل التقليدية، ضعف التثمين. والدولة تحدد فترات الراحة البيولوجية."]],
 wx:[["اقترح حلين لمشكلة الجفاف في الفلاحة.",["بناء السدود لتخزين مياه الأمطار.","استعمال السقي بالتنقيط لاقتصاد الماء.","اختيار زراعات تتحمل الجفاف."]]]},
/*20*/{d:[["التوزيع","تتركز الصناعة على المحور الأطلسي من طنجة إلى آسفي، خاصة في الدار البيضاء، لأنها قريبة من الموانئ والأسواق واليد العاملة."],["الأنواع","الصناعات الغذائية، النسيج والجلد، الصناعات الكيماوية (معالجة الفوسفاط بآسفي والجرف الأصفر)، وصناعة السيارات (طنجة، القنيطرة) والطائرات (الدار البيضاء)."],["جهود التحديث","إنشاء المناطق الصناعية والحرة، وتشجيع الاستثمار الأجنبي، وتكوين اليد العاملة."],["المشاكل","التركز في مناطق قليلة، المنافسة الأجنبية، التلوث، والتبعية للخارج في التجهيزات."]],
 wx:[["لماذا تتركز الصناعة في الدار البيضاء؟",["قربها من أكبر ميناء تجاري.","وجود يد عاملة كثيرة.","وجود سوق كبيرة للاستهلاك والبنيات التحتية."]]]},
/*21*/{d:[["التجارة الداخلية","تتم داخل المغرب عبر الأسواق الأسبوعية في البادية، والمحلات والأسواق في المدن، والمراكز التجارية الكبرى، وأصبحت التجارة الإلكترونية تنتشر."],["التجارة الخارجية","المغرب يصدر الفوسفاط ومشتقاته، والسيارات، والمنتجات الفلاحية، والأسماك، والنسيج. ويستورد الطاقة، والحبوب، والآلات، والمواد الأولية."],["الميزان التجاري","هو الفرق بين قيمة الصادرات وقيمة الواردات. في المغرب الواردات أكبر، فالميزان يعرف عجزا. نسبة التغطية = الصادرات ÷ الواردات × 100."],["الشركاء","الاتحاد الأوربي هو الشريك الأول (إسبانيا وفرنسا)، ثم الصين والولايات المتحدة، مع تطور التجارة مع إفريقيا."]],
 wx:[["صادرات 300 مليار درهم وواردات 500 مليار درهم. احسب الميزان التجاري ونسبة التغطية.",["الميزان = `300−500=−200` مليار درهم: عجز.","نسبة التغطية = `300÷500×100=60%`.","الصادرات تغطي 60% فقط من الواردات."]]]},
/*22*/{d:[["المؤهلات","تنوع طبيعي (شواطئ، جبال، صحراء، واحات)، وتراث تاريخي وثقافي (المدن العتيقة: فاس، مراكش، مكناس)، وقرب من أوربا، واستقرار."],["الأهمية الاقتصادية","تجلب العملة الصعبة، وتوفر مناصب الشغل في الفنادق والنقل والمطاعم والصناعة التقليدية، وتنمي المناطق."],["الصعوبات","تركز السياح في مدن قليلة (مراكش، أكادير)، المنافسة من دول أخرى، الحاجة إلى تكوين وتجهيزات، وتأثر القطاع بالأزمات العالمية."],["الحلول","تنويع العرض (سياحة جبلية، قروية، صحراوية)، وتحسين البنيات والنقل، والترويج، وتكوين العاملين."]],
 wx:[["كيف تساهم السياحة في تنمية منطقة جبلية؟",["توفر الشغل للسكان (مرشدون، دور الضيافة).","تشجع بيع منتجات الصناعة التقليدية.","تدفع إلى بناء الطرق والخدمات."]]]},
/*23*/{d:[["مفهوم التنمية المستدامة","هي تنمية تلبي حاجات الحاضر دون أن تحرم الأجيال القادمة من تلبية حاجاتها. تجمع بين ثلاثة أبعاد: الاقتصاد، والمجتمع، والبيئة."],["القضايا التي تعيقها","الجفاف وندرة الماء، التصحر وزحف الرمال، تراجع الغابات، التلوث (النفايات، المياه العادمة)، الفقر والتفاوت بين المناطق."],["جهود الدولة","برامج الطاقات المتجددة، تحلية مياه البحر، التشجير ومحاربة التصحر، معالجة النفايات، الميثاق الوطني للبيئة."],["دور المواطن","ترشيد الماء والكهرباء، فرز النفايات، المحافظة على الغابات، المشاركة في الجمعيات البيئية."]],
 wx:[["اذكر ثلاثة سلوكات يومية تحمي البيئة.",["إغلاق الصنبور أثناء غسل الأسنان.","إطفاء الأضواء غير الضرورية.","رمي النفايات في المكان المخصص وفرزها."]]]},
/*24*/{d:[["مقومات كل دولة","لكل دولة ثلاثة مقومات: الشعب (السكان)، والإقليم (الأرض والمياه والأجواء)، والسلطة السياسية ذات السيادة."],["ثوابت الدولة المغربية","حسب الدستور: الدين الإسلامي المعتدل، والوحدة الوطنية متعددة الروافد (العربية، الأمازيغية، الصحراوية الحسانية، الإفريقية، الأندلسية، العبرية، المتوسطية)، والملكية الدستورية، والاختيار الديمقراطي."],["رموز السيادة","العلم الوطني الأحمر تتوسطه نجمة خماسية خضراء، والنشيد الوطني، والشعار: الله، الوطن، الملك. يجب احترامها."]],
 wx:[["اذكر رموز السيادة الوطنية.",["العلم الوطني.","النشيد الوطني.","الشعار: الله، الوطن، الملك."]]]},
/*25*/{d:[["تعريف الدستور","الدستور هو القانون الأسمى للدولة. يحدد نظام الحكم، وتنظيم السلط وعلاقاتها، وحقوق المواطنين وواجباتهم. كل القوانين يجب أن تكون مطابقة له."],["تاريخ الدساتير المغربية","أول دستور سنة 1962، ثم دساتير 1970، 1972، 1992، 1996، ثم دستور 2011 الذي صودق عليه في استفتاء فاتح يوليوز 2011."],["مستجدات دستور 2011","توسيع الحقوق والحريات، ترسيم اللغة الأمازيغية إلى جانب العربية، تقوية دور البرلمان ورئيس الحكومة، استقلال السلطة القضائية، وربط المسؤولية بالمحاسبة."]],
 wx:[["كيف يصادق الشعب على الدستور؟",["عن طريق الاستفتاء.","يصوت المواطنون بنعم أو لا على نص الدستور.","إذا صوتت الأغلبية بنعم، يصبح الدستور نافذا."]]]},
/*26*/{d:[["مكانة الملك","الملك رئيس الدولة وممثلها الأسمى، ورمز وحدة الأمة، وضامن دوام الدولة واستمرارها، والحكم الأسمى بين مؤسساتها."],["الصفة الدينية","الملك أمير المؤمنين، وحامي حمى الملة والدين، والضامن لحرية ممارسة الشؤون الدينية."],["بعض الاختصاصات","يعين رئيس الحكومة من الحزب الأول في انتخابات مجلس النواب، ويرأس المجلس الوزاري، وهو القائد الأعلى للقوات المسلحة، ويعتمد السفراء."],["الملف الصحفي","نتعلم جمع مقالات وصور حول موضوع، وترتيبها بعنوان ومقدمة وخلاصة، وذكر مصادرها."]],
 wx:[["كيف يعين رئيس الحكومة؟",["يجري انتخاب أعضاء مجلس النواب.","يعين الملك رئيس الحكومة من الحزب الذي تصدر الانتخابات.","ثم يقترح رئيس الحكومة الوزراء."]]]},
/*27*/{d:[["التكوين","يتكون البرلمان من مجلسين. مجلس النواب: أعضاؤه ينتخبون بالاقتراع العام المباشر لمدة 5 سنوات. مجلس المستشارين: أعضاؤه ينتخبون بطريقة غير مباشرة (ممثلو الجماعات والغرف المهنية والنقابات) لمدة 6 سنوات."],["الاختصاصات","التشريع: دراسة القوانين والتصويت عليها، والتصويت على قانون المالية (الميزانية). المراقبة: مراقبة عمل الحكومة بالأسئلة الشفوية والكتابية، وملتمس الرقابة. تقييم السياسات العمومية."],["أهمية الانتخاب","بالتصويت يختار المواطن من يمثله ويدافع عن مصالحه. التصويت حق وواجب وطني."]],
 wx:[["ما الفرق بين انتخاب مجلس النواب ومجلس المستشارين؟",["النواب: ينتخبهم المواطنون مباشرة لمدة 5 سنوات.","المستشارون: ينتخبون بطريقة غير مباشرة لمدة 6 سنوات."]]]},
/*28*/{d:[["التكوين والمسؤولية","تتكون الحكومة من رئيس الحكومة والوزراء. وهي مسؤولة أمام الملك وأمام البرلمان (مجلس النواب)."],["الاختصاصات","تنفذ القوانين، وتسير الإدارات العمومية، وتعد مشاريع القوانين والميزانية، وتطبق البرنامج الحكومي."],["مراحل إصدار القانون","1) إيداع النص: مشروع قانون (من الحكومة) أو مقترح قانون (من البرلمانيين). 2) دراسته في اللجان. 3) مناقشته والتصويت عليه في مجلس النواب ثم في مجلس المستشارين. 4) إصدار الأمر بتنفيذه من طرف الملك. 5) نشره في الجريدة الرسمية."]],
 wx:[["لماذا ينشر القانون في الجريدة الرسمية؟",["حتى يعلم به جميع المواطنين والإدارات.","ولا يمكن لأحد أن يقول إنه لا يعرفه.","ويبدأ تطبيقه رسميا."]]]},
/*29*/{d:[["مبادئ القضاء","القضاء سلطة مستقلة عن السلطتين التشريعية والتنفيذية. من مبادئه: المساواة أمام القانون، وقرينة البراءة (المتهم بريء حتى تثبت إدانته)، وحق الدفاع، وعلنية الجلسات، والتقاضي على درجات (الابتدائية ثم الاستئناف ثم النقض)."],["المحكمة","فيها القاضي الذي يحكم، والنيابة العامة التي تمثل المجتمع وتتابع المتهم، والمحامي الذي يدافع، وكاتب الضبط الذي يسجل، والشهود."],["قضاء الأحداث","الحدث هو من لم يبلغ 18 سنة. قضاء الأحداث يهدف إلى حماية الطفل وإصلاحه وإعادة إدماجه، أكثر من معاقبته. وجلساته سرية لحماية الطفل."]],
 wx:[["لماذا تكون جلسات قضاء الأحداث سرية؟",["لحماية سمعة الطفل ومستقبله.","لأن الهدف هو الإصلاح وليس التشهير.","ولتسهيل إعادة إدماجه في المجتمع."]]]},
/*30*/{d:[["الحقوق المدنية","هي الحقوق التي تحمي الإنسان كفرد: الحق في الحياة، في السلامة الجسدية، في الأمن، في المساواة أمام القانون، في الجنسية، في حرية التنقل، في حماية الحياة الخاصة."],["الحقوق السياسية","هي حقوق المشاركة في الشأن العام: التصويت، الترشح للانتخابات، تأسيس الأحزاب والانخراط فيها، تقلد الوظائف العامة."],["المرجعية","صدر العهد الدولي الخاص بالحقوق المدنية والسياسية سنة 1966 عن الأمم المتحدة، وصادق عليه المغرب. والدستور المغربي يضمن هذه الحقوق."],["الحق والواجب","ممارسة الحقوق مرتبطة باحترام حقوق الآخرين وباحترام القانون."]],
 wx:[["صنف: الحق في التصويت، الحق في الحياة، الحق في الترشح، حرية التنقل.",["حقوق مدنية: الحق في الحياة، حرية التنقل.","حقوق سياسية: الحق في التصويت، الحق في الترشح."]]]},
/*31*/{d:[["الحريات العامة","حرية الرأي والتعبير، حرية الاجتماع والتظاهر السلمي، حرية تأسيس الجمعيات، حرية الصحافة. صدر قانون الحريات العامة بالمغرب سنة 1958، وعُدل عدة مرات لتوسيعها."],["الحرية والمسؤولية","حرية التعبير لا تعني السب أو القذف أو نشر الكذب أو الدعوة إلى الكراهية والعنف. حريتي تنتهي حيث تبدأ حرية الآخرين."],["مؤسسات الحماية","المجلس الوطني لحقوق الإنسان: يراقب ويحمي الحقوق. مؤسسة الوسيط: تتلقى شكايات المواطنين ضد الإدارة."]],
 wx:[["هل نشر خبر كاذب عن شخص من حرية التعبير؟",["لا، لأنه يضر بشخص آخر.","حرية التعبير مسؤولية.","والقانون يعاقب على القذف ونشر الأخبار الكاذبة."]]]},
/*32*/{d:[["تعريف الحزب","الحزب السياسي تنظيم يجمع مواطنين يتفقون على أفكار وبرنامج، ويسعون إلى المشاركة في تسيير الشأن العام عن طريق الانتخابات."],["التعددية الحزبية","يعرف المغرب تعددية حزبية منذ الاستقلال، والدستور يمنع نظام الحزب الوحيد. ولا يجوز تأسيس حزب على أساس ديني أو عرقي أو جهوي."],["الأدوار","تأطير المواطنين وتكوينهم سياسيا، تقديم البرامج والمرشحين في الانتخابات، المشاركة في الحكومة أو المعارضة، الدفاع عن مصالح المواطنين."]],
 wx:[["لماذا يمنع الدستور الحزب الوحيد؟",["لضمان التعددية وحرية الاختيار.","حتى يختار المواطن بين برامج مختلفة.","ولمنع الاستبداد."]]]},
/*33*/{d:[["النقابة","تنظيم يجمع العمال أو الموظفين للدفاع عن مصالحهم: الأجور، ظروف العمل، الحماية الاجتماعية. يعرف المغرب تعددية نقابية، والانخراط فيها حر."],["المنظمات المهنية","تجمع أصحاب نفس المهنة: هيئة المحامين، هيئة الأطباء، غرف التجارة والصناعة. تنظم المهنة وتدافع عنها."],["الوسائل","الحوار والتفاوض مع المشغلين والحكومة (الحوار الاجتماعي)، والإضراب في إطار القانون."],["فاتح ماي","العيد العالمي للشغل. أصله نضال عمال شيكاغو سنة 1886 من أجل يوم عمل من 8 ساعات."]],
 wx:[["ما أصل الاحتفال بفاتح ماي؟",["في سنة 1886، أضرب عمال شيكاغو بأمريكا.","طالبوا بتحديد العمل في 8 ساعات يوميا.","فأصبح فاتح ماي عيدا عالميا للعمال."]]]},
/*34*/{d:[["أنواع الصحافة","الصحافة المكتوبة (الجرائد والمجلات)، والمسموعة (الإذاعة)، والمرئية (التلفزة)، والإلكترونية (المواقع)."],["الأدوار","إخبار المواطنين، التعبير عن الآراء المختلفة، نشر الثقافة والوعي، مراقبة عمل المؤسسات."],["مكونات الجريدة","الاسم، التاريخ والعدد، العناوين الرئيسية، الافتتاحية (رأي الجريدة)، الأخبار الوطنية والدولية، الرياضة، الإعلانات."],["النظرة النقدية","نتحقق من مصدر الخبر، ونقارن بين عدة مصادر، ونفرق بين الخبر والرأي، ولا ننشر الأخبار قبل التأكد منها."]],
 wx:[["كيف تتأكد من صحة خبر قرأته على الأنترنت؟",["أبحث عن مصدر الخبر: هل هو موقع معروف؟","أقارن مع مواقع أو جرائد أخرى.","لا أشاركه إلا بعد التأكد."]]]},
/*35*/{d:[["الحقوق الاقتصادية","الحق في الشغل وفي أجر عادل، الحق في ظروف عمل آمنة، الحق في الانخراط في النقابات."],["الحقوق الاجتماعية","الحق في التعليم، في الصحة، في السكن اللائق، في الحماية الاجتماعية (التقاعد، التأمين عن المرض)."],["الحقوق الثقافية","الحق في المشاركة في الحياة الثقافية، والحفاظ على اللغات والتراث."],["المرجعية والتطبيق","العهد الدولي الخاص بالحقوق الاقتصادية والاجتماعية والثقافية (1966). في المغرب: التعليم إجباري، وتعميم التغطية الصحية والحماية الاجتماعية."]],
 wx:[["اذكر حقا اجتماعيا وكيف تحققه الدولة.",["الحق في الصحة.","بناء المستشفيات والمراكز الصحية.","وتعميم التأمين الإجباري عن المرض."]]]},
/*36*/{d:[["مفهوم الديمقراطية المحلية","مشاركة السكان في تسيير شؤون مدينتهم أو قريتهم، عن طريق مجالس منتخبة قريبة منهم."],["الجماعات الترابية","الجهات (12 جهة)، والعمالات والأقاليم، والجماعات (حضرية وقروية). لكل واحدة مجلس منتخب."],["المجلس الجماعي","ينتخبه سكان الجماعة لمدة 6 سنوات، ويرأسه رئيس المجلس. يهتم بالماء والإنارة والطرق المحلية والنظافة والأسواق والحالة المدنية."],["دور المواطن","التصويت في الانتخابات، حضور دورات المجلس (فهي علنية)، تقديم العرائض، المشاركة في الجمعيات."]],
 wx:[["مشكل الإنارة في حيك: من تراسل؟",["الإنارة العمومية من اختصاص الجماعة.","أراسل رئيس المجلس الجماعي.","ويمكن أن أقدم عريضة مع سكان الحي."]]]},
/*37*/{d:[["تعريف الجمعية","اتفاق بين شخصين أو أكثر لتحقيق هدف مشترك دون البحث عن الربح المادي، في مجالات ثقافية، رياضية، بيئية، اجتماعية، تنموية."],["مراحل التأسيس","1) جمع عام تأسيسي. 2) المصادقة على القانون الأساسي (الاسم، الأهداف، المقر). 3) انتخاب المكتب (الرئيس، الكاتب، أمين المال). 4) إيداع التصريح لدى السلطة المحلية."],["أهمية الجمعيات","تقوي روح التضامن والتطوع، وتساهم في التنمية المحلية، وتدرب الشباب على المسؤولية والعمل الجماعي."]],
 wx:[["تريد تأسيس جمعية لحماية البيئة في حيك. ما الخطوة الأولى؟",["تجمع الأشخاص المهتمين في جمع عام تأسيسي.","تكتبون القانون الأساسي وتصادقون عليه.","ثم تنتخبون المكتب وتودعون التصريح."]]]}
]);

// ===== الشرح المفصل — اللغة العربية =====
DET("ar",[
/*0 المثنى*/{d:[["تعريف المثنى","المثنى اسم يدل على اثنين أو اثنتين، ونصوغه بزيادة ألف ونون في حالة الرفع، أو ياء ونون في حالتي النصب والجر. مثال: قلم ← قلمان / قلمين، معلمة ← معلمتان / معلمتين."],["إعرابه","يرفع المثنى بالألف نيابة عن الضمة، وينصب ويجر بالياء نيابة عن الفتحة والكسرة. نجح التلميذانِ: فاعل مرفوع بالألف. كافأ المدير التلميذَينِ: مفعول به منصوب بالياء. سلمت على التلميذَينِ: اسم مجرور بالياء."],["تثنية المقصور والممدود والمنقوص","المقصور (ينتهي بألف): نرد الألف إلى أصلها: فتى ← فتيان، عصا ← عصوان. الممدود (ينتهي بهمزة قبلها ألف): إذا كانت الهمزة للتأنيث تقلب واوا: صحراء ← صحراوان. المنقوص (ينتهي بياء): نرد الياء: القاضي ← القاضيان."]],
 wx:[["أعرب «المهندسان» في: «صمم المهندسان الجسر».",["صمم: فعل ماض.","المهندسان: من قام بالفعل؟ المهندسان، إذن فاعل.","فاعل مرفوع وعلامة رفعه الألف لأنه مثنى."]],["ثنّ «الطالبة» في: «رأيت الطالبة».",["«الطالبة» مفعول به منصوب.","المثنى ينصب بالياء.","نحذف التاء المربوطة ونكتبها مفتوحة: رأيت الطالبتين."]]]},
/*1 التلخيص*/{d:[["معنى التلخيص","التلخيص هو إعادة كتابة نص بشكل مختصر، بأسلوب شخصي، مع الحفاظ على أفكاره الأساسية وترتيبها، دون إضافة رأي شخصي."],["خطوات التلخيص","1) أقرأ النص عدة مرات حتى أفهمه. 2) أقسمه إلى فقرات وأحدد فكرة كل فقرة. 3) أحذف التفاصيل والأمثلة والتكرار والاستشهادات. 4) أربط الأفكار بأدوات ربط (أولا، ثم، بعد ذلك، وأخيرا). 5) أكتب بأسلوبي في حوالي ربع النص."],["صيغ مفيدة","يتحدث النص عن... / يرى الكاتب أن... / ويضيف أن... / وفي الأخير يدعو إلى..."]],
 wx:[["كيف أبدأ تلخيص نص عن أهمية القراءة؟",["أحدد الموضوع: أهمية القراءة.","أكتب جملة البداية: يتحدث النص عن أهمية القراءة في حياة الإنسان.","ثم أذكر الأفكار الأساسية بإيجاز."]]]},
/*2 الجمع السالم*/{d:[["جمع المذكر السالم","يدل على أكثر من اثنين، نصوغه بزيادة واو ونون (رفعا) أو ياء ونون (نصبا وجرا) على المفرد دون تغيير بنائه: معلم ← معلمون / معلمين. يرفع بالواو، وينصب ويجر بالياء."],["جمع المؤنث السالم","نصوغه بزيادة ألف وتاء على المفرد: معلمة ← معلمات، زينب ← زينبات. يرفع بالضمة، وينصب ويجر بالكسرة: «إن المعلماتِ مجتهدات» (اسم إن منصوب بالكسرة)."],["لماذا سالم؟","لأن بناء المفرد يسلم من التغيير، على عكس جمع التكسير."]],
 wx:[["أعرب «المجتهدين» في: «كرّم المدير المجتهدين».",["كرّم: فعل ماض، المدير: فاعل.","المجتهدين: من كُرّم؟ إذن مفعول به.","مفعول به منصوب وعلامة نصبه الياء لأنه جمع مذكر سالم."]],["أعرب «الطالباتِ» في: «شاهدت الطالباتِ».",["مفعول به منصوب.","جمع مؤنث سالم.","علامة نصبه الكسرة نيابة عن الفتحة."]]]},
/*3 جمع التكسير*/{d:[["تعريفه","جمع التكسير يدل على أكثر من اثنين مع تغير في بناء المفرد: كتاب ← كُتُب، قلم ← أقلام، رجل ← رجال."],["جمع القلة","يدل على عدد من ثلاثة إلى عشرة، وأوزانه أربعة: أفْعُل (أنفُس)، أفعال (أقلام)، أفعِلة (أرغفة)، فِعْلة (فتية)."],["جمع الكثرة","يدل على أكثر من عشرة، وأوزانه كثيرة: فُعُول (دروس)، فِعال (جبال)، فُعُل (كتب)، مَفاعِل (مساجد)..."],["إعرابه","يعرب بالحركات الأصلية: يرفع بالضمة، وينصب بالفتحة، ويجر بالكسرة."]],
 wx:[["حدد نوع «أولاد» و«بيوت».",["أولاد على وزن أفعال: جمع قلة.","بيوت على وزن فُعُول: جمع كثرة."]]]},
/*4 الفاعل*/{d:[["تعريف الفاعل","الفاعل اسم مرفوع يأتي بعد فعل مبني للمعلوم، ويدل على من قام بالفعل. نعرفه بالسؤال: من فعل؟"],["أنواعه","اسم ظاهر: كتب التلميذُ. ضمير متصل: كتبتُ (التاء). ضمير مستتر: يكتب (هو)."],["الإضمار الواجب","لا يمكن إظهار الضمير: مع المضارع المبدوء بالهمزة (أكتب: أنا)، أو بالنون (نكتب: نحن)، أو بالتاء للمخاطب (تكتب: أنت)، ومع فعل الأمر للمفرد المذكر (اكتب: أنت)."],["الإضمار الجائز","مع الغائب: «التلميذ يكتب»: الفاعل ضمير مستتر جوازا تقديره هو، ويمكن أن نقول: «يكتب التلميذ»."]],
 wx:[["حدد الفاعل في: «نقرأ القصة».",["الفعل: نقرأ (مضارع مبدوء بالنون).","من يقرأ؟ نحن.","الفاعل ضمير مستتر وجوبا تقديره نحن."]]]},
/*5 التقرير*/{d:[["تعريف التقرير","نص ينقل بدقة وأمانة ما شاهدناه أو عشناه: زيارة، نشاط، حادثة، اجتماع."],["بنيته","العنوان. المقدمة: الزمان، المكان، المشاركون، الهدف. العرض: الأحداث بترتيب زمني. الخاتمة: النتائج، الانطباع، الاقتراحات."],["لغته","جمل قصيرة وواضحة، أفعال في الماضي، أدوات ربط زمنية (في البداية، بعد ذلك، ثم، وفي الأخير)، وموضوعية دون مبالغة."]],
 wx:[["اكتب مقدمة تقرير عن زيارة مكتبة.",["الزمان: يوم الجمعة صباحا.","المكان والمشاركون: زار تلاميذ القسم المكتبة البلدية.","الهدف: للتعرف على طريقة الإعارة."]]]},
/*6 المفعول به*/{d:[["تعريفه","اسم منصوب يدل على من وقع عليه فعل الفاعل. نعرفه بالسؤال: ماذا؟ أو من؟ بعد الفعل والفاعل."],["علامات نصبه","الفتحة في المفرد وجمع التكسير، الياء في المثنى وجمع المذكر السالم، الكسرة في جمع المؤنث السالم، الألف في الأسماء الخمسة (رأيت أباك)."],["أشكاله","اسم ظاهر: قرأت الكتابَ. ضمير متصل: ساعدني، ساعدك، ساعده. وقد يتقدم على الفاعل: «كتب الدرسَ التلميذُ»."]],
 wx:[["أعرب «أباه» في: «ساعد الابن أباه».",["ساعد: فعل ماض. الابن: فاعل.","من ساعد؟ أباه: مفعول به.","منصوب بالألف لأنه من الأسماء الخمسة، والهاء ضمير متصل مضاف إليه."]]]},
/*7 المفعول المطلق*/{d:[["تعريفه","مصدر منصوب من لفظ الفعل، يذكر بعده لتأكيده أو بيان نوعه أو عدده."],["أنواعه","المؤكد للفعل: فرحت فرحًا. المبين للنوع: يكون موصوفا أو مضافا: فرحت فرحًا كبيرًا / فرحت فرحَ الناجحين. المبين للعدد: طرقت الباب طرقةً / طرقتين / ثلاث طرقات."],["كيف أعرفه؟","أبحث عن مصدر من نفس حروف الفعل: قرأ ← قراءة، اجتهد ← اجتهاد، سار ← سير."]],
 wx:[["حدد نوع المفعول المطلق في: «احترم التلميذ أستاذه احتراما كبيرا».",["احتراما: مصدر من لفظ الفعل «احترم».","جاء بعده نعت «كبيرا».","إذن هو مفعول مطلق مبين للنوع."]]]},
/*8 المفعول فيه*/{d:[["تعريفه","المفعول فيه (الظرف) اسم منصوب يدل على زمان الفعل أو مكانه، ويتضمن معنى «في»."],["ظرف الزمان","يجيب عن «متى؟»: صباحا، مساء، ليلا، يوم، ساعة، قبل، بعد، حين. مثال: سافرت صباحًا = سافرت في الصباح."],["ظرف المكان","يجيب عن «أين؟»: أمام، خلف، فوق، تحت، يمين، شمال، عند، بين، قرب. مثال: جلست تحتَ الشجرة."],["ملاحظة","إذا جاء بعد الظرف اسم، يكون هذا الاسم مضافا إليه مجرورا: «تحتَ الشجرةِ»."]],
 wx:[["أعرب «أمامَ» في: «وقف التلميذ أمامَ السبورة».",["أين وقف؟ أمام: ظرف مكان.","مفعول فيه منصوب بالفتحة، وهو مضاف.","السبورة: مضاف إليه مجرور."]]]},
/*9 التصميم*/{d:[["أهمية التصميم","التصميم خطة نضعها قبل الكتابة، تساعدنا على تنظيم الأفكار وعدم نسيان أي فكرة، وعلى كتابة موضوع مترابط."],["أجزاؤه","المقدمة: تمهيد للموضوع في جملتين أو ثلاث، وطرح السؤال. العرض: الأفكار الأساسية، كل فكرة في فقرة، مع أمثلة. الخاتمة: خلاصة، أو رأي شخصي، أو اقتراح."],["الطريقة","أقرأ الموضوع وأحدد المطلوب، ثم أكتب في المسودة الأفكار على شكل نقط قصيرة، ثم أرتبها، ثم أحررها في ورقة التحرير."]],
 wx:[["ضع تصميما لموضوع: «فوائد الرياضة».",["مقدمة: الرياضة نشاط يمارسه كثير من الناس، فما فوائدها؟","عرض: فوائد صحية، فوائد نفسية، فوائد اجتماعية.","خاتمة: أنصح بممارسة الرياضة بانتظام."]]]},
/*10 المفعول معه*/{d:[["تعريفه","اسم منصوب يأتي بعد واو بمعنى «مع» (واو المعية)، ليدل على ما وقع الفعل بمصاحبته."],["أمثلة","سرت والنهرَ = سرت مع النهر. استيقظت وطلوعَ الشمس = مع طلوع الشمس. ذاكرت والمصباحَ."],["الفرق مع واو العطف","في «جاء خالد وسعيدٌ» الواو للعطف لأن الاثنين جاءا. في «سرت والنهرَ» النهر لا يسير، فالواو بمعنى «مع»."]],
 wx:[["أعرب «الشاطئَ» في: «مشيت والشاطئَ».",["الواو: واو المعية.","الشاطئ لا يمشي، فالمعنى: مشيت مع الشاطئ.","الشاطئَ: مفعول معه منصوب بالفتحة."]]]},
/*11 المفعول لأجله*/{d:[["تعريفه","مصدر منصوب يذكر بعد الفعل لبيان سببه، ويجيب عن السؤال: لماذا؟"],["خصائصه","يكون غالبا مصدرا قلبيا يدل على شعور: حب، خوف، رغبة، احترام، طمع، أمل. ويشارك الفعل في الزمان والفاعل."],["أمثلة","وقف التلاميذ احترامًا للأستاذ. هرب اللص خوفًا من الشرطة. أجتهد رغبةً في النجاح."]],
 wx:[["حدد المفعول لأجله في: «تصدق الرجل طمعا في الأجر».",["لماذا تصدق؟ طمعا في الأجر.","طمعا: مصدر يدل على السبب.","مفعول لأجله منصوب بالفتحة."]]]},
/*12 الحال*/{d:[["تعريفها","الحال اسم نكرة منصوب يبين هيئة صاحبها (فاعلا أو مفعولا به) وقت وقوع الفعل. نعرفها بالسؤال: كيف؟"],["أنواعها","مفردة: جاء الطفل مبتسمًا. جملة اسمية أو فعلية: جاء الطفل وهو يبتسم / جاء الطفل يبتسم. شبه جملة: رأيت الطائر فوق الغصن / على الشجرة."],["المطابقة","تطابق الحال صاحبها في التذكير والتأنيث والعدد: جاءت البنت مسرعةً، جاء الأطفال مسرعين."]],
 wx:[["أعرب «منتصرين» في: «عاد اللاعبون منتصرين».",["كيف عادوا؟ منتصرين.","حال منصوبة.","علامة نصبها الياء لأنها جمع مذكر سالم."]]]},
/*13 الاستثناء*/{d:[["تعريفه","الاستثناء إخراج اسم بعد أداة من حكم ما قبلها. «نجح التلاميذ إلا خالدًا»: خالد لم ينجح."],["أركانه","المستثنى منه (التلاميذ)، أداة الاستثناء (إلا)، المستثنى (خالدا)."],["أدواته","إلا، غير، سوى، عدا، خلا، حاشا."],["حكم المستثنى بإلا","إذا كانت الجملة تامة (فيها المستثنى منه) ومثبتة (غير منفية): يكون المستثنى منصوبا وجوبا. «حضر الضيوف إلا ضيفًا»."]],

/*14 العدد*/{d:[["العددان 1 و2","يوافقان المعدود في التذكير والتأنيث، ويأتيان بعده نعتا: كتاب واحد، قصة واحدة، كتابان اثنان، قصتان اثنتان."],["من 3 إلى 10","تخالف المعدود في التذكير والتأنيث: مع المذكر يكون العدد مؤنثا، ومع المؤنث يكون العدد مذكرا. ويكون المعدود جمعا مجرورا: ثلاثةُ كتبٍ، ثلاثُ قصصٍ."],["كيف أعرف جنس المعدود؟","أنظر إلى مفرده لا إلى جمعه: «سبع سنوات»: مفرد سنوات: سنة (مؤنث)، فالعدد مذكر «سبع»."]],
 wx:[["اختر: «في القسم (خمسة / خمس) طاولات».",["مفرد طاولات: طاولة، وهي مؤنثة.","العدد يخالف المعدود: يكون مذكرا.","«خمسُ طاولاتٍ»."]]]},
/*15 التحويل 1*/{d:[["معنى التحويل","نحول نصا شعريا إلى نص نثري، أي نعبر عن معنى الأبيات بكلام عادي دون وزن ولا قافية."],["الخطوات","1) قراءة الأبيات قراءة متأنية. 2) شرح الكلمات الصعبة بالمعجم. 3) فهم معنى كل بيت. 4) تحديد الأفكار العامة. 5) كتابة نص نثري مترابط بأسلوب شخصي."],["ما يجوز وما لا يجوز","يجوز تغيير الضمير (من المتكلم إلى الغائب)، وتغيير ترتيب الكلمات، وإضافة أدوات ربط. لا يجوز تغيير المعنى أو حذف الأفكار الأساسية."]],
 wx:[["حوّل: «بلادي وإن جارت علي عزيزة».",["الشرح: جارت: ظلمت.","المعنى: الشاعر يحب بلاده حتى لو ظلمته.","التحويل: يعبر الشاعر عن حبه الشديد لوطنه، فهو عزيز عليه رغم ما قد يلقاه فيه من ظلم."]]]},

/*17 إعراب العدد*/{d:[["الأعداد المفردة","من 3 إلى 10: تعرب حسب موقعها في الجملة (فاعل، مفعول به، مبتدأ...) بالحركات: جاء ثلاثةُ رجال، رأيت ثلاثةَ رجال."],["الأعداد المركبة","مبنية على فتح الجزأين في محل رفع أو نصب أو جر: جاء خمسةَ عشرَ رجلا (في محل رفع فاعل)."],["العدد 12","الجزء الأول يعرب إعراب المثنى: جاء اثنا عشر (مرفوع بالألف)، رأيت اثني عشر (منصوب بالياء)."],["ألفاظ العقود","تعرب إعراب جمع المذكر السالم: جاء عشرون (بالواو)، رأيت عشرين (بالياء)."]],

/*18 التمييز*/{d:[["تعريفه","اسم نكرة منصوب يأتي بعد كلمة مبهمة (غامضة) ليوضحها."],["تمييز الذات (الملفوظ)","بعد الأوزان والمكاييل والمساحات والأعداد: اشتريت كيلو لحمًا، شربت لترا حليبًا، زرعت هكتارا قمحًا، في القسم ثلاثون تلميذًا."],["تمييز النسبة (الملحوظ)","يوضح نسبة الفعل إلى فاعله: طاب المكان هواءً، ازداد الطالب علمًا."]],

/*19 النعت*/{d:[["تعريفه","النعت (الصفة) تابع يصف اسما قبله يسمى المنعوت، ويتبعه في: الإعراب، والتعريف والتنكير، والتذكير والتأنيث، والإفراد والتثنية والجمع."],["أنواعه","مفرد: رأيت حديقةً جميلةً. جملة (بعد نكرة): رأيت طفلا يلعب. شبه جملة (بعد نكرة): رأيت طائرا فوق الشجرة."],["تمييزه عن الحال","النعت يتبع المنعوت في التعريف: «جاء الطفل المبتسم» (نعت). الحال نكرة تأتي بعد معرفة غالبا: «جاء الطفل مبتسما» (حال)."]],
 wx:[["صحح: «قرأت القصة جميلة» لتصبح «جميلة» نعتا.",["المنعوت «القصة» معرفة.","النعت يتبعه في التعريف.","«قرأت القصة الجميلة»."]]]},
/*20 التحويل 2*/{d:[["قراءة الصورة","ننظر إلى الصورة من العام إلى الخاص: المكان والزمان، ثم الشخصيات، ثم الأشياء والألوان، ثم الأفعال والمشاعر."],["الترتيب المكاني","نستعمل عبارات: في مقدمة الصورة، في الوسط، في الخلفية، على اليمين، على اليسار، في الأعلى، في الأسفل."],["الكتابة","نكتب نصا وصفيا بجمل مترابطة، بأفعال في المضارع، مع صفات دقيقة، ثم نختم بالإحساس الذي تثيره الصورة."]],
 wx:[["ابدأ وصف صورة سوق.",["العام: تمثل الصورة سوقا شعبيا مزدحما في الصباح.","الخاص: على اليمين بائع خضر يرتب الطماطم.","الإحساس: تبدو الحركة والنشاط في كل مكان."]]]},
/*21 التوكيد*/{d:[["تعريفه","تابع يقوي المعنى في ذهن السامع ويزيل الشك."],["التوكيد اللفظي","بتكرار الكلمة أو الجملة: جاء جاء الأستاذ. نعم نعم. الصدق الصدق."],["التوكيد المعنوي","بألفاظ خاصة متصلة بضمير يعود على المؤكد: نفس، عين، كل، جميع، كلا، كلتا. «جاء المدير نفسُه»، «نجح التلاميذ كلُّهم»."],["إعرابه","يتبع المؤكد في إعرابه: «رأيت المديرَ نفسَه»، «سلمت على المديرِ نفسِه»."]],
 wx:[["أعرب «كلّهم» في: «حضر الضيوف كلّهم».",["كلهم يؤكد الضيوف.","توكيد معنوي مرفوع بالضمة لأن الضيوف فاعل مرفوع.","والضمير «هم» مضاف إليه."]]]},
/*22 العطف*/{d:[["تعريفه","تابع يأتي بعد حرف عطف، ويتبع المعطوف عليه في الإعراب."],["حروف العطف ومعانيها","الواو: الجمع (جاء خالد وسعيد). الفاء: الترتيب مع التعقيب السريع. ثم: الترتيب مع المهلة. أو: التخيير. بل: الإضراب. لا: النفي. حتى: الغاية."],["أمثلة","زرت فاس ثم مكناس (بعد مدة). دخل المعلم فالتلاميذ (مباشرة). خذ قلما أو كتابا."]],
 wx:[["أعرب «دفترا» في: «اشتريت قلما ودفترا».",["الواو: حرف عطف.","دفترا: معطوف على «قلما».","منصوب مثله بالفتحة."]]]},
/*23 المحاكاة*/{d:[["معنى المحاكاة","أن أكتب نصا جديدا على منوال نص نموذجي، أحافظ على بنيته (أجزائه وطريقة تنظيمه وأسلوبه)، وأغير الموضوع أو الشخصيات أو المكان."],["الخطوات","1) أقرأ النص النموذج. 2) أحدد بنيته: كيف يبدأ، كيف يتطور، كيف ينتهي. 3) أحدد خصائص أسلوبه (وصف، حوار، أفعال...). 4) أختار موضوعي. 5) أكتب على نفس البنية."]],

/*24 البدل*/{d:[["تعريفه","تابع مقصود بالحكم، يأتي بعد اسم (المبدل منه) دون حرف بينهما ليوضحه أو يحدده."],["أنواعه","بدل مطابق (كل من كل): حضر أخوك محمدٌ. بدل بعض من كل: أكلت الرغيفَ نصفَه. بدل اشتمال: أعجبني الطالبُ أخلاقُه."],["إعرابه","يتبع المبدل منه في الإعراب. ويتصل بدل البعض وبدل الاشتمال بضمير يعود على المبدل منه."]],

/*25 المذكر والمؤنث*/{d:[["علامات التأنيث","التاء المربوطة (فاطمة، شجرة)، الألف المقصورة (سلمى، كبرى)، الألف الممدودة (صحراء، حسناء)."],["المؤنث بدون علامة","بعض الأسماء مؤنثة دون علامة: شمس، أرض، دار، نار، ريح، يد، عين، رجل (العضو)، بئر."],["الحقيقي والمجازي","المؤنث الحقيقي له مذكر من جنسه: امرأة/رجل، بقرة/ثور، لبؤة/أسد. المؤنث المجازي ليس له مذكر: شمس، سيارة، مدرسة."],["يذكر ويؤنث","بعض الكلمات تستعمل مذكرة ومؤنثة: طريق، سوق، سكين، حال."]],

// ===== Explications détaillées — Français =====
DET("fr",[
/*0*/{d:[["Les éléments d'un récit","Un récit raconte des événements vécus par des personnages, dans un lieu et à une époque (le cadre). Au début, on répond aux questions : qui ? où ? quand ?"],["Le schéma narratif","La plupart des récits suivent cinq étapes : la situation initiale (tout est calme), l'élément perturbateur (un problème arrive, souvent annoncé par « soudain », « un jour »), les péripéties (les aventures), la résolution (le problème se règle), la situation finale (un nouvel équilibre)."],["Roman et nouvelle","Le roman est long, avec beaucoup de personnages et de lieux. La nouvelle est courte, avec peu de personnages, une seule action et souvent une fin surprenante."],["Les temps du récit","Le récit au passé utilise le passé simple pour les actions principales (il ouvrit la porte) et l'imparfait pour les descriptions et les habitudes (il faisait froid)."]],
 wx:[["Dans « Il faisait beau. Soudain, un cri retentit. », repère les temps et leur rôle.",["« faisait » : imparfait, il décrit le décor.","« retentit » : passé simple, c'est une action soudaine.","« Soudain » annonce l'élément perturbateur."]]]},
/*1*/{d:[["Le portrait physique","Il décrit l'apparence : la taille, la silhouette, le visage, les cheveux, les yeux, les vêtements. On organise la description, souvent du haut vers le bas ou du général au détail."],["Le portrait moral","Il décrit le caractère, les qualités et les défauts : généreux, courageux, timide, avare, jaloux. Il se révèle souvent par les actions du personnage."],["Les outils","Des adjectifs précis, des compléments du nom (des yeux couleur de miel), des comparaisons (comme, tel, pareil à) et des métaphores."],["Les fonctions du portrait","Il permet au lecteur d'imaginer le personnage, de le juger (portrait élogieux ou critique) et de comprendre son rôle dans l'histoire."]],
 wx:[["Améliore la phrase : « Il a des yeux. »",["Ajoute un adjectif de couleur : « Il a des yeux noirs. »","Ajoute un adjectif de forme : « Il a de grands yeux noirs. »","Ajoute une comparaison : « Il a de grands yeux noirs qui brillent comme des étoiles. »"]]]},
/*2*/{d:[["Le dialogue dans le récit","Pour rapporter les paroles directement, on utilise un verbe de parole, les deux-points, les guillemets et des tirets à chaque changement d'interlocuteur. Le verbe de parole précise le ton : murmurer, crier, répliquer."],["Discours direct et indirect","Direct : Il dit : « Je suis fatigué. » Indirect : Il dit qu'il est fatigué. Au discours indirect, on supprime les guillemets, on ajoute « que » ou « si », et on change les pronoms, les temps et les indicateurs de temps et de lieu."],["Le théâtre","Une pièce est écrite pour être jouée. Le texte est fait de répliques précédées du nom du personnage. Les didascalies, en italique, indiquent les gestes, le ton et le décor. Monologue : un personnage parle seul. Aparté : il parle au public sans que les autres l'entendent."]],
 wx:[["Transforme au discours indirect : Ali demande à Sara : « Tu viens demain ? »",["C'est une question fermée (oui/non) : on utilise « si ».","« tu » devient « elle », « demain » reste si on est au présent.","Ali demande à Sara si elle vient demain."]]]},
/*3*/{d:[["Le merveilleux","Le monde du conte : la magie est normale et acceptée par les personnages (fées, ogres, objets magiques). Le récit commence souvent par « Il était une fois »."],["Le fantastique","Un événement étrange et inexplicable surgit dans le monde réel. Le personnage et le lecteur hésitent entre une explication rationnelle et une explication surnaturelle."],["La science-fiction","Elle imagine le futur ou d'autres planètes à partir des sciences et des techniques : robots, vaisseaux, voyages dans le temps."],["L'ordre du récit","Le narrateur peut raconter dans l'ordre chronologique, faire un retour en arrière (raconter un événement passé), ou une ellipse (sauter une période : « Trois ans plus tard… »). Il peut accélérer (sommaire) ou ralentir (scène détaillée) le rythme."]],
 wx:[["Quel est le genre de : « En 2350, la navette quitta la Terre pour Mars » ?",["L'histoire se passe dans le futur.","Elle utilise des techniques avancées (navette, voyage vers Mars).","C'est de la science-fiction."]]]},
/*4*/{d:[["Qui raconte ?","Le narrateur n'est pas l'auteur. Il peut être un personnage de l'histoire (récit à la 1re personne, « je ») ou rester extérieur (récit à la 3e personne, « il »)."],["Le point de vue interne","On voit l'histoire à travers les yeux d'un personnage : on connaît ses pensées et ses sentiments, mais on ne sait que ce qu'il sait."],["Le point de vue externe","Le narrateur observe comme une caméra : il décrit ce qu'on voit et entend, sans entrer dans les pensées. Cela crée du mystère."],["Le point de vue omniscient","Le narrateur sait tout : les pensées de tous les personnages, leur passé et parfois leur avenir."]],
 wx:[["« Karim tremblait. Il pensait que personne ne viendrait. » Quel point de vue ?",["On connaît les pensées de Karim.","On voit la scène à travers lui.","C'est le point de vue interne."]]]},
/*5*/{d:[["Le but du texte explicatif","Il fait comprendre un phénomène, une situation ou un fonctionnement. Il répond aux questions « pourquoi ? » et « comment ? ». Il est objectif : il n'exprime pas d'opinion."],["Sa structure","Une introduction pose la question. Le développement donne l'explication étape par étape. Une conclusion résume."],["Ses outils","Le présent de vérité générale, un vocabulaire précis, des définitions, des exemples, des schémas, des tableaux, et des connecteurs logiques : d'abord, ensuite, enfin, parce que, car, donc, c'est pourquoi."],["Décrire ou expliquer ?","Décrire, c'est dire comment est une chose. Expliquer, c'est dire pourquoi elle est ainsi ou comment elle fonctionne."]],
 wx:[["Explique en deux phrases pourquoi la glace fond au soleil.",["Le soleil chauffe la glace.","Quand sa température dépasse 0 °C, la glace devient liquide : elle fond.","Connecteurs possibles : « parce que », « donc »."]]]},
/*6*/{d:[["Des explications dans le récit","Un récit peut contenir des passages qui expliquent : le narrateur s'arrête pour expliquer un objet, une coutume, un lieu ou le comportement d'un personnage. Ces passages sont souvent au présent."],["Le raisonnement par déduction","Dans les récits policiers, le détective observe des indices et en tire des conclusions logiques : c'est la déduction."],["Raconter pour expliquer","Les mythes et les contes étiologiques racontent une histoire imaginaire pour expliquer l'origine d'une chose : pourquoi la mer est salée, pourquoi le chameau a une bosse."]],
 wx:[["Sherlock voit de la boue rouge sur les chaussures d'un homme. Que peut-il déduire ?",["Il observe un indice : la boue rouge.","Il sait que cette terre rouge se trouve dans un seul quartier.","Il déduit que l'homme est passé par ce quartier."]]]},
/*7*/{d:[["Argumenter","Argumenter, c'est défendre une opinion (la thèse) pour convaincre quelqu'un. On s'appuie sur des arguments (les raisons) illustrés par des exemples (des faits précis)."],["Les connecteurs","Pour organiser : d'abord, ensuite, de plus, enfin. Pour justifier : car, en effet, parce que. Pour opposer : mais, cependant, pourtant. Pour conclure : donc, en conclusion, ainsi."],["Exprimer son opinion","Je pense que…, À mon avis…, Je suis convaincu que…, Il me semble que… On peut aussi réfuter l'avis contraire : « Certains pensent que…, mais… »."],["La critique au XVIIIe siècle","Des écrivains comme Voltaire, Montesquieu ou Marivaux critiquent la société (injustices, guerre, esclavage) de façon indirecte, souvent par des récits imaginaires."]],

<script>// ===== Moteur de figures SVG (thème clair/sombre via classes CSS) =====
const FIG={};
const F=(()=>{
  const r=v=>Math.round(v*10)/10;
  const svg=(w,h,body,cap)=>'<figure class="figw"><svg class="fig" viewBox="0 0 '+w+' '+h+'" direction="ltr" role="img"'+(cap?' aria-label="'+cap.replace(/["`\[\]{}]/g,"")+'"':'')+'>'+body+'</svg>'+(cap?'<figcaption>'+(typeof fmt==="function"?fmt(cap):cap)+'</figcaption>':'')+'</figure>';
  const ln=(x1,y1,x2,y2,c)=>'<line x1="'+r(x1)+'" y1="'+r(y1)+'" x2="'+r(x2)+'" y2="'+r(y2)+'" class="'+(c||"l")+'"/>';
  const pl=(pts,c)=>'<polygon points="'+pts.map(p=>r(p[0])+","+r(p[1])).join(" ")+'" class="'+(c||"l")+'"/>';
  const pll=(pts,c)=>'<polyline points="'+pts.map(p=>r(p[0])+","+r(p[1])).join(" ")+'" class="'+(c||"l")+'"/>';
  const ci=(x,y,rad,c)=>'<circle cx="'+r(x)+'" cy="'+r(y)+'" r="'+r(rad)+'" class="'+(c||"l")+'"/>';
  const el=(x,y,rx,ry,c)=>'<ellipse cx="'+r(x)+'" cy="'+r(y)+'" rx="'+r(rx)+'" ry="'+r(ry)+'" class="'+(c||"l")+'"/>';
  const rc=(x,y,w,h,c,rr)=>'<rect x="'+r(x)+'" y="'+r(y)+'" width="'+r(w)+'" height="'+r(h)+'"'+(rr?' rx="'+rr+'"':'')+' class="'+(c||"l")+'"/>';
  const pa=(d,c)=>'<path d="'+d+'" class="'+(c||"l")+'"/>';
  const tx=(x,y,s,c,a)=>'<text x="'+r(x)+'" y="'+r(y)+'" class="'+(c||"t")+'" text-anchor="'+(a||"middle")+'" dominant-baseline="middle">'+s+'</text>';
  const dot=(x,y,c)=>ci(x,y,3,c||"fi");
  const arr=(x1,y1,x2,y2,c,hc)=>{const a=Math.atan2(y2-y1,x2-x1),s=8;
    return ln(x1,y1,x2-Math.cos(a)*s*.6,y2-Math.sin(a)*s*.6,c||"l")+pl([[x2,y2],[x2-s*Math.cos(a-.4),y2-s*Math.sin(a-.4)],[x2-s*Math.cos(a+.4),y2-s*Math.sin(a+.4)]],hc||"fi")};
  const mid=(A,B)=>[(A[0]+B[0])/2,(A[1]+B[1])/2];

async function startRec(target,l,key){
  stopRec(true);

  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("nomic");
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const chunks=[];mediaRec=new MediaRecorder(stream);
    mediaRec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    mediaRec.onstop=()=>{try{if(R.url)URL.revokeObjectURL(R.url)}catch(e){}R.url=chunks.length?URL.createObjectURL(new Blob(chunks,{type:mediaRec.mimeType||"audio/webm"})):null;
      if(stream)stream.getTracks().forEach(tr=>tr.stop());stream=null;R.on=false;render()};
    mediaRec.start();
    if(RecCtor){try{recog=new RecCtor();recog.lang=l==="ar"?"ar-MA":"fr-FR";recog.interimResults=true;recog.continuous=true;
      recog.onresult=e=>{let s="";for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript+" ";R.heard=s.trim()};
      recog.onerror=()=>{};recog.start()}catch(e){recog=null;R.noRec=true}}
    recTimer=setTimeout(()=>stopRec(),30000);
  }catch(e){R.on=false;R.err=t().micNo;if(stream)stream.getTracks().forEach(tr=>tr.stop());stream=null;render()}
}
function stopRec(silent){
  clearTimeout(recTimer);
  try{if(recog)recog.stop()}catch(e){}recog=null;

  if(!silent){R.on=false;render()}
}

/* ---- utilitaires ---- */
function shuffle(n,seed){const a=[...Array(n).keys()];let s=Math.abs(seed)*9301+49297;for(let i=n-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  if(n>1&&a.every((v,i)=>v===i))a.push(a.shift());return a}
function subj(id){return SUBJ.find(s=>s.id===id)}
const lvOf=E=>E.lv||1;
function exIdx(L,lv){const r=[];L.x.forEach((E,k)=>{if(lvOf(E)===lv)r.push(k)});return r}
const nSetsLv=(L,lv)=>Math.ceil(exIdx(L,lv).length/SET);
function hasGen(sid,li,lv){const g=GEN[sid]&&GEN[sid][li];return !!(g&&g.some(x=>lv==null||x[0]===lv))}
function lessonEx(sid,i){const e=(P.ex[sid]||{})[i];return e&&typeof e==="object"?e:{}}
function genCount(sid,i){return((P.gen[sid]||{})[i])||0}
function setSize(L,key){const [lv,s]=key.split("-").map(Number);const idx=exIdx(L,lv);return Math.min(SET,Math.max(0,idx.length-s*SET))}
function sStats(S){const r=P.read[S.id]||{};let nr=0,ns=0,ok=0,tot=0,all=0,g=false;
  S.L.forEach((L,i)=>{all+=L.x.length;if(hasGen(S.id,i))g=true;if(r[i])nr++;const e=lessonEx(S.id,i);for(const k in e){ns++;ok+=e[k];tot+=setSize(L,k)}ns+=genCount(S.id,i)});
  return{nr,ns,ok,tot,n:S.L.length,all,g}}
function errList(sid){const S=subj(sid);const hand=Object.keys((P.err||{})[sid]||{}).map(k=>k.split(".").map(Number)).filter(([i,k])=>S.L[i]&&S.L[i].x[k]);
  const gens=((P.errG||{})[sid]||[]).filter(it=>S.L[it.li]).map(it=>{const E=it.E.slice();if(it.fig)E.fig=it.fig;E.gen=1;return{li:it.li,E,id:it.id}});return hand.concat(gens)}

      else{let c="blank filled";if(st.done)c+=" good";else if(st.gCheck&&st.gCheck[i]===true)c+=" good";else if(st.gCheck&&st.gCheck[i]===false)c+=" bad";
        s+='<button type="button" class="'+c+'" data-gun="'+i+'"'+(st.done||(st.gCheck&&st.gCheck[i]===true)?' disabled':'')+'>'+fmt(bank[f])+'</button>'}}});
    h+='<div class="qrow"><p class="gap">'+s+'</p>'+(canSpeak&&st.done?'<button type="button" class="say" data-say="'+esc(plain(fullSentence(E)))+'" data-sl="'+S.lang+'" aria-label="Écouter">'+SPK+'</button>':'')+'</div>';
    if(!st.done){
      if(!filled)h+='<p class="lead" style="font-size:.85em;margin:0 0 8px">'+x.gapTip+'</p>';
      h+='<div class="pool">'+sh.filter(j=>!st.gFill.includes(j)).map(j=>'<button type="button" class="tok" data-gfill="'+j+'"'+(filled>=nb?' disabled':'')+'>'+fmt(bank[j])+'</button>').join("")+'</div>';
      h+='<div class="actions"><button type="button" class="btn" data-gcheck'+(filled<nb?' disabled':'')+'>'+x.check+'</button><button type="button" class="btn ghost" data-gclear'+(filled?'':' disabled')+'>'+x.clear+'</button></div>';
    }
  } else if(type==="m"){
    const pairs=E[2],sh=G.sh||(G.sh=shuffle(pairs.length,seed));
    if(!st.done&&!st.mDone.length)h+='<p class="lead" style="font-size:.85em;margin:0 0 8px">'+x.matchTip+'</p>';
    h+='<div class="mgrid"><div class="mcol">'+pairs.map((p,i)=>{const d=st.mDone.includes(i);
      return '<button type="button" class="mi'+(d?' done':st.mSel===i?' sel':'')+'" data-ml="'+i+'"'+(d?' disabled':'')+'>'+(d?'<span class="pair">'+(st.mDone.indexOf(i)+1)+'</span>':'')+fmt(p[0])+'</button>'}).join("")+'</div>';
    h+='<div class="mcol">'+sh.map(j=>{const d=st.mDone.includes(j);
      return '<button type="button" class="mi'+(d?' done':st.mMiss===j?' miss':'')+'" data-mr="'+j+'"'+(d?' disabled':'')+'>'+(d?'<span class="pair">'+(st.mDone.indexOf(j)+1)+'</span>':'')+fmt(pairs[j][1])+'</button>'}).join("")+'</div></div>';
  }
  if(st.msg==="no")h+='<div class="feedback no" role="status">'+(type==="o"?x.orderNo:type==="g"?x.gapNo:type==="m"?x.matchNo:x.notyet)+'</div>';
  const steps=String(E[E.length-1]).split(" | ");
  if(st.done){
    h+='<div class="feedback ok" role="status"><b>'+x.good+'</b>'+fmt(steps.join(" "))+'</div>';
    if(type==="o"||type==="g"){const key="ex"+li+"."+k+"."+G.pos,sent=fullSentence(E);
      h+='<div class="qrow" style="margin-top:12px;align-items:center"><span style="flex:1;font-size:.9em;color:var(--soft)">'+x.mic+'</span>'+tools(sent,S.lang,key)+'</div>'+recPanel(key)}
  }
  if(!st.done&&st.hint>0)h+='<div class="hint"><h4>'+x.helpH+'</h4><ol>'+steps.slice(0,st.hint).map(s=>'<li>'+fmt(s)+'</li>').join("")+'</ol></div>';
  h+='<div class="actions">';
  if(!st.done)h+='<button type="button" class="btn help" data-hint'+(st.hint>=steps.length?' disabled':'')+'>'+(st.hint?x.more:x.help)+'</button>';
  else h+='<button type="button" class="btn" data-next>'+(G.pos===n-1?x.finish:x.next)+'</button>';
  h+='</div></div>';
  return h;
}
function solved(){const G=view.g,S=subj(view.id),c=cur(S);G.e.done=true;G.e.msg=null;P.err=P.err||{};P.errG=P.errG||{};
  if(c.k>=0){const key=c.li+"."+c.k;if(G.e.first){G.score++;if(P.err[S.id]&&P.err[S.id][key])delete P.err[S.id][key]}else (P.err[S.id]=P.err[S.id]||{})[key]=1}
  else{const arr=P.errG[S.id]=P.errG[S.id]||[];if(G.e.first){G.score++;if(c.it.id){const i=arr.findIndex(z=>z.id===c.it.id);if(i>=0)arr.splice(i,1)}}
    else if(!c.it.id){const id=Date.now()+"-"+Math.floor(Math.random()*1e6);c.it.id=id;arr.push({li:c.li,E:c.E.slice(),fig:c.E.fig||null,id});if(arr.length>30)arr.shift()}}
  save()}
function miss(){view.g.e.first=false;view.g.e.msg="no"}

/* lecture à voix haute de toute une partie */
function readAll(which){const S=subj(view.id),L=S.L[view.i];const texts=which==="d"?(L.d||[]).flatMap(s=>[s[0],s[1]]):L.k;try{speechSynthesis.cancel();view.reading=true;
  texts.forEach((s,j)=>{const u=new SpeechSynthesisUtterance(plain(s));u.lang=S.lang==="ar"?"ar-SA":"fr-FR";u.rate=.85;if(j===texts.length-1)u.onend=()=>{view.reading=false;render()};speechSynthesis.speak(u)})}catch(e){view.reading=false}render()}

document.addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b||b.disabled)return;const d=b.dataset;
  if(b.id==="bLang"){lang=lang==="ar"?"fr":"ar";ls(KEY+"-lang",lang);render();return}
  if(b.id==="bSize"){size=size%3+1;ls(KEY+"-size",size);render();return}
  if(d.say!=null){speak(d.say,d.sl);return}
  if(d.readall!=null){if(view.reading){try{speechSynthesis.cancel()}catch(e){}view.reading=false;render()}else readAll(d.readall);return}
  if(d.rec!=null){if(R.on&&R.key===d.rk){stopRec();return}startRec(d.rec,d.sl,d.rk);return}
  if(d.recstop!=null){stopRec();return}
  const stopRead=()=>{try{if(view.reading)speechSynthesis.cancel()}catch(e){}view.reading=false};
  const go=v=>{resetRec();stopRead();view=v;render();scrollTo(0,0)};
  if(d.go){go({s:d.go});return}
  if(d.subj){go({s:"subj",id:d.subj});return}
  if(d.lesson!=null){go({s:"lesson",id:view.id,i:+d.lesson,step:0,lv:1});return}
  if(d.back!=null||d.backsubj!=null){go({s:"subj",id:view.id});return}
  if(d.quiz){stopRead();startQuiz(d.quiz);render();scrollTo(0,0);return}
  if(d.step!=null){resetRec();stopRead();view.step=+d.step;view.g=null;render();scrollTo(0,0);return}
  if(d.lv!=null){view.lv=+d.lv;render();return}
  if(d.wxs!=null){view.wx=view.wx||{};view.wx[d.wxs]=(view.wx[d.wxs]||0)+1;render();return}
  if(d.wxa!=null){view.wx=view.wx||{};view.wx[d.wxa]=99;render();return}
  if(d.wxr!=null){view.wx=view.wx||{};view.wx[d.wxr]=0;render();return}
  if(d.reset!=null){view.confirm=true;render();return}
  if(d.nowipe!=null){view.confirm=false;render();return}
  if(d.wipe!=null){P={read:{},ex:{},err:{},errG:{},gen:{},stars:0};save();view.confirm=false;render();return}
  if(d.set!=null){startSet(+d.set);render();scrollTo(0,0);return}
  if(d.gen!=null){view.lv=+d.gen;startGen(+d.gen);render();scrollTo(0,0);return}
  if(d.sets!=null){resetRec();view.g=null;render();scrollTo(0,0);return}
  const G=view.g;if(!G||G.end||!G.list.length)return;const S=subj(view.id),{E}=cur(S),st=G.e;
  if(d.again!=null){startSet(G.set);render();return}
  if(d.hint!=null){st.hint++;render();return}
  if(d.next!=null){resetRec();
    if(G.pos<G.list.length-1){G.pos++;G.e=newEx();G.sh=null}
    else{G.end=true;P.stars=(P.stars||0)+1;
      if(G.mode==="set"){const all=P.ex[S.id]=P.ex[S.id]||{};let e=all[view.i];if(!e||typeof e!=="object")e=all[view.i]={};const key=G.lv+"-"+G.set;e[key]=Math.max(e[key]??0,G.score)}
      if(G.mode==="gen"){const g=P.gen[S.id]=P.gen[S.id]||{};g[view.i]=(g[view.i]||0)+1}
      save()}
    render();scrollTo(0,0);return}
  if(d.opt!=null){const j=+d.opt,ans=E[0]==="q"?E[3]:(E[2]?0:1);if(j===ans)solved();else{st.tried.push(j);miss()}render();return}
  if(d.place!=null){st.placed.push(+d.place);st.ordCheck=null;st.msg=null;render();return}
  if(d.unplace!=null){st.placed.splice(+d.unplace,1);st.ordCheck=null;st.msg=null;render();return}
  if(d.oclear!=null){st.placed=[];st.ordCheck=null;st.msg=null;render();return}
  if(d.ocheck!=null){const chk=st.placed.map((j,p)=>E[2][j]===E[2][p]);if(chk.every(Boolean))solved();else{st.ordCheck=chk;miss()}render();return}
  if(d.gfill!=null){const nb=E[2].length;let k=-1;for(let i=0;i<nb;i++)if(st.gFill[i]==null){k=i;break}if(k>=0){st.gFill[k]=+d.gfill;if(st.gCheck)st.gCheck[k]=null;st.msg=null}render();return}
  if(d.gun!=null){const i=+d.gun;st.gFill[i]=null;if(st.gCheck)st.gCheck[i]=null;st.msg=null;render();return}
  if(d.gclear!=null){st.gFill=st.gFill.map((f,i)=>st.gCheck&&st.gCheck[i]===true?f:null);st.msg=null;render();return}
  if(d.gcheck!=null){const bank=E[2].concat(E[3]);const chk=E[2].map((a,i)=>st.gFill[i]!=null&&bank[st.gFill[i]]===a);if(chk.every(Boolean))solved();else{st.gCheck=chk;miss()}render();return}
  if(d.ml!=null){st.mSel=+d.ml;st.mMiss=null;st.msg=null;render();return}
  if(d.mr!=null){const j=+d.mr;if(st.mSel==null)return;
    if(j===st.mSel){st.mDone.push(j);st.mSel=null;st.mMiss=null;st.msg=null;if(st.mDone.length===E[2].length)solved()}
    else{st.mMiss=j;miss()}render();return}
});
// préparation des données
LVX.forEach(([sid,li,lv,E])=>{const S=subj(sid);if(S&&S.L[li]){E.lv=lv;S.L[li].x.push(E)}});
applyFigs();
render();
</script>
