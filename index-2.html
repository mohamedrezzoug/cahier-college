<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2350a8"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>دفتر الثانية إعدادي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Alegreya+Sans:wght@400;500;700&family=STIX+Two+Text:wght@400;600&display=swap">
<style>
/* Layout : cahier Seyès calme — une colonne, un écran = une tâche, grandes cibles tactiles, aucune animation surprise */
:root{
  --paper:#f5f7fa; --sheet:#ffffff; --ink:#1c2a44; --soft:#58647a;
  --rule:#cfdaee; --rule-v:#e6d9ec; --margin:#c8513f; --accent:#2350a8; --on-accent:#ffffff;
  --ok:#1b7348; --ok-bg:#e2f3e9; --no:#9a4a12; --no-bg:#fbefe3; --hint:#6b5a12; --hint-bg:#fbf5dc;
  --line:#dde4ef; --chip:#edf1f8;
  --c1:#2350a8; --c2:#c8513f; --c3:#1b8a6b; --c4:#d19a1c; --fill-a:#d9e4f8; --fill-s:#eef2f8; --sky:#d6ebfb; --earth:#4f8a5b; --water:#cfe6f5; --rock:#c9b79a; --crust:#a5927a; --mantle:#e8a35c; --core:#d9722e; --icore:#f2c94c; --magma:#e0592f;
  --f-disp:"Reem Kufi","Noto Naskh Arabic",system-ui,sans-serif;
  --f-ar:"Noto Naskh Arabic","Alegreya Sans",system-ui,sans-serif;
  --f-lat:"Alegreya Sans","Noto Naskh Arabic",system-ui,sans-serif;
  --f-math:"STIX Two Text","Cambria Math",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1625; --sheet:#151e30; --ink:#e4eaf5; --soft:#9ba8bf;
  --rule:#233250; --rule-v:#2c2742; --margin:#e07a66; --accent:#86a9ff; --on-accent:#0f1625;
  --ok:#78d6a6; --ok-bg:#16301f; --no:#f0a86b; --no-bg:#35240f; --hint:#e6cf72; --hint-bg:#302810;
  --line:#26324a; --chip:#1c2740;  --c1:#86a9ff; --c2:#e07a66; --c3:#56c49e; --c4:#e8c862; --fill-a:#22355e; --fill-s:#1a2438; --sky:#1d3550; --earth:#3f7a4d; --water:#1d3a52; --rock:#6b5d48; --crust:#5a4c3a; --mantle:#9a6232; --core:#a3521f; --icore:#b89130; --magma:#c24a26; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1625; --sheet:#151e30; --ink:#e4eaf5; --soft:#9ba8bf;
  --rule:#233250; --rule-v:#2c2742; --margin:#e07a66; --accent:#86a9ff; --on-accent:#0f1625;
  --ok:#78d6a6; --ok-bg:#16301f; --no:#f0a86b; --no-bg:#35240f; --hint:#e6cf72; --hint-bg:#302810;
  --line:#26324a; --chip:#1c2740;  --c1:#86a9ff; --c2:#e07a66; --c3:#56c49e; --c4:#e8c862; --fill-a:#22355e; --fill-s:#1a2438; --sky:#1d3550; --earth:#3f7a4d; --water:#1d3a52; --rock:#6b5d48; --crust:#5a4c3a; --mantle:#9a6232; --core:#a3521f; --icore:#b89130; --magma:#c24a26; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ar);font-size:var(--fs,18px);line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
:root[data-size="2"]{--fs:21px} :root[data-size="3"]{--fs:24px}
.wrap{max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.lat{font-family:var(--f-lat)}
[dir="ltr"].content{font-family:var(--f-lat);line-height:1.65}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:10px;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.mark{width:40px;height:40px;flex:none;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:14px}
.brand h1{font-family:var(--f-disp);font-weight:700;font-size:1.05em;margin:0;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;flex:none}
.tbtn{border:1px solid var(--line);background:var(--sheet);border-radius:999px;min-width:44px;height:40px;padding:0 10px;font-weight:700;font-size:15px;font-family:var(--f-lat)}

.nav{display:flex;gap:8px;margin-block:16px 6px;flex-wrap:wrap}
.nav button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:8px 18px;font-weight:600;min-height:44px}
.nav button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
h2{font-family:var(--f-disp);font-weight:700;font-size:1.35em;line-height:1.35;margin:18px 0 6px;text-wrap:balance}
h3{font-family:var(--f-disp);font-weight:500;font-size:.95em;color:var(--soft);margin:24px 0 8px;letter-spacing:.02em}
.lead{color:var(--soft);margin:0 0 14px}
.back{border:0;background:none;color:var(--accent);font-weight:600;padding:10px 0;margin-top:6px;min-height:44px}

/* subjects */
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.subj{text-align:start;border:1px solid var(--line);background:var(--sheet);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:118px}
.subj .sym{font-family:var(--f-math);font-size:1.4em;line-height:1;color:var(--accent)}
.subj b{font-family:var(--f-disp);font-weight:700;line-height:1.35}
.subj span{font-size:.78em;color:var(--soft)}
.bar{height:6px;border-radius:6px;background:var(--chip);overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--accent)}

/* lesson list */
.lessons{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.lessons li{border-bottom:1px solid var(--line)}
.lessons button{width:100%;border:0;background:none;text-align:start;display:grid;grid-template-columns:2.1em 1fr;gap:2px 10px;padding:12px 2px;align-items:start;min-height:52px}
.num{font-family:var(--f-math);color:var(--margin);text-align:center;line-height:1.7}
.tt{font-weight:600;line-height:1.5;min-width:0}
.chips{grid-column:2;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.72em;border-radius:999px;padding:1px 10px;background:var(--chip);color:var(--soft)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}

/* steps bar */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--chip);border-radius:14px;padding:4px;margin-block:10px 16px}
.steps button{border:0;background:none;border-radius:11px;padding:6px 2px;font-size:.8em;font-weight:600;line-height:1.3;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.steps button small{font-family:var(--f-math);font-size:.95em;color:var(--margin)}
.steps button[aria-selected="true"]{background:var(--sheet);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--accent)}

/* Seyès sheet */
.sheet{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:6px;
  background-image:linear-gradient(to bottom,transparent calc(100% - 1px),var(--rule) 0),linear-gradient(to right,transparent calc(100% - 1px),var(--rule-v) 0);
  background-size:100% 2em,2em 100%;padding:10px 16px 14px;padding-inline-start:44px;overflow:hidden}
.sheet::before{content:"";position:absolute;top:0;bottom:0;inset-inline-start:30px;width:2px;background:var(--margin);opacity:.7}
.keys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:k}
.keys li{line-height:2;display:flex;gap:8px;align-items:flex-start}
.keys li .t{flex:1;min-width:0;overflow-wrap:anywhere}
.keys b,.qtext b{color:var(--accent);font-weight:700}
.say{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;width:36px;height:36px;font-size:15px;line-height:1;display:grid;place-items:center;margin-top:2px}
.say svg{width:16px;height:16px}

.gloss{width:100%;border-collapse:collapse;background:var(--sheet);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gloss td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.gloss tr:last-child td{border-bottom:0}
.gloss td:first-child{font-weight:700;color:var(--accent)}
.gloss td.ar{font-family:var(--f-ar)}
.gloss td.la{font-family:var(--f-lat)}

/* exercise player */
.dots{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--chip);border:1.5px solid var(--line)}
.dot.cur{background:var(--accent);border-color:var(--accent)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dots span{font-size:.8em;color:var(--soft);margin-inline-start:6px;font-family:var(--f-lat)}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px}
.kind{font-size:.75em;color:var(--soft);font-weight:600;margin-bottom:4px}
.qrow{display:flex;gap:8px;align-items:flex-start}
.qtext{flex:1;min-width:0;font-weight:600;line-height:2;margin:0 0 12px;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 14px;min-height:52px;text-align:start;line-height:1.6;overflow-wrap:anywhere}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.tried{background:var(--no-bg);border-color:var(--no);color:var(--no);text-decoration:line-through;text-decoration-thickness:1px}
.opt[disabled]{cursor:default}
.vfrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vfrow .opt{text-align:center;font-weight:700}
/* order */
.slot{min-height:56px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--paper);margin-bottom:10px}
.slot:empty::before{content:attr(data-empty);color:var(--soft);font-size:.85em;padding-inline:6px}
.tok{border:1.5px solid var(--accent);background:var(--sheet);color:var(--ink);border-radius:10px;padding:6px 12px;min-height:44px;line-height:1.5;overflow-wrap:anywhere;max-width:100%;text-align:start}
.tok.placed{background:var(--chip)}
.tok.good{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.tok.bad{border-color:var(--no);background:var(--no-bg);color:var(--no)}
.pool{display:flex;flex-wrap:wrap;gap:6px}
/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mi{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 10px;min-height:52px;text-align:start;line-height:1.5;overflow-wrap:anywhere}
.mi.sel{border-color:var(--accent);background:var(--chip);box-shadow:0 0 0 1px var(--accent) inset}
.mi.done{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);cursor:default}
.mi.miss{border-color:var(--no);background:var(--no-bg)}
.mi .pair{display:inline-block;font-family:var(--f-math);font-size:.8em;margin-inline-end:6px;color:var(--ok)}

.feedback{margin-top:12px;border-radius:12px;padding:12px 14px;line-height:1.9}
.feedback.ok{background:var(--ok-bg);color:var(--ink);border-inline-start:4px solid var(--ok)}
.feedback.no{background:var(--no-bg);color:var(--ink);border-inline-start:4px solid var(--no)}
.feedback b{display:block}
.hint{margin-top:12px;background:var(--hint-bg);border-radius:12px;padding:12px 14px}
.hint h4{margin:0 0 4px;font-family:var(--f-disp);color:var(--hint);font-size:.9em}
.hint ol{margin:0;padding-inline-start:1.3em;line-height:1.9}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:8px 20px;font-weight:700;min-height:46px}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.help{background:var(--hint-bg);color:var(--hint);border:1.5px solid transparent}
.btn[disabled]{opacity:.45;cursor:default}
.end{text-align:center;padding:22px 16px}
.end .big{font-family:var(--f-math);font-size:2.4em;line-height:1.2;color:var(--accent)}
.end p{margin:6px 0 0}

.tip{background:var(--hint-bg);border-radius:14px;padding:14px 16px;line-height:1.9}
.tip h4{margin:0 0 4px;font-family:var(--f-disp);color:var(--hint);font-size:.95em}
.tip p{margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:var(--f-math);font-size:1.4em;font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:.72em;color:var(--soft)}
.ptable{width:100%;border-collapse:collapse;font-size:.88em}
.ptable td,.ptable th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start}
.ptable th{color:var(--soft);font-weight:600;font-size:.85em}
.ptable td.n{font-family:var(--f-math);font-variant-numeric:tabular-nums;white-space:nowrap}
.advice{margin:0;padding-inline-start:1.2em;display:flex;flex-direction:column;gap:8px}
.reset{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 16px;color:var(--soft);margin-top:18px;min-height:44px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.note{font-size:.8em;color:var(--soft);margin-top:22px}



/* figures */
.figw{margin:8px 0 12px;padding:10px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.figli{display:block!important}
.fig{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
.figw figcaption{font-size:.82em;color:var(--soft);text-align:center;margin-top:6px;line-height:1.6}
.fig .l{stroke:var(--ink);stroke-width:1.6;fill:none;stroke-linejoin:round;stroke-linecap:round}
.fig .thin{stroke-width:1} .fig .thick{stroke-width:2.6} .fig .d{stroke-dasharray:5 4}
.fig .a{stroke:var(--accent)} .fig .m{stroke:var(--margin)} .fig .grid{stroke:var(--line);stroke-width:1}
.fig .fi{fill:var(--ink)} .fig .fa{fill:var(--accent)} .fig .fm{fill:var(--margin)}
.fig .fov{fill:var(--accent);opacity:.55} .fig .fs{fill:var(--fill-s)} .fig .fs2{fill:var(--chip)} .fig .fa2{fill:var(--fill-a)}
.fig .p1{fill:var(--c1)} .fig .p2{fill:var(--c2)} .fig .p3{fill:var(--c3)} .fig .p4{fill:var(--c4)} .fig .ls{stroke:var(--sheet);stroke-width:2}
.fig text{font-family:var(--f-lat);font-size:13px;fill:var(--ink)}
.fig .t.b{font-weight:700} .fig .t.s{font-size:11.5px} .fig .t.big{font-size:18px;font-weight:700}
.fig .t.a{fill:var(--accent)} .fig .t.m{fill:var(--margin)} .fig .t.inv{fill:#fff}
.fig .atO{fill:#d64541} .fig .atC{fill:#3a3f47} .fig .atN{fill:#3d6fd6} .fig .atH{fill:#ffffff}
.fig .sun{fill:#f6c343} .fig .sky{fill:var(--sky)} .fig .earth{fill:var(--earth)} .fig .water{fill:var(--water)}
.fig .rock{fill:var(--rock)} .fig .crust{fill:var(--crust)} .fig .ground{fill:var(--rock);opacity:.6} .fig .mantle{fill:var(--mantle)} .fig .core{fill:var(--core)} .fig .icore{fill:var(--icore)}
.fig .magma{fill:var(--magma)} .fig .lava{stroke:var(--magma);fill:none;stroke-linecap:round}
.fig .rk1{fill:var(--rock)} .fig .rk2{fill:var(--crust)} .fig .rk3{fill:var(--fill-a)}
.fig .glass{fill:var(--fill-a);opacity:.85} .fig .glass2{fill:var(--chip)} .fig .hole{fill:var(--sheet)} .fig .shadow{fill:var(--ink);opacity:.18}
.fig .flame{fill:#f39c34;opacity:.9} .fig .flameB{fill:#4f86e8} .fig .flameY{fill:#f4b63a}
.fig .sR{stroke:#e53935}.fig .sO{stroke:#fb8c00}.fig .sY{stroke:#fdd835}.fig .sG{stroke:#43a047}.fig .sB{stroke:#1e88e5}.fig .sI{stroke:#3949ab}.fig .sV{stroke:#8e24aa}
.fig .wP{stroke:#d64541;stroke-width:2.4} .fig .wN{stroke:#3d6fd6;stroke-width:2.4} .fig .wT{stroke:#3c9d4e;stroke-width:2.4;stroke-dasharray:8 4}
.fig .stem{stroke:var(--c3)} .fig .petal{fill:var(--c2);opacity:.75} .fig .sepal{fill:none;stroke:var(--c3);stroke-width:2.4} .fig .pollen{fill:var(--c4)}
/* nouveautés */
.starbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--hint-bg);color:var(--hint);border-radius:14px;padding:8px 16px;margin-top:8px}
.starbar b{font-family:var(--f-math);font-size:1.15em}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
.quick .set{min-height:70px}.qi{display:flex;flex-direction:column;gap:2px;min-width:0}
.set[disabled]{opacity:.55;cursor:default}
.from{font-size:.75em;color:var(--margin);font-weight:600;margin-bottom:2px}
.star{color:var(--hint);font-weight:700}
@media (max-width:420px){.quick{grid-template-columns:1fr}}


/* niveaux, séries nouvelles, explications */
.lvtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 12px}
.lvtabs button{border:1.5px solid var(--line);background:var(--sheet);border-radius:12px;padding:8px 4px;min-height:58px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.3}
.lvtabs button .stars{font-size:.75em;letter-spacing:1px}
.lvtabs button[aria-selected="true"]{border-color:var(--accent);background:var(--chip);color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.lvtabs button.empty{opacity:.5}
.set.gen{border-color:var(--accent);background:var(--chip)}
.lvtag{font-size:.85em;margin-inline-start:6px}
.details{display:flex;flex-direction:column;gap:10px}
.detail{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.detail h4{margin:0 0 4px;font-family:var(--f-disp);font-weight:700;color:var(--accent);font-size:1em;line-height:1.4}
.detail p{margin:0;flex:1;min-width:0;line-height:1.95;overflow-wrap:anywhere}
.wx{margin-bottom:12px}
.wxq{display:flex;gap:10px;align-items:flex-start}
.wxq p{margin:0;font-weight:600;line-height:1.9;flex:1;min-width:0;overflow-wrap:anywhere}
.wxn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-math);font-weight:700}
.wxs{margin:10px 0 0;padding-inline-start:1.4em;display:flex;flex-direction:column;gap:6px;line-height:1.9}
.wxs li{background:var(--ok-bg);border-radius:8px;padding:4px 10px}
@media (max-width:420px){.steps button{font-size:.66em}.lvtabs button{font-size:.85em}}

/* gap fill */
.gap{line-height:2.4;font-weight:600;margin:0 0 12px;overflow-wrap:anywhere}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:4.5em;min-height:40px;padding:0 10px;margin:2px 3px;border-bottom:2.5px solid var(--soft);border-radius:8px 8px 0 0;background:var(--paper);vertical-align:middle;font-weight:700}
.blank.next{border-bottom-color:var(--accent);background:var(--chip)}
.blank.filled{border:1.5px solid var(--accent);border-radius:10px;background:var(--sheet)}
.blank.good{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.blank.bad{border-color:var(--no);background:var(--no-bg);color:var(--no)}
/* series */
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid var(--line);background:var(--sheet);border-radius:14px;padding:12px 16px;min-height:60px;text-align:start}
.set b{font-family:var(--f-disp)}
.set span{font-size:.8em;color:var(--soft)}
.set .chip{font-size:.75em}
/* mic */
.lineTools{display:flex;gap:6px;flex:none}
.mic{border-color:var(--margin);color:var(--margin)}
.mic.on{background:var(--margin);color:var(--paper)}
.recpanel{margin-top:8px;background:var(--chip);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;line-height:1.7}
.recpanel audio{width:100%;max-width:100%;height:40px}
.recpanel .heard{font-size:.9em}
.recpanel .heard b{color:var(--accent)}
.recpanel .err{color:var(--no);font-size:.9em}
.recdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--margin);margin-inline-end:6px}
.keys li{flex-wrap:wrap}
.keys li .recpanel{flex-basis:100%}

/* math */
.m{font-family:var(--f-math);unicode-bidi:isolate;padding-inline:1px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;font-size:.88em;margin-inline:2px}
.fr>span:first-child{border-bottom:1.3px solid currentColor;padding-inline:3px}
.vec{display:inline-block;position:relative;padding-top:.32em;line-height:1;font-family:var(--f-math)}
.vec::before{content:"";position:absolute;top:.14em;left:.04em;right:.2em;border-top:1.3px solid currentColor}
.vec::after{content:"";position:absolute;top:-.01em;right:0;border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
@media (max-width:420px){.steps button{font-size:.72em}h2{font-size:1.2em}}
</style>

k:["Un mot peut avoir plusieurs sens : il est <b>polysémique</b>.","Sens <b>propre</b> : le sens premier. Sens <b>figuré</b> : un sens imagé.","Exemple : un cœur qui bat (propre) / avoir bon cœur (figuré).","<b>Synonymes</b> : sens proche (content / heureux).","<b>Antonymes</b> : sens contraire (grand / petit)."],
w:[["synonyme","مرادف"],["antonyme","ضد"],["sens propre","معنى حقيقي"],["sens figuré","معنى مجازي"]],
x:[["m","Relie chaque mot à son antonyme.",[["grand","petit"],["chaud","froid"],["rapide","lent"]],"Antonyme = contraire."],
["q","Un synonyme de « content » :",["heureux","triste"],0,"Même sens."],
["q","« Il a un cœur de pierre. » C'est le sens :",["figuré","propre"],0,"Le cœur n'est pas vraiment en pierre."],
["vf","Un mot polysémique a un seul sens.",false,"Poly = plusieurs."]]},

{t:"Le champ lexical (leçon 3)",
k:["Un <b>champ lexical</b> est un ensemble de mots liés à un même thème.","Exemple, la mer : vague, plage, bateau, sable, poisson.","Il aide à reconnaître le thème d'un texte.","Les mots peuvent être des noms, des verbes, des adjectifs."],
w:[["champ lexical","الحقل المعجمي"],["thème","موضوع"]],
x:[["q","Quel mot n'appartient pas au champ lexical de l'école ?",["cahier","professeur","vague"],2,"La vague, c'est la mer."],
["m","Relie chaque mot à son champ lexical.",[["médecin","la santé"],["ballon","le sport"],["récolte","l'agriculture"]],"À quel thème pense-t-on ?"],
["vf","« Neige, froid, hiver » forment un champ lexical.",true,"Le thème : l'hiver."],
["q","Le thème de « sable, dune, chameau, chaleur » :",["le désert","la forêt"],0,"Ce sont des mots du désert."]]},

{t:"Le vocabulaire de la description, de l'explication et de l'image (leçons 4 à 6)",
k:["<b>Décrire</b> : adjectifs de couleur, de forme, de taille. Indicateurs de lieu : à gauche, au fond, au premier plan.","<b>Expliquer</b> : cause, conséquence, but. Mots : car, donc, afin de, grâce à.","<b>L'image</b> : plan (gros plan, plan d'ensemble), premier plan, arrière-plan, cadrage, couleurs, lumière."],
w:[["premier plan","المقدمة / الواجهة"],["arrière-plan","الخلفية"],["indicateur de lieu","ظرف مكان"]],
x:[["m","Relie.",[["au premier plan","près de nous"],["à l'arrière-plan","loin de nous"]],"Premier = devant."],
["q","« Afin de » exprime :",["le but","le lieu"],0,"Afin de = pour."],
["o","Range pour décrire l'image.",["Au premier plan,","un enfant","lit","un livre"],"Lieu + sujet + verbe + complément."],
["q","Un adjectif de couleur :",["rouge","rond","grand"],0,"Rond = forme. Grand = taille."]]},

{s:"Outils de langue : Conjugaison",t:"Le verbe et le mode indicatif (leçons 7-8)",
k:["Le <b>verbe</b> exprime une action ou un état. Il se conjugue.","Trois groupes : 1er (-er), 2e (-ir, -issons), 3e (les autres).","L'<b>indicatif</b> exprime un fait réel.","Temps simples : présent, imparfait, passé simple, futur.","Temps composés : passé composé, plus-que-parfait (auxiliaire avoir ou être + participe passé)."],
w:[["verbe","فعل"],["groupe","مجموعة"],["indicatif","صيغة الإخبار"],["auxiliaire","فعل مساعد"]],
x:[["m","Relie chaque verbe à son groupe.",[["chanter","1er groupe"],["finir","2e groupe"],["prendre","3e groupe"]],"Finir → nous finissons : 2e groupe."],
["q","« Nous mangions » est à :",["l'imparfait","au futur"],0,"Terminaison -ions."],
["q","« Il a mangé » est au :",["passé composé","présent"],0,"Auxiliaire « a » + participe « mangé »."],
["o","Range pour faire une phrase au futur.",["Demain,","nous","visiterons","le musée"],"Futur : terminaison -rons."]]},

{t:"Le mode conditionnel (leçon 9)",
k:["Le <b>conditionnel</b> exprime une action possible, un souhait ou une demande polie.","Formation : radical du futur + terminaisons de l'imparfait.","je chanter<b>ais</b>, tu chanter<b>ais</b>, il chanter<b>ait</b>, nous chanter<b>ions</b>, vous chanter<b>iez</b>, ils chanter<b>aient</b>.","Avec « si » : Si j'avais le temps, je <b>viendrais</b>.","Politesse : Je <b>voudrais</b> un verre d'eau."],
w:[["conditionnel","صيغة الشرط"],["souhait","أمنية"],["politesse","أدب / لباقة"]],
x:[["q","« Je voudrais » exprime :",["une demande polie","un ordre"],0,"Plus poli que « je veux »."],
["q","Complète : Si j'avais un vélo, je … au parc.",["irais","vais","irai"],0,"Si + imparfait → conditionnel."],
["vf","« Nous partirions » est au conditionnel.",true,"Terminaison -ions sur le radical du futur."],
["o","Range la phrase.",["Si","il faisait beau,","nous","irions à la plage"],"Si + condition, puis le résultat."]]},

{t:"Le mode subjonctif (leçon 10)",
k:["Le <b>subjonctif</b> exprime un souhait, une obligation, un doute.","Il vient souvent après « que » : Il faut <b>que</b> tu <b>viennes</b>.","Terminaisons : -e, -es, -e, -ions, -iez, -ent.","Verbes à retenir : être (que je sois), avoir (que j'aie), aller (que j'aille), faire (que je fasse)."],
w:[["subjonctif","صيغة التمني والضرورة"],["obligation","وجوب"]],
x:[["q","Il faut que tu … tes devoirs.",["fasses","fais","feras"],0,"Après « il faut que » : subjonctif."],
["q","Je souhaite que vous … heureux.",["soyez","êtes"],0,"Souhait → subjonctif de être."],
["vf","Le subjonctif vient souvent après « que ».",true,"Il faut que, je veux que…"],
["o","Range la phrase.",["Il faut","que","nous","partions","tôt"],"Il faut que + sujet + verbe."]]},

{t:"Les verbes irréguliers (leçon 11)",
k:["Certains verbes changent de radical : ce sont des verbes irréguliers.","<b>être</b> : je suis, tu es, il est, nous sommes, vous êtes, ils sont.","<b>avoir</b> : j'ai, tu as, il a, nous avons, vous avez, ils ont.","<b>aller</b> : je vais, tu vas, il va, nous allons, vous allez, ils vont.","<b>faire</b> : je fais, tu fais, il fait, nous faisons, vous faites, ils font.","Il faut les apprendre par cœur."],
w:[["irrégulier","شاذ / غير قياسي"],["par cœur","عن ظهر قلب"]],
x:[["q","Nous … contents.",["sommes","êtes","sont"],0,"être avec nous : sommes."],
["q","Vous … vos devoirs.",["faites","faisez"],0,"Faire avec vous : faites."],
["m","Relie (verbe aller).",[["je","vais"],["nous","allons"],["ils","vont"]],"Aller est très irrégulier."],
["vf","« Ils ont » est le verbe avoir.",true,"avoir : ils ont."]]},

{t:"La voix passive (leçon 12)",
k:["Voix <b>active</b> : le sujet fait l'action. Le chat mange la souris.","Voix <b>passive</b> : le sujet subit l'action. La souris est mangée <b>par</b> le chat.","Formation : <b>être</b> + participe passé.","Le complément d'objet devient sujet. Le sujet devient <b>complément d'agent</b> (avec « par »)."],
w:[["voix active","المبني للمعلوم"],["voix passive","المبني للمجهول"],["complément d'agent","منفذ الفعل (بعد par)"]],
x:[["q","« La lettre est écrite par Sara. » La phrase est à la voix :",["passive","active"],0,"être + participe passé + par."],
["q","Passive de « Le vent casse la branche » :",["La branche est cassée par le vent.","Le vent est cassé par la branche."],0,"L'objet (la branche) devient sujet."],
["o","Range pour la voix passive.",["Le gâteau","est préparé","par","ma mère"],"Sujet + être + participe + par + agent."],
["vf","À la voix passive, on utilise l'auxiliaire être.",true,"être + participe passé."]]},

{t:"La voix pronominale (leçon 13)",
k:["Un verbe <b>pronominal</b> se conjugue avec un pronom : me, te, se, nous, vous, se.","Exemple : <b>se laver</b> → je me lave, tu te laves, il se lave.","Aux temps composés, on utilise l'auxiliaire <b>être</b> : elle s'est levée.","Sens réfléchi (on le fait à soi-même) ou réciproque (les uns aux autres : ils se parlent)."],
w:[["verbe pronominal","فعل ضميري"],["réfléchi","انعكاسي"],["réciproque","تبادلي"]],
x:[["q","Je … lave les mains.",["me","te","se"],0,"Avec je : me."],
["q","« Elle s'est levée » utilise l'auxiliaire :",["être","avoir"],0,"Les verbes pronominaux prennent être."],
["vf","« Ils se parlent » a un sens réciproque.",true,"Ils parlent l'un à l'autre."],
["o","Range la phrase.",["Nous","nous","levons","tôt"],"Sujet + pronom + verbe."]]},

{s:"Outils de langue : Grammaire",t:"Le classement des mots (leçon 14)",
k:["Les mots se classent en <b>classes grammaticales</b>.","Variables : nom, déterminant, adjectif, pronom, verbe.","Invariables : adverbe (vite), préposition (à, de, dans), conjonction (et, mais, car).","Exemple : Le (déterminant) petit (adjectif) chat (nom) dort (verbe) bien (adverbe)."],
w:[["nom","اسم"],["adjectif","صفة"],["adverbe","حال / ظرف"],["préposition","حرف جر"]],
x:[["m","Relie chaque mot à sa classe.",[["maison","nom"],["joli","adjectif"],["courir","verbe"],["lentement","adverbe"]],"Un adverbe se termine souvent par -ment."],
["q","Dans « Le chat dort », « Le » est :",["un déterminant","un nom"],0,"Il est devant le nom."],
["vf","« Et » est une conjonction.",true,"Et, mais, ou, donc, or, ni, car."],
["q","« Dans » est :",["une préposition","un adjectif"],0,"Elle indique souvent le lieu."]]},

{t:"Le nom et ses substituts (leçon 15)",
k:["Pour éviter les répétitions, on remplace un nom par un <b>substitut</b>.","Substituts : <b>pronoms</b> (il, elle, le, lui), <b>synonymes</b>, <b>périphrases</b>.","Exemple : Karim arrive. <b>Il</b> est content. <b>Le jeune garçon</b> sourit.","Périphrase : un groupe de mots qui désigne une chose. « Le roi des animaux » = le lion."],
w:[["substitut","معوض"],["pronom","ضمير"],["périphrase","كناية / تعبير بديل"]],
x:[["q","« La ville » dans « Fès est belle. Elle est ancienne. » est remplacée par :",["Elle","belle"],0,"Elle = Fès."],
["q","Une périphrase pour « le lion » :",["le roi des animaux","le chat"],0,"Un groupe de mots qui le désigne."],
["vf","On utilise des substituts pour éviter les répétitions.",true,"C'est leur rôle."],
["o","Range pour éviter la répétition.",["Sara","lit.","Elle","aime les livres."],"Elle remplace Sara."]]},

{t:"Les fonctions par rapport au nom (leçons 16-17)",
k:["Le nom peut être complété par :","l'<b>adjectif épithète</b> : une maison <b>blanche</b>.","le <b>complément du nom</b> : la maison <b>de mon oncle</b>.","la <b>proposition subordonnée relative</b> : la maison <b>qui est au coin</b>.","l'<b>apposition</b> : Fès, <b>la ville ancienne</b>, attire les touristes."],
w:[["épithète","نعت"],["complément du nom","مضاف إليه / تكملة الاسم"],["relative","جملة موصولة"],["apposition","بدل"]],
x:[["m","Relie.",[["un chat noir","adjectif épithète"],["le livre de Sami","complément du nom"],["l'élève qui chante","relative"]],"Qui = relative. De = complément du nom."],
["q","Dans « une robe en coton », « en coton » est :",["complément du nom","adjectif épithète"],0,"Préposition + nom."],
["vf","« qui habite ici » est une subordonnée relative.",true,"Elle commence par « qui »."],
["q","Dans « Rabat, la capitale, est belle », « la capitale » est :",["une apposition","un verbe"],0,"Entre virgules, elle explique le nom."]]},

{t:"Les phrases (leçons 18-19)",
k:["Types de phrases : <b>déclarative</b> (.), <b>interrogative</b> (?), <b>exclamative</b> (!), <b>injonctive</b> (ordre).","Forme <b>affirmative</b> ou <b>négative</b> (ne … pas).","Phrase <b>simple</b> : un seul verbe conjugué.","Phrase <b>complexe</b> : plusieurs verbes conjugués, donc plusieurs propositions.","Les propositions sont juxtaposées (,), coordonnées (et, mais) ou subordonnées (que, qui, quand)."],
w:[["phrase simple","جملة بسيطة"],["phrase complexe","جملة مركبة"],["proposition","جملة فرعية"]],
x:[["m","Relie chaque phrase à son type.",[["Quelle heure est-il ?","interrogative"],["Ferme la porte.","injonctive"],["Quelle belle journée !","exclamative"]],"Regarde la ponctuation."],
["q","« Je mange et je bois. » C'est une phrase :",["complexe","simple"],0,"Deux verbes conjugués."],
["q","Forme négative de « Il parle » :",["Il ne parle pas.","Il parle pas ne."],0,"ne + verbe + pas."],
["o","Range la phrase négative.",["Je","ne","suis","pas","fatigué"],"ne … pas entoure le verbe."]]},

{t:"Les fonctions dans la phrase (leçons 20 à 22)",
k:["<b>Sujet</b> : qui fait l'action. Question : qui est-ce qui ?","<b>COD</b> (complément d'objet direct) : verbe + quoi ? / qui ? — Il lit <b>un livre</b>.","<b>COI</b> : verbe + à qui ? / de quoi ? — Il parle <b>à son ami</b>.","<b>Attribut du sujet</b> : après être, paraître, sembler — Il est <b>malade</b>.","<b>Compléments circonstanciels</b> : de lieu (où ?), de temps (quand ?), de manière (comment ?), de cause (pourquoi ?). Ils peuvent être déplacés."],
w:[["sujet","فاعل / مبتدأ"],["COD","مفعول به مباشر"],["COI","مفعول به غير مباشر"],["complément circonstanciel","ظرف / مفعول فيه"]],
x:[["q","Dans « Le chat mange la souris », « la souris » est :",["COD","sujet"],0,"Le chat mange quoi ? la souris."],
["q","Dans « Il pense à ses vacances », « à ses vacances » est :",["COI","COD"],0,"Il pense à quoi ? Il y a « à »."],
["m","Relie chaque complément circonstanciel.",[["dans le jardin","lieu"],["hier","temps"],["doucement","manière"]],"Où ? Quand ? Comment ?"],
["vf","Dans « Elle est contente », « contente » est attribut du sujet.",true,"Après le verbe être."]]},

{t:"L'expression du temps (leçon 23)",
k:["Le temps peut s'exprimer par :","des adverbes : hier, aujourd'hui, demain, souvent.","des groupes nominaux : le matin, pendant les vacances.","des subordonnées : <b>quand</b>, <b>lorsque</b>, <b>pendant que</b>, <b>avant que</b>, <b>après que</b>.","Relations : <b>antériorité</b> (avant), <b>simultanéité</b> (en même temps), <b>postériorité</b> (après)."],
w:[["antériorité","الأسبقية"],["simultanéité","التزامن"],["postériorité","البعدية"]],
x:[["m","Relie.",[["avant que","antériorité"],["pendant que","simultanéité"],["après que","postériorité"]],"Avant, pendant, après."],
["q","« Quand il pleut, je reste à la maison. » « Quand il pleut » exprime :",["le temps","la cause"],0,"Quand = à quel moment."],
["o","Range la phrase.",["Lorsque","la cloche sonne,","les élèves","sortent"],"Subordonnée de temps, puis principale."],
["vf","« Demain » est un adverbe de temps.",true,"Il dit quand."]]},

{t:"L'expression de la cause et de la conséquence (leçon 24)",
k:["La <b>cause</b> répond à « pourquoi ? » : parce que, car, puisque, à cause de, grâce à.","La <b>conséquence</b> donne le résultat : donc, alors, c'est pourquoi, si bien que.","Exemple : Il est malade, <b>donc</b> il reste au lit. / Il reste au lit <b>parce qu</b>'il est malade.","« Grâce à » : cause positive. « À cause de » : cause négative."],
w:[["cause","سبب"],["conséquence","نتيجة"]],
x:[["m","Relie.",[["parce que","cause"],["c'est pourquoi","conséquence"]],"Parce que = pourquoi."],
["q","« Il a réussi … son travail. »",["grâce à","à cause de"],0,"Réussir est positif."],
["o","Range pour exprimer la conséquence.",["Il fait froid,","donc","je mets","mon manteau"],"Fait + donc + résultat."],
["vf","« Car » exprime la conséquence.",false,"« Car » exprime la cause."]]},

{t:"L'expression de l'opposition (leçon 25)",
k:["L'<b>opposition</b> met en relation deux idées contraires.","Mots : <b>mais</b>, <b>pourtant</b>, <b>cependant</b>, <b>alors que</b>, <b>malgré</b>, <b>bien que</b> (+ subjonctif).","Exemple : Il est petit, <b>mais</b> il est fort.","Malgré + nom : <b>Malgré</b> la pluie, nous sortons."],
w:[["opposition","تعارض / مقابلة"],["malgré","رغم"]],
x:[["q","« Il est riche, … il n'est pas heureux. »",["mais","donc","car"],0,"Deux idées opposées."],
["q","« … la fatigue, il continue. »",["Malgré","Parce que"],0,"Malgré + nom."],
["vf","« Cependant » exprime l'opposition.",true,"Comme « mais »."],
["o","Range la phrase.",["Il pleut,","pourtant","nous","jouons dehors"],"Idée 1 + pourtant + idée 2."]]},

{t:"Les types de textes (leçons 26-27, 33 à 35)",
k:["<b>Texte narratif</b> : raconte une histoire (passé simple, imparfait, schéma narratif).","<b>Texte descriptif</b> : décrit un lieu, une personne, un objet (adjectifs, indicateurs de lieu).","<b>Texte explicatif</b> : explique un phénomène (connecteurs logiques, présent).","<b>Texte argumentatif</b> : défend une opinion (thèse, arguments).","Un texte est <b>cohérent</b> quand les idées s'enchaînent avec des connecteurs."],
w:[["narratif","سردي"],["descriptif","وصفي"],["explicatif","تفسيري"],["argumentatif","حجاجي"]],
x:[["m","Relie chaque texte à son but.",[["Narratif","raconter"],["Descriptif","décrire"],["Explicatif","expliquer"],["Argumentatif","convaincre"]],"Chaque type a un but."],
["q","Un texte qui explique pourquoi la Terre tremble est :",["explicatif","narratif"],0,"Il explique un phénomène."],
["q","Le temps principal du récit au passé :",["le passé simple","le futur"],0,"Avec l'imparfait pour le décor."],
["vf","Un texte descriptif utilise beaucoup d'adjectifs.",true,"Pour dire comment c'est."]]},

{t:"L'énonciation (leçons 28-29)",
k:["L'<b>énonciation</b> : qui parle, à qui, où, quand.","<b>Énoncé ancré</b> dans la situation : je, tu, ici, maintenant, aujourd'hui ; temps : présent, passé composé, futur.","<b>Énoncé coupé</b> de la situation : il, elle, là-bas, ce jour-là ; temps : passé simple, imparfait.","Une lettre est souvent ancrée. Un conte est souvent coupé."],
w:[["énonciation","التلفظ"],["énonciateur","المتكلم"],["destinataire","المخاطب"]],
x:[["m","Relie.",[["je, ici, maintenant","énoncé ancré"],["il, là-bas, ce jour-là","énoncé coupé"]],"Ancré = la situation de celui qui parle."],
["q","« Aujourd'hui, je suis à la maison. » L'énoncé est :",["ancré","coupé"],0,"je, aujourd'hui."],
["vf","Un conte est souvent un énoncé coupé de la situation.",true,"« Il était une fois… »"],
["q","Le destinataire, c'est :",["celui à qui on parle","celui qui parle"],0,"Destinataire = qui reçoit le message."]]},

{t:"Les paroles rapportées (leçon 30)",
k:["<b>Discours direct</b> : Il dit : « Je viendrai demain. »","<b>Discours indirect</b> : Il dit <b>qu'il viendra</b> le lendemain.","Changements : pronoms (je → il), temps, indicateurs (demain → le lendemain, ici → là).","Verbes de parole : dire, demander, répondre, crier, murmurer.","Question : Il demande : « Viens-tu ? » → Il demande <b>si</b> je viens."],
w:[["verbe de parole","فعل القول"],["guillemets","مزدوجتان"]],
x:[["q","Indirect de : Elle dit : « J'ai froid. »",["Elle dit qu'elle a froid.","Elle dit qu'il a froid."],0,"je → elle."],
["q","Indirect de : Il demande : « Tu viens ? »",["Il demande si tu viens.","Il demande que tu viens."],0,"Question oui/non → si."],
["m","Relie (discours indirect au passé).",[["demain","le lendemain"],["ici","là"]],"Les indicateurs changent."],
["vf","« Murmurer » est un verbe de parole.",true,"On parle doucement."]]},

{t:"Les effets dans le texte : mise en relief, figures de style (leçon 31)",
k:["<b>Mise en relief</b> : « C'est … qui / que » pour insister. C'est <b>Sara</b> qui a gagné.","<b>Comparaison</b> : avec un outil (comme, tel, pareil à). Il est fort comme un lion.","<b>Métaphore</b> : sans outil. Ce lion attaque (pour un homme courageux).","<b>Personnification</b> : une chose agit comme une personne. La lune sourit.","<b>Énumération</b> : une liste de mots. <b>Hyperbole</b> : une exagération. Je meurs de faim."],
w:[["figure de style","صورة بلاغية"],["exagération","مبالغة"]],
x:[["m","Relie chaque phrase à sa figure.",[["Rapide comme l'éclair","comparaison"],["Le soleil rit","personnification"],["J'ai mille choses à faire","hyperbole"]],"Comme = comparaison."],
["q","« C'est mon frère qui a cassé le vase. » Cette phrase utilise :",["une mise en relief","une comparaison"],0,"C'est … qui."],
["vf","Une métaphore utilise le mot « comme ».",false,"La métaphore n'a pas d'outil."],
["q","« Je meurs de faim » est :",["une hyperbole","une personnification"],0,"C'est une exagération."]]},

{t:"Les points de vue narratifs (leçon 32)",
k:["<b>Interne</b> : on voit par les yeux d'un personnage, on connaît ses pensées.","<b>Externe</b> : le narrateur observe comme un témoin, sans connaître les pensées.","<b>Omniscient</b> : le narrateur sait tout sur tous les personnages, le passé et l'avenir."],
w:[["interne","داخلي"],["externe","خارجي"],["omniscient","كلي العلم"]],
x:[["q","« Un homme entra. Il portait un chapeau. Personne ne savait qui il était. » Point de vue :",["externe","interne"],0,"On observe sans connaître les pensées."],
["q","Le narrateur sait tout, même l'avenir. Point de vue :",["omniscient","externe"],0,"Omni = tout."],
["vf","En point de vue interne, on connaît les pensées d'un personnage.",true,"On voit par ses yeux."],

{s:"Outils de langue : Orthographe",t:"Les homophones (leçons 36 à 38)",

{s:"الأسدوس الأول — المرحلة 1",t:"سورة النجم: الآيات 1 إلى 18 (التزكية)",

d:[["التعريف بالسورة","سورة النجم من السور المكية، سميت بهذا الاسم لأنها تبدأ بالقسم بالنجم. نزلت في مكة حين كان المشركون يكذبون النبي ﷺ ويقولون إن القرآن من عنده."],["مضامين الآيات 1 إلى 18","يقسم الله تعالى بالنجم على أن النبي ﷺ ما ضل وما غوى، وأنه لا يتكلم من عند نفسه، بل ما يبلغه وحي يوحى. والذي علّمه هو جبريل عليه السلام. ثم تصف الآيات رؤية النبي ﷺ لجبريل في صورته الحقيقية مرتين، الثانية عند سدرة المنتهى، ورأى من آيات ربه الكبرى."],["ما نستفيده","أن نصدق بكل ما جاء به النبي ﷺ، وأن نقرأ القرآن بيقين أنه كلام الله، وأن نحب نبينا ونقتدي به."]],

{t:"الله عالم الغيب والشهادة",

w:[["الغيب","ما غاب عن الحواس"],["الشهادة","ما نشاهده وندركه"],["المراقبة","استحضار أن الله يرانا"],["الإحسان","أن تعبد الله كأنك تراه"]],
x:[["q","الغيب هو:",["ما غاب عن الحواس","ما نراه بأعيننا","ما نسمعه"],0,"راجع التعريف."],["vf","الكهان والمنجمون يعلمون الغيب.",false,"لا يعلم الغيب إلا الله."],["q","من مفاتح الغيب:",["علم الساعة","لون السماء","عدد أيام الأسبوع"],0,"خمسة في سورة لقمان."],["q","من آثار الإيمان بأن الله يعلم كل شيء:",["مراقبة الله في السر والعلن","الكذب عند غياب الناس"],0,"الله يرانا دائما."],["m","اربط.",[["الغيب","ما لا ندركه بالحواس"],["الشهادة","ما نشاهده"],["الإحسان","أن تعبد الله كأنك تراه"]],"راجع الكلمات."]],
d:[["عالم الغيب وعالم الشهادة","العالم الذي نعيش فيه قسمان: عالم الشهادة الذي نراه ونسمعه ونلمسه، وعالم الغيب الذي لا ندركه بحواسنا، مثل الملائكة والجنة والنار وما سيحدث في المستقبل. والله وحده يعلم الغيب كله."],["مفاتح الغيب","أخبرنا القرآن في آخر سورة لقمان بخمسة أمور اختص الله بعلمها: وقت قيام الساعة، ونزول المطر بدقة، وما في الأرحام، وما يكسبه الإنسان غدا، والأرض التي يموت فيها."],["الآثار في سلوك المسلم","من آمن أن الله يعلم سره وعلانيته يراقبه في كل عمل، فلا يغش في الامتحان ولو لم يره أحد، ويحسن عمله، ولا يصدق من يدعي معرفة الغيب."]],

{t:"الهجرة إلى الحبشة وبيعتا العقبة (الاقتداء)",
k:["اشتد أذى قريش على المسلمين، فأذن لهم النبي ﷺ بالهجرة إلى الحبشة في السنة الخامسة من البعثة.","كان ملك الحبشة النجاشي ملكا عادلا لا يُظلم عنده أحد.","تكلم جعفر بن أبي طالب أمام النجاشي فعرّف بالإسلام، فأمّن المسلمين.","بيعة العقبة الأولى: بايع فيها 12 رجلا من أهل يثرب النبي ﷺ، وأرسل معهم مصعب بن عمير يعلمهم.","بيعة العقبة الثانية: بايع فيها 73 رجلا وامرأتان، على نصرة النبي ﷺ، فمهدت للهجرة إلى المدينة."],
w:[["الهجرة","الانتقال من بلد إلى آخر"],["البيعة","العهد على الطاعة والنصرة"],["النجاشي","ملك الحبشة العادل"],["يثرب","الاسم القديم للمدينة المنورة"]],

d:[["أسباب الهجرة إلى الحبشة","لما اشتد تعذيب قريش للمسلمين الضعفاء، أذن لهم النبي ﷺ بالهجرة إلى الحبشة، لأن ملكها النجاشي كان عادلا. فهاجروا حفاظا على دينهم وأنفسهم."],["موقف النجاشي","أرسلت قريش من يطلب إرجاع المسلمين، فاستمع النجاشي إلى جعفر بن أبي طالب وهو يشرح الإسلام ويقرأ من القرآن، فرفض تسليمهم وأمّنهم."],["بيعتا العقبة","في موسم الحج، التقى النبي ﷺ بأهل يثرب. في البيعة الأولى بايعه 12 رجلا على الإيمان والأخلاق، فأرسل معهم مصعب بن عمير. وفي العام التالي بايعه 73 رجلا وامرأتان على نصرته وحمايته، فكانت الطريق إلى الهجرة."],["الاقتداء","نتعلم الصبر على الأذى، والبحث عن مكان آمن لحفظ الدين، والوفاء بالعهد كما وفى الأنصار ببيعتهم."]],

{t:"العبادة غاية الخلق: شمول العبادة لمناحي الحياة (الاستجابة)",

w:[["حدود الله","أوامر الله ونواهيه"],["الشعائر","علامات الدين الظاهرة"],["التعظيم","الاحترام والإجلال"],["التقوى","امتثال أوامر الله واجتناب نواهيه"]],

d:[["حق الله على عباده","أعظم الحقوق حق الله تعالى، وهو أن يُعبد وحده ولا يُشرك به شيء، وأن تُحترم أوامره ونواهيه."],["تعظيم حدود الله","حدود الله ما شرعه من حلال وحرام. والمسلم يعظمها فيفعل ما أمر الله به، ويجتنب ما نهى عنه، ولا يستهين بالمعاصي."],["تعظيم الشعائر","الشعائر علامات الدين الظاهرة: الصلاة، والأذان، والمساجد، والمصحف، والحج، والأعياد. تعظيمها يكون باحترامها والمحافظة عليها، وهو علامة على تقوى القلب."]],

d:[["معنى الحديث","المؤمن القوي في إيمانه وعلمه وجسمه وإرادته أنفع لنفسه ولمجتمعه، لذلك هو أحب إلى الله. وفي المؤمن الضعيف أيضا خير، لكن القوي أقدر على العمل والعطاء."],["المسؤولية","كل إنسان مسؤول عن شيء: عن نفسه، وأسرته، ودراسته، وعمله، والأشياء التي بين يديه. والمسؤول يقوم بواجبه ولا يلقي اللوم على غيره."],["كيف أكون مسؤولا؟","أنجز واجباتي في وقتها، أعترف بخطئي وأصلحه، أحافظ على الممتلكات العامة، وأساعد غيري."]],
wx:[["كسرت كأسا في البيت دون قصد. ما التصرف المسؤول؟",["أعترف بما فعلت ولا أكذب.","أعتذر وأنظف المكان بحذر.","هذا هو تحمل المسؤولية."]]]},

{s:"الأسدوس الأول — المرحلة 2",t:"سورة النجم: الآيات 19 إلى 31 (التزكية)",
k:["تنتقد الآيات عبادة المشركين للأصنام: اللات والعزى ومناة.","هذه الأصنام أسماء سماها المشركون، ولا تملك نفعا ولا ضرا.","المشركون يتبعون الظن وما تهوى الأنفس، والظن لا يغني من الحق شيئا.","الشفاعة لا تكون إلا بإذن الله ورضاه.","الله يجزي كل إنسان بعمله: المسيء بإساءته، والمحسن بإحسانه."],
w:[["اللات والعزى ومناة","أصنام كان يعبدها المشركون"],["الظن","ما ليس عليه دليل يقيني"],["الشفاعة","طلب الخير للغير يوم القيامة"],["الجزاء","الثواب أو العقاب"]],
x:[["q","اللات والعزى ومناة:",["أصنام","ملائكة","أنبياء"],0,"كان يعبدها المشركون."],["vf","الظن لا يغني من الحق شيئا.",true,"الحق يحتاج إلى يقين ودليل."],["q","الشفاعة يوم القيامة تكون:",["بإذن الله","بإذن الأصنام","لكل الناس دون شرط"],0,"لا تكون إلا بإذنه ورضاه."],["q","يجزي الله المحسن:",["بالحسنى","بالعقاب"],0,"كل إنسان بعمله."]],
d:[["إبطال عبادة الأصنام","تسأل الآيات المشركين عن أصنامهم: اللات والعزى ومناة، وتبين أنها مجرد أسماء اخترعوها هم وآباؤهم، ولا تملك شيئا."],["خطر اتباع الظن والهوى","المشركون لم يعتمدوا على دليل، بل على الظن وهوى النفس. والقرآن يعلمنا أن نبني اعتقادنا على العلم واليقين."],["العدل الإلهي","الله يعلم من ضل ومن اهتدى، ويجزي كل إنسان بما عمل، ولا تنفع الشفاعة إلا لمن أذن الله له."]],
wx:[["سمعت خبرا لا دليل عليه. ماذا نتعلم من الآيات؟",["لا أعتمد على الظن.","أتحقق من الخبر قبل تصديقه.","لأن الظن لا يغني من الحق شيئا."]]]},
{t:"الوحي: تعريفه وأنواعه",
k:["الوحي لغة: الإعلام الخفي السريع.","الوحي شرعا: إعلام الله أنبياءه بما يريد من الشرع.","من كيفيات الوحي: الرؤيا الصادقة في المنام.","ومنها: الإلقاء في القلب، والكلام من وراء حجاب (كما كلم الله موسى عليه السلام).","ومنها: الوحي بواسطة الملك جبريل عليه السلام، يأتي أحيانا في صورة رجل، وأحيانا مثل صلصلة الجرس."],
w:[["الوحي","إعلام الله أنبياءه بالشرع"],["الرؤيا الصادقة","ما يراه النبي في منامه ويقع كما رآه"],["من وراء حجاب","كلام الله لنبيه دون أن يراه"],["جبريل","الملك المكلف بالوحي"]],
x:[["q","الملك المكلف بالوحي:",["جبريل","ميكائيل","إسرافيل"],0,"أمين الوحي."],["q","كلم الله موسى عليه السلام:",["من وراء حجاب","بالرؤيا فقط"],0,"وكلم الله موسى تكليما."],["vf","الرؤيا الصادقة من كيفيات الوحي.",true,"وكانت بداية الوحي للنبي ﷺ."],["m","اربط.",[["الوحي لغة","الإعلام الخفي السريع"],["الوحي شرعا","إعلام الله أنبياءه بالشرع"]],"تعريفان."],["o","رتب بداية نزول الوحي على النبي ﷺ.",["الرؤيا الصادقة","التعبد في غار حراء","نزول جبريل بأول آيات سورة العلق"],"البداية بالرؤيا."]],
d:[["تعريف الوحي","الوحي في اللغة إعلام في خفاء وسرعة. وفي الشرع: إعلام الله تعالى من اختاره من الأنبياء بما يريد تبليغه من الهداية والشرائع."],["كيفيات الوحي","الرؤيا الصادقة في المنام، والإلقاء في القلب، وتكليم الله من وراء حجاب، وإرسال الملك جبريل عليه السلام، الذي كان يأتي النبي ﷺ أحيانا في صورة رجل، وأحيانا في صوت مثل صلصلة الجرس، وهو أشده عليه."],["أهمية الوحي","الوحي مصدر العقيدة والشريعة، به نعرف الله وما يحبه، وبه نعرف الغيب الذي لا يدركه العقل وحده."]],
wx:[["كيف بدأ الوحي للنبي ﷺ؟",["بدأ بالرؤيا الصادقة.","ثم حُبب إليه التعبد في غار حراء.","ثم نزل جبريل بأول ما نزل من القرآن: «اقرأ»."]]]},
{t:"حصار الدعوة وثبات أهلها (الاقتداء)",
k:["لما فشلت قريش في إيقاف الدعوة، قررت مقاطعة بني هاشم وبني المطلب.","كتبوا صحيفة المقاطعة وعلقوها في الكعبة: لا بيع ولا شراء ولا زواج معهم.","حوصر المسلمون في شعب أبي طالب نحو ثلاث سنوات، وعانوا الجوع.","انتهى الحصار بعد أن أكلت الأرضة الصحيفة، وتحرك بعض العقلاء من قريش.","ثبت النبي ﷺ والمؤمنون، فنتعلم الصبر والثبات على الحق."],
w:[["الحصار","منع الناس من الخروج أو التعامل"],["المقاطعة","قطع التعامل"],["الشعب","الطريق بين جبلين"],["الثبات","البقاء على الحق رغم الصعاب"]],
x:[["q","حوصر المسلمون في:",["شعب أبي طالب","غار حراء","المدينة"],0,"راجع الملخص."],["q","مدة الحصار تقريبا:",["ثلاث سنوات","ثلاثة أيام","عشر سنوات"],0,"حوالي 3 سنوات."],["vf","علقت قريش صحيفة المقاطعة في الكعبة.",true,"ليلتزم بها الجميع."],["q","من دروس الحصار:",["الصبر والثبات على الحق","التخلي عن المبادئ"],0,"ثبت المؤمنون."]],
d:[["سبب الحصار","لما رأت قريش أن الإسلام ينتشر رغم التعذيب، وأن بني هاشم يحمون النبي ﷺ، قررت مقاطعتهم اقتصاديا واجتماعيا."],["معاناة المحاصرين","عاش النبي ﷺ والمسلمون وبنو هاشم في شعب أبي طالب نحو ثلاث سنوات، قل فيها الطعام حتى أكلوا أوراق الشجر، وكان يُسمع بكاء الأطفال من الجوع."],["نهاية الحصار والعبرة","انتهى الحصار حين أكلت الأرضة صحيفة المقاطعة، وقام رجال من قريش بنقضها. ونتعلم أن الصبر والثبات يؤديان إلى الفرج، وأن التضامن قوة."]],
wx:[["ما العلاقة بين الصبر والفرج في قصة الحصار؟",["صبر المؤمنون ثلاث سنوات على الجوع.","ثم انتهى الحصار.","فالصبر على الحق يأتي بعده الفرج."]]]},
{t:"الصيام: أحكامه ومقاصده (الأركان، الشروط، الأعذار)",
k:["الصيام: الإمساك عن المفطرات من طلوع الفجر إلى غروب الشمس، بنية.","صيام رمضان ركن من أركان الإسلام.","ركنا الصيام: النية، والإمساك عن المفطرات.","من شروط وجوبه: الإسلام، والبلوغ، والعقل، والقدرة.","من الأعذار المبيحة للإفطار: المرض، والسفر، والحمل والرضاع، والعجز بسبب الكبر.","من مقاصده: تحقيق التقوى، وتقوية الإرادة، والإحساس بالفقراء."],
w:[["الإمساك","الامتناع عن المفطرات"],["النية","عزم القلب على الصيام"],["المفطرات","ما يفسد الصيام كالأكل والشرب"],["العذر","سبب يبيح الإفطار"]],
x:[["q","يبدأ الصيام من:",["طلوع الفجر","طلوع الشمس","الظهر"],0,"وينتهي بغروب الشمس."],["q","من ركني الصيام:",["النية","السحور"],0,"النية والإمساك."],["q","من الأعذار المبيحة للإفطار:",["السفر","الامتحان","التعب الخفيف"],0,"المرض والسفر..."],["vf","صيام رمضان ركن من أركان الإسلام.",true,"الركن الرابع."],["q","من مقاصد الصيام:",["تحقيق التقوى","الإكثار من النوم"],0,"لعلكم تتقون."]],
d:[["تعريف الصيام وحكمه","الصيام عبادة يمسك فيها المسلم عن الأكل والشرب وسائر المفطرات من طلوع الفجر إلى غروب الشمس بنية التقرب إلى الله. وصيام شهر رمضان فرض على كل مسلم بالغ عاقل قادر."],["الأركان والشروط","ركناه: النية (وتكون قبل الفجر)، والإمساك عن المفطرات. ومن شروط وجوبه: الإسلام، والبلوغ، والعقل، والقدرة على الصيام."],["الأعذار","رخص الله لأصحاب الأعذار في الإفطار: المريض، والمسافر، والحامل والمرضع إذا خافتا، والشيخ الكبير العاجز. وتفطر الحائض والنفساء وجوبا. وكلهم يقضون بعد زوال العذر، إلا العاجز الدائم فيطعم."],["مقاصده","تحقيق التقوى، وتربية الإرادة والصبر، والإحساس بالجائع والمحتاج، والتعاون والتراحم."]],
wx:[["مسافر في رمضان أفطر. ماذا عليه؟",["السفر عذر يبيح الإفطار.","لا إثم عليه.","وعليه قضاء الأيام التي أفطرها بعد رمضان."]]]},
{t:"حق النفس: اجتناب الكبائر والموبقات (القسط)",
k:["الكبائر: الذنوب العظيمة التي توعد الله عليها بعقاب شديد.","الموبقات: المهلكات. قال النبي ﷺ: «اجتنبوا السبع الموبقات».","هي: الشرك بالله، والسحر، وقتل النفس بغير حق، وأكل الربا، وأكل مال اليتيم، والتولي يوم الزحف، وقذف المحصنات.","من حق النفس على صاحبها أن يحميها من الهلاك في الدنيا والآخرة.","طريق السلامة: التوبة، والصحبة الصالحة، وتجنب أسباب المعاصي."],
w:[["الكبائر","الذنوب العظيمة"],["الموبقات","المهلكات"],["الربا","الزيادة المحرمة في المال"],["التوبة","الرجوع إلى الله بعد الذنب"]],
x:[["q","الموبقات معناها:",["المهلكات","الصغائر","الطاعات"],0,"تهلك صاحبها."],["q","من السبع الموبقات:",["أكل مال اليتيم","الصيام","الصدقة"],0,"راجع الحديث."],["vf","التوبة تفتح باب السلامة من الذنوب.",true,"الله يقبل توبة التائبين."],["q","من حق النفس:",["حمايتها مما يهلكها","تعريضها للخطر"],0,"المحافظة على النفس."]],
d:[["حق النفس","نفسك أمانة عندك، ومن حقها عليك أن تحفظها وتبعدها عما يهلكها في الدنيا والآخرة، ومن أعظم ذلك اجتناب الكبائر."],["السبع الموبقات","ذكر النبي ﷺ سبعا من أخطر الكبائر: الشرك بالله، والسحر، وقتل النفس التي حرم الله إلا بالحق، وأكل الربا، وأكل مال اليتيم، والفرار من المعركة، واتهام النساء العفيفات بالباطل."],["كيف أحمي نفسي؟","أتعلم الحلال والحرام، أختار الأصدقاء الصالحين، أبتعد عن أسباب المعاصي، وإذا أخطأت أتوب بسرعة وأصلح."]],
wx:[["لماذا كان أكل مال اليتيم من الموبقات؟",["اليتيم ضعيف فقد من يحميه.","أكل ماله ظلم كبير له.","فشدد الإسلام في تحريمه حماية للضعفاء."]]]},
{t:"اتقاء الشبهات: الحلال بين والحرام بين (الحكمة)",
k:["قال النبي ﷺ: «الحلال بين والحرام بين، وبينهما أمور مشتبهات لا يعلمهن كثير من الناس».","الحلال البين: ما ظهر حله، كأكل الطيبات.","الحرام البين: ما ظهرت حرمته، كالسرقة والكذب.","المشتبهات: أمور غير واضحة، لا يُعرف هل هي حلال أم حرام.","«فمن اتقى الشبهات فقد استبرأ لدينه وعرضه»."],
w:[["الحلال","ما أباحه الله"],["الحرام","ما نهى الله عنه"],["المشتبهات","أمور غير واضحة الحكم"],["استبرأ","حفظ وطهر"]],
x:[["q","المشتبهات هي:",["أمور غير واضحة الحكم","الحلال الواضح","الحرام الواضح"],0,"لا يعلمهن كثير من الناس."],["q","من الحرام البين:",["السرقة","شرب الماء"],0,"ظاهر التحريم."],["vf","من اتقى الشبهات حفظ دينه وعرضه.",true,"نص الحديث."],["q","إذا شككت في أمر هل هو حلال أم حرام:",["أتركه أو أسأل العلماء","أفعله بدون تفكير"],0,"اتقاء الشبهات."],["m","اربط.",[["الحلال البين","أكل الطيبات"],["الحرام البين","الغش"],["المشتبه","أمر لم يتضح حكمه"]],"ثلاثة أقسام."]],
d:[["أقسام الأمور","يقسم الحديث الأمور إلى ثلاثة: حلال واضح لا شك فيه، وحرام واضح لا شك فيه، وأمور مشتبهة بينهما لا يعرف حكمها كثير من الناس."],["موقف المسلم من الشبهات","المسلم الحريص يترك ما يشك فيه، أو يسأل أهل العلم، حتى يحفظ دينه وسمعته. ومن تهاون في الشبهات يوشك أن يقع في الحرام."],["القلب","ختم النبي ﷺ الحديث بأن في الجسد مضغة إذا صلحت صلح الجسد كله، وهي القلب. فصلاح القلب أساس صلاح الأعمال."]],
wx:[["وجدت مالا في الطريق ولا تعرف صاحبه. هل تأخذه لنفسك؟",["المال ليس لي، وأخذه قد يكون حراما.","أتجنب الشبهة ولا آخذه لنفسي.","أسلمه لمن يبحث عن صاحبه، أو أسأل أهل العلم."]]]},
{t:"سورة النجم: الآيات 32 إلى 61 (التزكية)",
k:["المحسنون هم الذين يجتنبون كبائر الإثم والفواحش إلا اللمم.","﴿فلا تزكوا أنفسكم هو أعلم بمن اتقى﴾: لا نمدح أنفسنا ولا نغتر بأعمالنا.","لا يحمل إنسان ذنب غيره: ﴿ألا تزر وازرة وزر أخرى﴾.","﴿وأن ليس للإنسان إلا ما سعى﴾: كل إنسان يُجزى بعمله وسعيه.","تذكر الآيات قدرة الله: يضحك ويبكي، ويميت ويحيي، وخلق الزوجين الذكر والأنثى."],
w:[["اللمم","صغائر الذنوب"],["لا تزكوا أنفسكم","لا تمدحوا أنفسكم"],["لا تزر وازرة","لا تحمل نفس ذنب غيرها"],["السعي","العمل والجهد"]],
x:[["q","معنى «ألا تزر وازرة وزر أخرى»:",["لا يحمل أحد ذنب غيره","يحمل الأب ذنب ابنه"],0,"المسؤولية فردية."],["q","«وأن ليس للإنسان إلا ما سعى» تحث على:",["العمل والاجتهاد","الكسل"],0,"كل إنسان بعمله."],["vf","الآيات تنهى عن مدح النفس والاغترار بها.",true,"فلا تزكوا أنفسكم."],["q","اللمم:",["صغائر الذنوب","كبائر الذنوب"],0,"راجع الكلمات."]],
d:[["صفات المحسنين","تصف الآيات المحسنين بأنهم يجتنبون كبائر الذنوب والفواحش، وإذا وقعوا في صغيرة تابوا، والله واسع المغفرة."],["التواضع","ينهانا الله عن مدح أنفسنا والإعجاب بأعمالنا، لأنه وحده يعلم من هو التقي حقا."],["المسؤولية الفردية والعمل","كل إنسان مسؤول عن عمله، لا يحمل ذنب غيره، وسيجد جزاء سعيه. وهذا يدفعنا إلى الاجتهاد في الخير."],["قدرة الله","تختم السورة بذكر مظاهر قدرة الله في الحياة والموت والخلق، وتدعو إلى السجود لله وعبادته."]],
wx:[["كيف نطبق «وأن ليس للإنسان إلا ما سعى» في الدراسة؟",["النجاح يأتي بالعمل والمراجعة.","لا ينفعني اجتهاد غيري إذا لم أجتهد.","فأنظم وقتي وأراجع بانتظام."]]]},

{s:"الأسدوس الثاني — المرحلة 3",t:"سورة الحجرات: الآيات 1 إلى 5 (التزكية)",
k:["سورة الحجرات سورة مدنية، تسمى سورة الأخلاق والآداب.","الأدب مع الله ورسوله: لا نقدم رأينا على حكم الله ورسوله ﷺ.","النهي عن رفع الصوت فوق صوت النبي ﷺ، وعن الجهر له بالقول.","الذين يغضون أصواتهم عند رسول الله أولئك امتحن الله قلوبهم للتقوى.","تعلمنا السورة أدب الحديث والاحترام وخفض الصوت."],
w:[["لا تقدموا","لا تسبقوا بقول أو فعل"],["يغضون أصواتهم","يخفضونها"],["امتحن الله قلوبهم","طهرها وأخلصها للتقوى"],["الحجرات","بيوت زوجات النبي ﷺ"]],
x:[["q","سورة الحجرات سورة:",["مدنية","مكية"],0,"نزلت في المدينة."],["q","تسمى سورة الحجرات سورة:",["الأخلاق والآداب","القصص"],0,"لكثرة الآداب فيها."],["vf","تنهى الآيات عن رفع الصوت فوق صوت النبي ﷺ.",true,"أدب مع الرسول ﷺ."],["q","من الأدب مع الوالدين والمعلم أخذا من الآيات:",["خفض الصوت عند الحديث معهم","مقاطعتهم بصوت مرتفع"],0,"قياسا على الأدب مع النبي ﷺ."]],
d:[["التعريف بالسورة","سورة الحجرات مدنية، سميت بهذا الاسم لذكر حجرات النبي ﷺ فيها، أي بيوت زوجاته. وتسمى سورة الآداب لأنها تعلم المسلمين آداب التعامل."],["الأدب مع الله ورسوله","تنهى الآيات الأولى المؤمنين عن التقدم بين يدي الله ورسوله، أي لا يقطعون أمرا قبل أن يعرفوا حكم الله ورسوله ﷺ."],["أدب الكلام","تنهى عن رفع الصوت عند النبي ﷺ ومناداته من وراء الحجرات بصوت عال، وتمدح الذين يخفضون أصواتهم. ونتعلم منها خفض الصوت مع الكبار واحترامهم."]],
wx:[["كيف تطبق أدب الحجرات في القسم؟",["أرفع يدي قبل الكلام.","لا أرفع صوتي على المعلم ولا أقاطعه.","أستمع باحترام."]]]},
{t:"الأنبياء والرسل ورسالاتهم: التعريف والصفات",
k:["النبي: من أوحى الله إليه بشرع.","الرسول: من أوحى الله إليه بشرع وأمره بتبليغه للناس. فكل رسول نبي.","ذكر القرآن 25 نبيا ورسولا بأسمائهم.","أولو العزم من الرسل خمسة: نوح، وإبراهيم، وموسى، وعيسى، ومحمد عليهم الصلاة والسلام.","صفاتهم: الصدق، والأمانة، والتبليغ، والفطانة.","رسالتهم واحدة: الدعوة إلى توحيد الله وعبادته، ومحمد ﷺ خاتم الأنبياء."],
w:[["الرسول","من أوحي إليه بشرع وأمر بتبليغه"],["أولو العزم","أصحاب الصبر والعزيمة من الرسل"],["الفطانة","الذكاء وحسن الفهم"],["خاتم الأنبياء","آخرهم"]],
x:[["q","عدد الأنبياء المذكورين بأسمائهم في القرآن:",["25","10","50"],0,"راجع الملخص."],["q","من أولي العزم:",["إبراهيم","يوسف","يونس"],0,"خمسة رسل."],["m","اربط كل صفة بمعناها.",[["الصدق","قول الحق"],["الأمانة","حفظ ما ائتمنهم الله عليه"],["الفطانة","الذكاء"]],"صفات الرسل."],["vf","محمد ﷺ خاتم الأنبياء.",true,"لا نبي بعده."],["q","رسالة جميع الأنبياء:",["توحيد الله وعبادته","جمع المال"],0,"دعوة واحدة."]],
d:[["الفرق بين النبي والرسول","النبي من أوحى الله إليه بشرع، والرسول من أوحى إليه بشرع وأمر بتبليغه. فكل رسول نبي، وليس كل نبي رسولا."],["صفاتهم","اختار الله الأنبياء من خيرة الناس، وأيدهم بصفات: الصدق في أقوالهم، والأمانة في أعمالهم، وتبليغ كل ما أُمروا به، والفطانة أي الذكاء وقوة الحجة."],["وحدة الرسالة","جاء الأنبياء جميعا بدعوة واحدة: توحيد الله وعبادته ومكارم الأخلاق، وإن اختلفت بعض الشرائع. ونؤمن بهم جميعا، وخاتمهم محمد ﷺ."]],
wx:[["لماذا كانت الأمانة صفة ضرورية في الرسول؟",["لأنه مؤتمن على رسالة الله.","فلا يزيد فيها ولا ينقص.","وبذلك يثق الناس فيما يبلغه."]]]},
{t:"الرسول ﷺ يناجي ربه: الطائف والإسراء والمعراج (الاقتداء)",
k:["بعد وفاة أبي طالب وخديجة رضي الله عنها (عام الحزن)، خرج النبي ﷺ إلى الطائف مع زيد بن حارثة.","رده أهل الطائف وأغروا به صبيانهم فرموه بالحجارة.","دعا ربه بدعاء مؤثر يبدأ بـ: «اللهم إليك أشكو ضعف قوتي وقلة حيلتي وهواني على الناس».","رفض أن يُهلك أهل الطائف، وقال: «بل أرجو أن يخرج الله من أصلابهم من يعبد الله وحده».","الإسراء: من المسجد الحرام إلى المسجد الأقصى. المعراج: الصعود إلى السماوات العلا، وفيه فُرضت الصلوات الخمس."],
w:[["المناجاة","دعاء الله بخشوع"],["الإسراء","السير ليلا من المسجد الحرام إلى المسجد الأقصى"],["المعراج","الصعود إلى السماوات"],["عام الحزن","عام وفاة أبي طالب وخديجة"]],
x:[["q","رافق النبي ﷺ إلى الطائف:",["زيد بن حارثة","أبو بكر","علي"],0,"راجع الملخص."],["q","الإسراء كان من المسجد الحرام إلى:",["المسجد الأقصى","المسجد النبوي","الطائف"],0,"سبحان الذي أسرى بعبده..."],["q","فرضت في المعراج:",["الصلوات الخمس","الزكاة","الحج"],0,"فرضت في السماء."],["vf","دعا النبي ﷺ على أهل الطائف بالهلاك.",false,"رجا أن يخرج منهم من يعبد الله."],["o","رتب الأحداث.",["عام الحزن","رحلة الطائف","الإسراء والمعراج"],"الحزن ثم الطائف ثم التكريم."]],
d:[["رحلة الطائف","بعد وفاة عمه أبي طالب وزوجته خديجة، اشتد أذى قريش، فخرج النبي ﷺ إلى الطائف يدعو أهلها، لكنهم ردوه بقسوة ورموه بالحجارة حتى سالت قدماه دما."],["المناجاة والرحمة","لجأ النبي ﷺ إلى ربه بدعاء خاشع يشكو فيه ضعفه، ولما عرض عليه ملك الجبال أن يهلكهم، رفض رحمة بهم ورجاء أن يؤمن أبناؤهم."],["الإسراء والمعراج","أكرم الله نبيه بعد هذه المحن برحلة الإسراء من المسجد الحرام إلى المسجد الأقصى، ثم المعراج إلى السماوات العلا، وفيها فرضت الصلوات الخمس."],["الاقتداء","نتعلم اللجوء إلى الله بالدعاء عند الشدة، والرحمة بالناس حتى بمن أساء إلينا، وأن بعد العسر يسرا."]],
wx:[["ما الذي نتعلمه من رفض النبي ﷺ إهلاك أهل الطائف؟",["الرحمة حتى بمن أساء إلينا.","الأمل في هداية الناس.","والصبر على الأذى في سبيل الخير."]]]},
{t:"الصيام: القضاء والكفارة وصيام التطوع (الاستجابة)",
k:["القضاء: صيام أيام بدل الأيام التي أفطرها المسلم في رمضان.","يجب القضاء على من أفطر لعذر كالمرض والسفر، بعد زوال العذر.","الكفارة: على من أفطر في رمضان عمدا بدون عذر، مع القضاء.","خصال الكفارة: إطعام ستين مسكينا، أو صيام شهرين متتابعين، أو عتق رقبة.","صيام التطوع: ستة أيام من شوال، ويوم عرفة لغير الحاج، ويوم عاشوراء، والاثنين والخميس.","يحرم صيام يومي العيد."],
w:[["القضاء","صيام الأيام الفائتة"],["الكفارة","عقوبة تكفر الذنب"],["التطوع","العبادة غير الواجبة"],["متتابعين","بدون انقطاع"]],
x:[["q","من أفطر يوما في رمضان لمرض:",["يقضيه","لا شيء عليه","يصوم شهرين"],0,"القضاء بعد الشفاء."],["q","الكفارة تكون على من أفطر:",["عمدا بدون عذر","لمرض","لسفر"],0,"مع القضاء."],["q","من صيام التطوع:",["يوم عرفة لغير الحاج","يوم عيد الفطر"],0,"يوم العيد يحرم صيامه."],["vf","يحرم صيام يوم العيد.",true,"يوما الفطر والأضحى."],["m","اربط.",[["القضاء","صيام الأيام الفائتة"],["الكفارة","إطعام ستين مسكينا مثلا"],["التطوع","صيام الاثنين والخميس"]],"ثلاثة أحكام."]],
d:[["القضاء","من أفطر في رمضان لعذر مقبول، كالمرض أو السفر أو الحيض، يجب عليه أن يقضي عدد الأيام التي أفطرها، قبل رمضان الموالي."],["الكفارة","من أفطر في رمضان عمدا دون عذر، فقد ارتكب ذنبا كبيرا، وعليه التوبة والقضاء والكفارة: إطعام ستين مسكينا، أو صيام شهرين متتابعين، أو عتق رقبة. والإطعام هو الأفضل في المذهب المالكي."],["صيام التطوع","هو صيام غير واجب يتقرب به المسلم إلى الله: ستة أيام من شوال، ويوم عرفة، ويوم عاشوراء، والاثنين والخميس، وثلاثة أيام من كل شهر. ويحرم صوم يومي العيد."]],
wx:[["مرضت ثلاثة أيام في رمضان فأفطرتها. ماذا علي؟",["المرض عذر يبيح الإفطار، فلا كفارة.","علي قضاء ثلاثة أيام بعد الشفاء.","وقبل رمضان المقبل."]]]},
{t:"حق الغير: حقوق الأخوة الإيمانية (القسط)",
k:["﴿إنما المؤمنون إخوة﴾ (الحجرات 10).","قال النبي ﷺ: «حق المسلم على المسلم ست».","هي: إذا لقيته فسلم عليه، وإذا دعاك فأجبه، وإذا استنصحك فانصح له، وإذا عطس فحمد الله فشمته، وإذا مرض فعده، وإذا مات فاتبعه.","من حقوق الأخوة أيضا: المحبة، والتعاون، والإصلاح بين المتخاصمين.","«لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه»."],
w:[["الأخوة الإيمانية","رابطة تجمع المؤمنين"],["عيادة المريض","زيارته"],["التشميت","قول يرحمك الله للعاطس"],["الإصلاح","التوفيق بين المتخاصمين"]],
x:[["q","من حقوق المسلم على المسلم:",["عيادته إذا مرض","هجره"],0,"الحديث الشريف."],["q","إذا عطس أخوك فقال الحمد لله، تقول:",["يرحمك الله","مع السلامة"],0,"التشميت."],["vf","«إنما المؤمنون إخوة».",true,"الحجرات 10."],["o","رتب الحديث.",["لا يؤمن أحدكم","حتى يحب لأخيه","ما يحب لنفسه"],"حديث شريف."],["q","إذا تخاصم صديقان:",["أصلح بينهما","أزيد الخلاف"],0,"الإصلاح من حقوق الأخوة."]],
d:[["الأخوة الإيمانية","جعل الإسلام المؤمنين إخوة، تجمعهم رابطة الإيمان مهما اختلفت ألوانهم وبلدانهم، ولهذه الأخوة حقوق."],["الحقوق الست","ذكر النبي ﷺ ستة حقوق: إلقاء السلام، وإجابة الدعوة، والنصيحة، وتشميت العاطس، وعيادة المريض، واتباع الجنازة."],["حقوق أخرى","المحبة، وأن تحب لأخيك ما تحب لنفسك، والتعاون على الخير، والإصلاح بين المتخاصمين، وستر العيوب، وعدم الظلم."]],
wx:[["زميلك في القسم مريض منذ أيام. ماذا تفعل؟",["أزوره أو أتصل به لأطمئن عليه.","أدعو له بالشفاء.","وأساعده في نقل الدروس التي فاتته."]]]},
{t:"الأخوة الإنسانية: حق غير المسلم على المسلم (الحكمة)",
k:["الناس جميعا من أصل واحد: آدم وحواء.","﴿يا أيها الناس إنا خلقناكم من ذكر وأنثى وجعلناكم شعوبا وقبائل لتعارفوا﴾ (الحجرات 13).","﴿لا إكراه في الدين﴾: لكل إنسان حرية معتقده.","﴿لا ينهاكم الله عن الذين لم يقاتلوكم في الدين ولم يخرجوكم من دياركم أن تبروهم وتقسطوا إليهم﴾ (الممتحنة 8).","من حقوق غير المسلم: العدل، وحسن المعاملة، وحفظ النفس والمال، والوفاء بالعهد معه."],
w:[["الأخوة الإنسانية","رابطة تجمع كل البشر"],["البر","الإحسان"],["القسط","العدل"],["لتعارفوا","ليعرف بعضكم بعضا ويتعاون"]],
x:[["q","أصل الناس جميعا:",["آدم وحواء","قبيلة واحدة"],0,"كلنا من أصل واحد."],["q","«لتعارفوا» معناها:",["ليعرف بعضكم بعضا ويتعاون","ليتخاصموا"],0,"الحجرات 13."],["vf","يجوز إكراه الناس على الدين.",false,"لا إكراه في الدين."],["q","من حقوق غير المسلم المسالم:",["العدل وحسن المعاملة","الظلم"],0,"أن تبروهم وتقسطوا إليهم."]],
d:[["وحدة الأصل الإنساني","يؤكد الإسلام أن البشر جميعا من أصل واحد، وأن اختلاف الشعوب والقبائل للتعارف والتعاون، لا للتفاخر والصراع. وأكرم الناس عند الله أتقاهم."],["حرية المعتقد","لا يُكره أحد على الدخول في الإسلام، فالإيمان يكون عن اقتناع."],["حقوق غير المسلم","للمسالم من غير المسلمين حق العدل، والبر والإحسان، وحماية نفسه وماله وعرضه، والوفاء بالعهود معه، وحسن الجوار. وقد عاش المسلمون وغيرهم في المغرب قرونا في تعايش."]],
wx:[["جارك ليس مسلما، وطلب مساعدتك. ماذا تفعل؟",["أساعده لأن الإسلام يأمر بالإحسان إلى الجار.","أعامله بالعدل والاحترام.","فأكون قدوة حسنة لديني."]]]},

{s:"الأسدوس الثاني — المرحلة 4",t:"سورة الحجرات: الآيات 6 إلى 13 (التزكية)",
k:["التثبت من الأخبار: ﴿إن جاءكم فاسق بنبإ فتبينوا﴾ (الآية 6).","الإصلاح بين المؤمنين إذا تخاصموا، و﴿إنما المؤمنون إخوة﴾ (الآية 10).","النهي عن السخرية واللمز والتنابز بالألقاب (الآية 11).","النهي عن كثير من الظن، وعن التجسس والغيبة (الآية 12).","الناس من أصل واحد، و﴿إن أكرمكم عند الله أتقاكم﴾ (الآية 13)."],
w:[["فتبينوا","تأكدوا من صحة الخبر"],["اللمز","العيب والطعن في الناس"],["التنابز بالألقاب","مناداة الناس بألقاب يكرهونها"],["الغيبة","ذكرك أخاك بما يكره في غيابه"],["التجسس","البحث عن عيوب الناس"]],
x:[["q","«فتبينوا» تعني:",["تأكدوا من الخبر","انشروا الخبر بسرعة"],0,"الآية 6."],["q","الغيبة هي:",["ذكرك أخاك بما يكره في غيابه","مدح الناس"],0,"راجع الكلمات."],["m","اربط كل خلق بالآية.",[["التثبت من الأخبار","الآية 6"],["الأخوة والإصلاح","الآية 10"],["النهي عن الغيبة","الآية 12"]],"راجع الملخص."],["vf","أكرم الناس عند الله أكثرهم مالا.",false,"إن أكرمكم عند الله أتقاكم."],["o","رتب الآية.",["إنما","المؤمنون","إخوة"],"الآية 10."]],
d:[["التثبت من الأخبار","تأمر الآيات بالتأكد من الأخبار قبل تصديقها ونشرها، حتى لا نظلم أحدا ونندم. وهذا مهم اليوم مع كثرة الأخبار على الهاتف والأنترنت."],["الأخوة والإصلاح","إذا تخاصمت طائفتان من المؤمنين وجب الإصلاح بينهما بالعدل، لأن المؤمنين إخوة."],["آداب اللسان","تنهى الآيات عن السخرية من الناس، وعن عيبهم ومناداتهم بألقاب سيئة، وعن سوء الظن والتجسس والغيبة، وتشبه الغيبة بأكل لحم الأخ الميت."],["المساواة والتقوى","الناس جميعا من ذكر وأنثى، جعلهم الله شعوبا وقبائل ليتعارفوا، وأكرمهم عند الله أتقاهم، لا أغناهم ولا أقواهم."]],
wx:[["وصلك على الهاتف خبر سيء عن زميل. ماذا تفعل حسب الآية 6؟",["لا أنشره قبل التأكد منه.","أتحقق من مصدره.","فإن كان كاذبا أكون قد حميت زميلي من الظلم."]]]},
{t:"صفات المؤمن الصادق",
k:["المؤمن الصادق آمن بالله ورسوله ولم يشك: ﴿إنما المؤمنون الذين آمنوا بالله ورسوله ثم لم يرتابوا﴾.","يجاهد بماله ونفسه في سبيل الله، أي يبذل في الخير.","صادق في أقواله، أمين في أعماله، وفي بالعهد.","يحب لغيره ما يحب لنفسه، ويحسن إلى الناس.","يصدق قوله فعله، فلا يكون منافقا."],
w:[["الصدق","مطابقة القول للحقيقة والفعل"],["لم يرتابوا","لم يشكوا"],["الوفاء","الالتزام بالعهد"],["النفاق","إظهار الخير وإخفاء الشر"]],

d:[["الإيمان الصادق","الإيمان الصادق يقين في القلب لا شك فيه، يظهر أثره في العمل. وقد وصف الله المؤمنين الصادقين بأنهم آمنوا ولم يرتابوا، وجاهدوا بأموالهم وأنفسهم."],["صفات في السلوك","المؤمن الصادق صادق في كلامه، أمين في عمله، يفي بوعده، يتقن عمله، يحب الخير للناس."],["عكس الصدق","النفاق: أن يظهر الإنسان الإيمان والخير ويخفي غيره. ومن علاماته الكذب وإخلاف الوعد وخيانة الأمانة."]],
wx:[["وعدت صديقك أن تساعده في المراجعة يوم السبت. كيف تكون صادقا؟",["أحضر في الموعد.","وإن طرأ عذر أخبره مسبقا.","فالوفاء بالوعد من صفات المؤمن الصادق."]]]},
{t:"تصديق الرسول ﷺ ونصرته: أبو بكر الصديق (الاقتداء)",
k:["أبو بكر الصديق أول من أسلم من الرجال، وصديق النبي ﷺ.","سمي الصديق لأنه صدّق النبي ﷺ في الإسراء دون تردد.","أنفق ماله في سبيل الله، واشترى عبيدا مسلمين يُعذبون فأعتقهم، منهم بلال.","رافق النبي ﷺ في الهجرة، واختبأ معه في غار ثور.","كان أول الخلفاء الراشدين بعد وفاة النبي ﷺ."],

x:[["q","سمي أبو بكر بالصديق لأنه:",["صدق النبي ﷺ في الإسراء","كان أكبر الصحابة"],0,"راجع الملخص."],["q","الصحابي الذي أعتقه أبو بكر:",["بلال بن رباح","زيد بن حارثة"],0,"كان يُعذب."],["q","اختبأ النبي ﷺ وأبو بكر في الهجرة في:",["غار ثور","غار حراء"],0,"حراء مكان نزول الوحي."],["vf","أبو بكر أول الخلفاء الراشدين.",true,"بعد وفاة النبي ﷺ."]],
d:[["إسلامه وتصديقه","كان أبو بكر صديق النبي ﷺ قبل البعثة، وأول من أسلم من الرجال. ولما أخبر النبي ﷺ بالإسراء وكذبه المشركون، قال أبو بكر: إن كان قاله فقد صدق، فسمي الصديق."],["نصرته للنبي ﷺ","أنفق ماله في الدعوة، وأعتق المستضعفين الذين يعذبون بسبب إسلامهم كبلال، ودعا إلى الإسلام فأسلم على يديه عدد من كبار الصحابة."],["في الهجرة والخلافة","صحب النبي ﷺ في الهجرة واختبأ معه في غار ثور، وبعد وفاة النبي ﷺ تولى الخلافة فحافظ على وحدة المسلمين."]],
wx:[["كيف نقتدي بأبي بكر الصديق اليوم؟",["نصدق النبي ﷺ ونتبع سنته.","نساعد المحتاجين بأموالنا ووقتنا.","نكون أوفياء لأصدقائنا في الشدة."]]]},
{t:"القرآن والصيام شفيعان (الاستجابة)",
k:["قال النبي ﷺ: «الصيام والقرآن يشفعان للعبد يوم القيامة».","يقول الصيام: منعته الطعام والشهوات بالنهار فشفعني فيه.","ويقول القرآن: منعته النوم بالليل فشفعني فيه، فيشفعان.","شهر رمضان شهر القرآن والصيام معا.","نتعلم المداومة على قراءة القرآن والصيام وإخلاص النية."],
w:[["الشفاعة","طلب الخير والمغفرة للغير"],["يشفعان","يطلبان المغفرة للعبد"],["الشهوات","ما تشتهيه النفس"],["قيام الليل","الصلاة وقراءة القرآن بالليل"]],
x:[["q","يشفع للعبد يوم القيامة:",["الصيام والقرآن","المال والأولاد"],0,"الحديث الشريف."],["q","يقول الصيام:",["منعته الطعام والشهوات بالنهار","منعته النوم بالليل"],0,"القرآن هو الذي منعه النوم."],["vf","رمضان شهر القرآن والصيام.",true,"فيه أنزل القرآن."],["m","اربط.",[["الصيام","منعه الطعام بالنهار"],["القرآن","منعه النوم بالليل"]],"كل واحد يشفع بما فعل العبد."]],
d:[["معنى الحديث","يخبرنا النبي ﷺ أن الصيام والقرآن يأتيان يوم القيامة ويطلبان من الله المغفرة للعبد الذي صام وقرأ القرآن بإخلاص، فيقبل الله شفاعتهما."],["العلاقة بين القرآن والصيام","أنزل القرآن في شهر رمضان، فهو شهر الصيام بالنهار وتلاوة القرآن والقيام بالليل."],["كيف أستفيد؟","أحافظ على صيام رمضان، وأقرأ ورقة من القرآن كل يوم، وأتدبر معانيه، وأخلص النية لله."]],
wx:[["ضع برنامجا بسيطا لقراءة القرآن في رمضان.",["أقرأ صفحتين بعد صلاة الفجر.","وصفحتين بعد صلاة العصر.","وأراجع ما حفظته قبل النوم."]]]},
{t:"حق البيئة: الإحسان إلى الحيوان والرفق به (القسط)",
k:["الإسلام يأمر بالإحسان إلى كل المخلوقات: «إن الله كتب الإحسان على كل شيء».","دخلت امرأة النار في هرة حبستها، فلا هي أطعمتها ولا تركتها تأكل.","غفر الله لرجل سقى كلبا عطشان.","من الرفق بالحيوان: إطعامه وسقيه، وعدم تحميله ما لا يطيق، وعدم تعذيبه.","عند الذبح: يحد السكين ويريح الذبيحة."],
w:[["الإحسان","فعل الخير بإتقان"],["الرفق","اللين وعدم العنف"],["الهرة","القطة"],["الذبيحة","الحيوان الذي يذبح"]],
x:[["q","دخلت امرأة النار بسبب:",["هرة حبستها","كلب سقته"],0,"عذبتها بالجوع."],["q","غفر الله لرجل لأنه:",["سقى كلبا عطشان","حبس قطة"],0,"إحسان إلى الحيوان."],["vf","يجوز تحميل الحيوان ما لا يطيق.",false,"الرفق بالحيوان واجب."],["q","من الإحسان عند الذبح:",["حد السكين وإراحة الذبيحة","تعذيبها"],0,"الحديث الشريف."]],
d:[["حق الحيوان","الحيوان مخلوق يحس ويتألم، وقد جعل الإسلام له حقوقا: الطعام والشراب، والراحة، وعدم التعذيب، والرحمة."],["قصتان من السنة","أخبر النبي ﷺ عن امرأة دخلت النار بسبب قطة حبستها حتى ماتت جوعا، وعن رجل غفر الله له لأنه سقى كلبا كاد يموت من العطش. فالرحمة بالحيوان سبب للمغفرة، والقسوة سبب للعقاب."],["الرفق في كل شيء","أمر النبي ﷺ بإحسان الذبح: حد السكين وإراحة الذبيحة. ويدخل في حق البيئة أيضا المحافظة على الماء والأشجار وعدم التلوث."]],
wx:[["رأيت أطفالا يرمون قطة بالحجارة. ماذا تفعل؟",["أنصحهم بلطف بالتوقف.","أذكرهم بقصة المرأة التي دخلت النار بسبب قطة.","وأعطي القطة ماء إن احتاجت."]]]},
{t:"حديث: «من يأخذ عني هؤلاء الكلمات» (الحكمة)",

w:[["المحارم","ما حرمه الله"],["القناعة","الرضا بما قسم الله"],["الجار","من يسكن قربك"],["تميت القلب","تجعله قاسيا غافلا"]],

d:[["طريقة التعليم","بدأ النبي ﷺ بسؤال يشوق الصحابة، ثم عدّ الوصايا على يد أبي هريرة خمسا، ليسهل حفظها والعمل بها وتعليمها."],["الوصايا الخمس","اجتناب ما حرم الله، والقناعة والرضا، والإحسان إلى الجار، وحب الخير للناس، والاعتدال في الضحك. وكل وصية لها ثمرة."],["العمل والتبليغ","الحديث يطلب أمرين: أن نعمل بهذه الوصايا، وأن نعلمها لغيرنا."]],

{t:"سورة الحجرات: الآيات 14 إلى 18 (التزكية)",
k:["﴿قالت الأعراب آمنا قل لم تؤمنوا ولكن قولوا أسلمنا﴾: الإيمان أعمق من مجرد القول.","الإسلام: الأعمال الظاهرة. الإيمان: التصديق في القلب.","الله لا ينقص من أجر من أطاعه شيئا.","المؤمنون الصادقون: آمنوا ولم يرتابوا، وجاهدوا بأموالهم وأنفسهم.","الهداية فضل من الله، فلا نمن على الله بإسلامنا.","الله يعلم غيب السماوات والأرض ويرى أعمالنا."],
w:[["الأعراب","سكان البادية"],["لم يرتابوا","لم يشكوا"],["يمنون","يعدون الشيء فضلا منهم"],["لا يلتكم","لا ينقصكم"]],

d:[["الإسلام والإيمان","جاء أعراب يقولون آمنا، فبين الله أن الإيمان لم يدخل قلوبهم بعد، وأن عليهم أن يقولوا أسلمنا. فالإسلام انقياد بالأعمال الظاهرة، والإيمان تصديق راسخ في القلب."],["صفات المؤمنين الصادقين","هم الذين آمنوا بالله ورسوله دون شك، وبذلوا أموالهم وأنفسهم في سبيل الله."],["فضل الله","الهداية نعمة من الله، فلا يمن الإنسان بإسلامه، بل يشكر الله عليه. والله يعلم الغيب ويرى كل ما نعمل."]],
