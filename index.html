<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2350a8"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>دفتر الثانية إعدادي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Alegreya+Sans:wght@400;500;700&family=STIX+Two+Text:wght@400;600&display=swap">
<style>
/* Layout : cahier Seyès calme — une colonne, un écran = une tâche, grandes cibles tactiles, aucune animation surprise */
:root{
  --paper:#f5f7fa; --sheet:#ffffff; --ink:#1c2a44; --soft:#58647a;
  --rule:#cfdaee; --rule-v:#e6d9ec; --margin:#c8513f; --accent:#2350a8; --on-accent:#ffffff;
  --ok:#1b7348; --ok-bg:#e2f3e9; --no:#9a4a12; --no-bg:#fbefe3; --hint:#6b5a12; --hint-bg:#fbf5dc;
  --line:#dde4ef; --chip:#edf1f8;
  --c1:#2350a8; --c2:#c8513f; --c3:#1b8a6b; --c4:#d19a1c; --fill-a:#d9e4f8; --fill-s:#eef2f8; --sky:#d6ebfb; --earth:#4f8a5b; --water:#cfe6f5; --rock:#c9b79a; --crust:#a5927a; --mantle:#e8a35c; --core:#d9722e; --icore:#f2c94c; --magma:#e0592f;
  --f-disp:"Reem Kufi","Noto Naskh Arabic",system-ui,sans-serif;
  --f-ar:"Noto Naskh Arabic","Alegreya Sans",system-ui,sans-serif;
  --f-lat:"Alegreya Sans","Noto Naskh Arabic",system-ui,sans-serif;
  --f-math:"STIX Two Text","Cambria Math",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1625; --sheet:#151e30; --ink:#e4eaf5; --soft:#9ba8bf;
  --rule:#233250; --rule-v:#2c2742; --margin:#e07a66; --accent:#86a9ff; --on-accent:#0f1625;
  --ok:#78d6a6; --ok-bg:#16301f; --no:#f0a86b; --no-bg:#35240f; --hint:#e6cf72; --hint-bg:#302810;
  --line:#26324a; --chip:#1c2740;  --c1:#86a9ff; --c2:#e07a66; --c3:#56c49e; --c4:#e8c862; --fill-a:#22355e; --fill-s:#1a2438; --sky:#1d3550; --earth:#3f7a4d; --water:#1d3a52; --rock:#6b5d48; --crust:#5a4c3a; --mantle:#9a6232; --core:#a3521f; --icore:#b89130; --magma:#c24a26; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1625; --sheet:#151e30; --ink:#e4eaf5; --soft:#9ba8bf;
  --rule:#233250; --rule-v:#2c2742; --margin:#e07a66; --accent:#86a9ff; --on-accent:#0f1625;
  --ok:#78d6a6; --ok-bg:#16301f; --no:#f0a86b; --no-bg:#35240f; --hint:#e6cf72; --hint-bg:#302810;
  --line:#26324a; --chip:#1c2740;  --c1:#86a9ff; --c2:#e07a66; --c3:#56c49e; --c4:#e8c862; --fill-a:#22355e; --fill-s:#1a2438; --sky:#1d3550; --earth:#3f7a4d; --water:#1d3a52; --rock:#6b5d48; --crust:#5a4c3a; --mantle:#9a6232; --core:#a3521f; --icore:#b89130; --magma:#c24a26; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ar);font-size:var(--fs,18px);line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
:root[data-size="2"]{--fs:21px} :root[data-size="3"]{--fs:24px}
.wrap{max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.lat{font-family:var(--f-lat)}
[dir="ltr"].content{font-family:var(--f-lat);line-height:1.65}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:10px;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.mark{width:40px;height:40px;flex:none;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:14px}
.brand h1{font-family:var(--f-disp);font-weight:700;font-size:1.05em;margin:0;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;flex:none}
.tbtn{border:1px solid var(--line);background:var(--sheet);border-radius:999px;min-width:44px;height:40px;padding:0 10px;font-weight:700;font-size:15px;font-family:var(--f-lat)}

.nav{display:flex;gap:8px;margin-block:16px 6px;flex-wrap:wrap}
.nav button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:8px 18px;font-weight:600;min-height:44px}
.nav button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
h2{font-family:var(--f-disp);font-weight:700;font-size:1.35em;line-height:1.35;margin:18px 0 6px;text-wrap:balance}
h3{font-family:var(--f-disp);font-weight:500;font-size:.95em;color:var(--soft);margin:24px 0 8px;letter-spacing:.02em}
.lead{color:var(--soft);margin:0 0 14px}
.back{border:0;background:none;color:var(--accent);font-weight:600;padding:10px 0;margin-top:6px;min-height:44px}

/* subjects */
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.subj{text-align:start;border:1px solid var(--line);background:var(--sheet);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:118px}
.subj .sym{font-family:var(--f-math);font-size:1.4em;line-height:1;color:var(--accent)}
.subj b{font-family:var(--f-disp);font-weight:700;line-height:1.35}
.subj span{font-size:.78em;color:var(--soft)}
.bar{height:6px;border-radius:6px;background:var(--chip);overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--accent)}

/* lesson list */
.lessons{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.lessons li{border-bottom:1px solid var(--line)}
.lessons button{width:100%;border:0;background:none;text-align:start;display:grid;grid-template-columns:2.1em 1fr;gap:2px 10px;padding:12px 2px;align-items:start;min-height:52px}
.num{font-family:var(--f-math);color:var(--margin);text-align:center;line-height:1.7}
.tt{font-weight:600;line-height:1.5;min-width:0}
.chips{grid-column:2;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.72em;border-radius:999px;padding:1px 10px;background:var(--chip);color:var(--soft)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}

/* steps bar */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--chip);border-radius:14px;padding:4px;margin-block:10px 16px}
.steps button{border:0;background:none;border-radius:11px;padding:6px 2px;font-size:.8em;font-weight:600;line-height:1.3;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.steps button small{font-family:var(--f-math);font-size:.95em;color:var(--margin)}
.steps button[aria-selected="true"]{background:var(--sheet);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--accent)}

/* Seyès sheet */
.sheet{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:6px;
  background-image:linear-gradient(to bottom,transparent calc(100% - 1px),var(--rule) 0),linear-gradient(to right,transparent calc(100% - 1px),var(--rule-v) 0);
  background-size:100% 2em,2em 100%;padding:10px 16px 14px;padding-inline-start:44px;overflow:hidden}
.sheet::before{content:"";position:absolute;top:0;bottom:0;inset-inline-start:30px;width:2px;background:var(--margin);opacity:.7}
.keys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:k}
.keys li{line-height:2;display:flex;gap:8px;align-items:flex-start}
.keys li .t{flex:1;min-width:0;overflow-wrap:anywhere}
.keys b,.qtext b{color:var(--accent);font-weight:700}
.say{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;width:36px;height:36px;font-size:15px;line-height:1;display:grid;place-items:center;margin-top:2px}
.say svg{width:16px;height:16px}

.gloss{width:100%;border-collapse:collapse;background:var(--sheet);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gloss td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.gloss tr:last-child td{border-bottom:0}
.gloss td:first-child{font-weight:700;color:var(--accent)}
.gloss td.ar{font-family:var(--f-ar)}
.gloss td.la{font-family:var(--f-lat)}

/* exercise player */
.dots{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--chip);border:1.5px solid var(--line)}
.dot.cur{background:var(--accent);border-color:var(--accent)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dots span{font-size:.8em;color:var(--soft);margin-inline-start:6px;font-family:var(--f-lat)}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px}
.kind{font-size:.75em;color:var(--soft);font-weight:600;margin-bottom:4px}
.qrow{display:flex;gap:8px;align-items:flex-start}
.qtext{flex:1;min-width:0;font-weight:600;line-height:2;margin:0 0 12px;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 14px;min-height:52px;text-align:start;line-height:1.6;overflow-wrap:anywhere}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.tried{background:var(--no-bg);border-color:var(--no);color:var(--no);text-decoration:line-through;text-decoration-thickness:1px}
.opt[disabled]{cursor:default}
.vfrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vfrow .opt{text-align:center;font-weight:700}
/* order */
.slot{min-height:56px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--paper);margin-bottom:10px}
.slot:empty::before{content:attr(data-empty);color:var(--soft);font-size:.85em;padding-inline:6px}
.tok{border:1.5px solid var(--accent);background:var(--sheet);color:var(--ink);border-radius:10px;padding:6px 12px;min-height:44px;line-height:1.5;overflow-wrap:anywhere;max-width:100%;text-align:start}
.tok.placed{background:var(--chip)}
.tok.good{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.tok.bad{border-color:var(--no);background:var(--no-bg);color:var(--no)}
.pool{display:flex;flex-wrap:wrap;gap:6px}
/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mi{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 10px;min-height:52px;text-align:start;line-height:1.5;overflow-wrap:anywhere}
.mi.sel{border-color:var(--accent);background:var(--chip);box-shadow:0 0 0 1px var(--accent) inset}
.mi.done{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);cursor:default}
.mi.miss{border-color:var(--no);background:var(--no-bg)}
.mi .pair{display:inline-block;font-family:var(--f-math);font-size:.8em;margin-inline-end:6px;color:var(--ok)}

.feedback{margin-top:12px;border-radius:12px;padding:12px 14px;line-height:1.9}
.feedback.ok{background:var(--ok-bg);color:var(--ink);border-inline-start:4px solid var(--ok)}
.feedback.no{background:var(--no-bg);color:var(--ink);border-inline-start:4px solid var(--no)}
.feedback b{display:block}
.hint{margin-top:12px;background:var(--hint-bg);border-radius:12px;padding:12px 14px}
.hint h4{margin:0 0 4px;font-family:var(--f-disp);color:var(--hint);font-size:.9em}
.hint ol{margin:0;padding-inline-start:1.3em;line-height:1.9}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:8px 20px;font-weight:700;min-height:46px}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.help{background:var(--hint-bg);color:var(--hint);border:1.5px solid transparent}
.btn[disabled]{opacity:.45;cursor:default}
.end{text-align:center;padding:22px 16px}
.end .big{font-family:var(--f-math);font-size:2.4em;line-height:1.2;color:var(--accent)}
.end p{margin:6px 0 0}

.tip{background:var(--hint-bg);border-radius:14px;padding:14px 16px;line-height:1.9}
.tip h4{margin:0 0 4px;font-family:var(--f-disp);color:var(--hint);font-size:.95em}
.tip p{margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:var(--f-math);font-size:1.4em;font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:.72em;color:var(--soft)}
.ptable{width:100%;border-collapse:collapse;font-size:.88em}
.ptable td,.ptable th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start}
.ptable th{color:var(--soft);font-weight:600;font-size:.85em}
.ptable td.n{font-family:var(--f-math);font-variant-numeric:tabular-nums;white-space:nowrap}
.advice{margin:0;padding-inline-start:1.2em;display:flex;flex-direction:column;gap:8px}
.reset{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 16px;color:var(--soft);margin-top:18px;min-height:44px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.note{font-size:.8em;color:var(--soft);margin-top:22px}



/* figures */
.figw{margin:8px 0 12px;padding:10px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.figli{display:block!important}
.fig{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
.figw figcaption{font-size:.82em;color:var(--soft);text-align:center;margin-top:6px;line-height:1.6}
.fig .l{stroke:var(--ink);stroke-width:1.6;fill:none;stroke-linejoin:round;stroke-linecap:round}
.fig .thin{stroke-width:1} .fig .thick{stroke-width:2.6} .fig .d{stroke-dasharray:5 4}
.fig .a{stroke:var(--accent)} .fig .m{stroke:var(--margin)} .fig .grid{stroke:var(--line);stroke-width:1}
.fig .fi{fill:var(--ink)} .fig .fa{fill:var(--accent)} .fig .fm{fill:var(--margin)}
.fig .fov{fill:var(--accent);opacity:.55} .fig .fs{fill:var(--fill-s)} .fig .fs2{fill:var(--chip)} .fig .fa2{fill:var(--fill-a)}
.fig .p1{fill:var(--c1)} .fig .p2{fill:var(--c2)} .fig .p3{fill:var(--c3)} .fig .p4{fill:var(--c4)} .fig .ls{stroke:var(--sheet);stroke-width:2}
.fig text{font-family:var(--f-lat);font-size:13px;fill:var(--ink)}
.fig .t.b{font-weight:700} .fig .t.s{font-size:11.5px} .fig .t.big{font-size:18px;font-weight:700}
.fig .t.a{fill:var(--accent)} .fig .t.m{fill:var(--margin)} .fig .t.inv{fill:#fff}
.fig .atO{fill:#d64541} .fig .atC{fill:#3a3f47} .fig .atN{fill:#3d6fd6} .fig .atH{fill:#ffffff}
.fig .sun{fill:#f6c343} .fig .sky{fill:var(--sky)} .fig .earth{fill:var(--earth)} .fig .water{fill:var(--water)}
.fig .rock{fill:var(--rock)} .fig .crust{fill:var(--crust)} .fig .ground{fill:var(--rock);opacity:.6} .fig .mantle{fill:var(--mantle)} .fig .core{fill:var(--core)} .fig .icore{fill:var(--icore)}
.fig .magma{fill:var(--magma)} .fig .lava{stroke:var(--magma);fill:none;stroke-linecap:round}
.fig .rk1{fill:var(--rock)} .fig .rk2{fill:var(--crust)} .fig .rk3{fill:var(--fill-a)}
.fig .glass{fill:var(--fill-a);opacity:.85} .fig .glass2{fill:var(--chip)} .fig .hole{fill:var(--sheet)} .fig .shadow{fill:var(--ink);opacity:.18}
.fig .flame{fill:#f39c34;opacity:.9} .fig .flameB{fill:#4f86e8} .fig .flameY{fill:#f4b63a}
.fig .sR{stroke:#e53935}.fig .sO{stroke:#fb8c00}.fig .sY{stroke:#fdd835}.fig .sG{stroke:#43a047}.fig .sB{stroke:#1e88e5}.fig .sI{stroke:#3949ab}.fig .sV{stroke:#8e24aa}
.fig .wP{stroke:#d64541;stroke-width:2.4} .fig .wN{stroke:#3d6fd6;stroke-width:2.4} .fig .wT{stroke:#3c9d4e;stroke-width:2.4;stroke-dasharray:8 4}
.fig .stem{stroke:var(--c3)} .fig .petal{fill:var(--c2);opacity:.75} .fig .sepal{fill:none;stroke:var(--c3);stroke-width:2.4} .fig .pollen{fill:var(--c4)}
/* nouveautés */
.starbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--hint-bg);color:var(--hint);border-radius:14px;padding:8px 16px;margin-top:8px}
.starbar b{font-family:var(--f-math);font-size:1.15em}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
.quick .set{min-height:70px}.qi{display:flex;flex-direction:column;gap:2px;min-width:0}
.set[disabled]{opacity:.55;cursor:default}
.from{font-size:.75em;color:var(--margin);font-weight:600;margin-bottom:2px}
.star{color:var(--hint);font-weight:700}
@media (max-width:420px){.quick{grid-template-columns:1fr}}

/* gap fill */
.gap{line-height:2.4;font-weight:600;margin:0 0 12px;overflow-wrap:anywhere}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:4.5em;min-height:40px;padding:0 10px;margin:2px 3px;border-bottom:2.5px solid var(--soft);border-radius:8px 8px 0 0;background:var(--paper);vertical-align:middle;font-weight:700}
.blank.next{border-bottom-color:var(--accent);background:var(--chip)}
.blank.filled{border:1.5px solid var(--accent);border-radius:10px;background:var(--sheet)}
.blank.good{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.blank.bad{border-color:var(--no);background:var(--no-bg);color:var(--no)}
/* series */
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid var(--line);background:var(--sheet);border-radius:14px;padding:12px 16px;min-height:60px;text-align:start}
.set b{font-family:var(--f-disp)}
.set span{font-size:.8em;color:var(--soft)}
.set .chip{font-size:.75em}
/* mic */
.lineTools{display:flex;gap:6px;flex:none}
.mic{border-color:var(--margin);color:var(--margin)}
.mic.on{background:var(--margin);color:var(--paper)}
.recpanel{margin-top:8px;background:var(--chip);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;line-height:1.7}
.recpanel audio{width:100%;max-width:100%;height:40px}
.recpanel .heard{font-size:.9em}
.recpanel .heard b{color:var(--accent)}
.recpanel .err{color:var(--no);font-size:.9em}
.recdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--margin);margin-inline-end:6px}
.keys li{flex-wrap:wrap}
.keys li .recpanel{flex-basis:100%}

/* math */
.m{font-family:var(--f-math);unicode-bidi:isolate;padding-inline:1px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;font-size:.88em;margin-inline:2px}
.fr>span:first-child{border-bottom:1.3px solid currentColor;padding-inline:3px}
.vec{display:inline-block;position:relative;padding-top:.32em;line-height:1;font-family:var(--f-math)}
.vec::before{content:"";position:absolute;top:.14em;left:.04em;right:.2em;border-top:1.3px solid currentColor}
.vec::after{content:"";position:absolute;top:-.01em;right:0;border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
@media (max-width:420px){.steps button{font-size:.72em}h2{font-size:1.2em}}
</style>

<div class="wrap">

{t:"Les lentilles minces : image par une lentille convergente",

w:[["lentille convergente","عدسة مجمعة"],["lentille divergente","عدسة مفرقة"],["foyer","البؤرة"],["distance focale","المسافة البؤرية"],["vergence","القوة البصرية"]],
x:[["q","Une lentille à bords minces est :",["convergente","divergente"],0,"Bords minces → convergente."],
["q","`f=0,5 m`. La vergence est :",["0,5 δ","2 δ","5 δ"],1,"`C=1÷0,5` | `=2 δ`."],
["vf","Un rayon qui passe par le centre optique `O` n'est pas dévié.",true,"C'est une règle de construction."],

{t:"Étude de quelques instruments optiques",

w:[["cristallin","الجسم البلوري"],["rétine","الشبكية"],["myopie","قصر البصر"],["hypermétropie","مد البصر"],["loupe","المكبرة"]],
x:[["m","Relie chaque partie de l'œil à son rôle.",[["Cristallin","lentille"],["Rétine","écran"]],"La lumière traverse le cristallin, puis arrive sur la rétine."],

["vf","La loupe est une lentille convergente.",true,"Elle agrandit les objets proches."],
["q","Dans un appareil photo, l'écran est :",["le capteur","l'objectif","le flash"],0,"Comme la rétine dans l'œil."]]},

{s:"Partie III : Électricité",t:"La tension électrique alternative sinusoïdale",

{t:"L'installation électrique domestique monophasée",

{s:"Unité 1 : Phénomènes géologiques internes",t:"La théorie de la tectonique des plaques",

{t:"Les séismes et leur relation avec la tectonique des plaques",
k:["Un <b>séisme</b> est une secousse du sol causée par une rupture des roches en profondeur.","Le <b>foyer</b> est le point de rupture en profondeur. L'<b>épicentre</b> est le point en surface juste au-dessus.","Le séisme produit des <b>ondes sismiques</b>, enregistrées par un <b>sismographe</b> (sur un sismogramme).","<b>Magnitude</b> (échelle de Richter) : l'énergie libérée. <b>Intensité</b> (échelle MSK, de I à XII) : les dégâts observés.","Les séismes se produisent surtout aux limites des plaques.","Les ondes sismiques ont permis de connaître la structure de la Terre : croûte, manteau, noyau."],
w:[["séisme","زلزال"],["foyer","البؤرة"],["épicentre","المركز السطحي"],["sismographe","مرسمة الزلازل"],["magnitude","الوسع"],["intensité","الشدة"]],

["o","Range les couches de la Terre de la surface vers le centre.",["croûte","manteau","noyau"],"On part de la surface où nous vivons."]]},

{t:"Le volcanisme et sa relation avec la tectonique des plaques",
k:["Un volcan émet du <b>magma</b> venant de la profondeur. En surface, c'est la <b>lave</b>.","<b>Volcanisme effusif</b> : lave fluide, coulées de lave, peu dangereux.","<b>Volcanisme explosif</b> : lave visqueuse, explosions et nuées ardentes, très dangereux.","La plupart des volcans sont aux limites des plaques : dorsales et zones de subduction.","Au Maroc, il y a d'anciens volcans dans le Moyen Atlas."],
w:[["volcan","بركان"],["magma","الصهارة"],["lave","الحمم"],["effusif","انسكابي"],["explosif","انفجاري"]],
x:[["m","Relie chaque type à sa lave.",[["Effusif","lave fluide"],["Explosif","lave visqueuse"]],"Fluide = coule facilement."],
["vf","Le volcanisme explosif est plus dangereux que le volcanisme effusif.",true,"Il produit des explosions et des nuées ardentes."],
["q","Le magma qui sort en surface s'appelle :",["la lave","le basalte","la cendre"],0,"Magma en profondeur, lave en surface."],
["q","Où trouve-t-on la plupart des volcans ?",["aux limites des plaques","au centre des continents","dans les déserts"],0,"Dorsales et subduction."]]},

{t:"Les roches magmatiques",
k:["Les roches magmatiques viennent du refroidissement d'un magma.","<b>Roche volcanique</b> : refroidissement <b>rapide</b> en surface. Petits cristaux. Exemple : le <b>basalte</b>.","<b>Roche plutonique</b> : refroidissement <b>lent</b> en profondeur. Grands cristaux visibles (structure grenue). Exemple : le <b>granite</b>.","Le magma se forme par fusion partielle des roches en profondeur."],
w:[["roche magmatique","صخرة صهارية"],["roche volcanique","صخرة بركانية"],["roche plutonique","صخرة جوفية"],["basalte","البازلت"],["granite","الغرانيت"]],
x:[["m","Relie chaque roche à son type.",[["Basalte","volcanique"],["Granite","plutonique"]],"Le basalte vient des volcans."],
["q","Une roche avec de grands cristaux s'est refroidie :",["lentement","rapidement"],0,"Les cristaux ont eu le temps de grandir."],

["q","La structure du granite est :",["grenue","vitreuse","liquide"],0,"On voit bien les cristaux."]]},

{t:"Les déformations tectoniques",
k:["Les roches peuvent se déformer sous l'effet de forces appelées <b>contraintes</b>.","<b>Déformation souple</b> : les couches se courbent, ce sont des <b>plis</b>.","Pli en forme de « A » : <b>anticlinal</b>. Pli en forme de « U » : <b>synclinal</b>.","<b>Déformation cassante</b> : les roches se cassent, ce sont des <b>failles</b>.","<b>Faille normale</b> : due à un étirement (distension). <b>Faille inverse</b> : due à une compression.","Ces déformations sont liées au mouvement des plaques."],
w:[["pli","طية"],["faille","فالق"],["anticlinal","طية محدبة"],["synclinal","طية مقعرة"],["compression","انضغاط"],["distension","تمدد"]],
x:[["m","Relie.",[["Pli","déformation souple"],["Faille","déformation cassante"]],"Souple = se plie. Cassante = se casse."],
["q","Un pli en forme de « U » est :",["un anticlinal","un synclinal"],1,"Synclinal = creux."],

{t:"La formation des chaînes de montagnes",

x:[["m","Relie chaque chaîne à son type.",[["Les Andes","subduction"],["L'Himalaya","collision"]],"Les Andes : plaque océanique sous l'Amérique. | Himalaya : Inde contre Asie."],
["vf","Les chaînes de montagnes se forment quand les plaques s'éloignent.",false,"Elles se forment quand les plaques se rapprochent."],
["q","Dans la subduction, une plaque océanique :",["plonge sous une autre plaque","monte sur un continent","disparaît dans l'air"],0,"Elle plonge dans le manteau."],

{s:"Unité 2 : La reproduction chez les êtres vivants",t:"La reproduction chez les animaux",
k:["La reproduction sexuée a besoin d'un mâle et d'une femelle.","Le mâle produit des <b>spermatozoïdes</b>. La femelle produit des <b>ovules</b>.","La <b>fécondation</b> : un spermatozoïde s'unit à un ovule. On obtient un <b>œuf</b>.","Fécondation <b>externe</b> (dans l'eau : poissons, grenouilles) ou <b>interne</b> (dans le corps de la femelle).","Animal <b>ovipare</b> : pond des œufs (poule). Animal <b>vivipare</b> : donne naissance à des petits (vache).","Développement direct ou indirect avec <b>métamorphose</b> (grenouille, papillon)."],
w:[["fécondation","الإخصاب"],["ovipare","بيوض"],["vivipare","ولود"],["métamorphose","التحول"],["œuf","بيضة"]],
x:[["m","Relie chaque animal à son type.",[["Poule","ovipare"],["Vache","vivipare"]],"Ovipare pond des œufs."],
["q","La fécondation chez la grenouille est :",["externe","interne"],0,"Elle se fait dans l'eau."],

["vf","La fécondation est l'union d'un spermatozoïde et d'un ovule.",true,"Elle donne un œuf."]]},

{t:"La reproduction chez les végétaux",
k:["La <b>fleur</b> est l'organe de reproduction des plantes à fleurs.","Les <b>étamines</b> produisent le <b>pollen</b>. Le <b>pistil</b> contient l'<b>ovaire</b> avec les <b>ovules</b>.","<b>Pollinisation</b> : transport du pollen par le vent ou les insectes.","Après fécondation : l'ovule devient la <b>graine</b>, l'ovaire devient le <b>fruit</b>.","Plantes sans fleurs (fougères, mousses) : reproduction par <b>spores</b>.","<b>Reproduction asexuée</b> : bouturage, marcottage, greffage, tubercule (pomme de terre), stolon (fraisier)."],
w:[["étamine","السداة"],["pistil","المدقة"],["pollen","حبوب اللقاح"],["pollinisation","التأبير"],["graine","البذرة"],["bouturage","الإفسال"]],
x:[["m","Relie.",[["Ovule","graine"],["Ovaire","fruit"]],"Après la fécondation, chaque partie se transforme."],
["q","Le pollen est produit par :",["les étamines","le pistil","les racines"],0,"Les étamines sont les organes mâles."],

["o","Range les étapes.",["pollinisation","fécondation","formation de la graine et du fruit"],"Le pollen arrive d'abord sur le pistil."]]},

{t:"La reproduction chez l'Homme",
k:["Les <b>testicules</b> produisent les spermatozoïdes. Les <b>ovaires</b> produisent les ovules.","À la <b>puberté</b>, les organes reproducteurs commencent à fonctionner.","Chez la femme, il y a un <b>cycle</b> d'environ 28 jours. L'<b>ovulation</b> a lieu vers le 14e jour.","La fécondation a lieu dans la trompe. L'œuf se fixe dans l'<b>utérus</b> : c'est la nidation.","La <b>grossesse</b> dure environ 9 mois. L'embryon puis le fœtus se nourrit grâce au <b>placenta</b>.","Après l'accouchement, le bébé est nourri par l'<b>allaitement</b>.","La régulation des naissances permet de planifier la taille de la famille."],
w:[["testicule","الخصية"],["ovaire","المبيض"],["utérus","الرحم"],["ovulation","الإباضة"],["placenta","المشيمة"],["grossesse","الحمل"]],
x:[["m","Relie chaque organe à ce qu'il produit.",[["Testicules","spermatozoïdes"],["Ovaires","ovules"]],"Organe mâle, organe femelle."],

["q","Le fœtus reçoit sa nourriture grâce :",["au placenta","à l'estomac de la mère","aux poumons"],0,"Le placenta relie le fœtus à la mère."],
["o","Range les étapes.",["fécondation","nidation dans l'utérus","grossesse","accouchement"],"De l'œuf jusqu'à la naissance."]]},

{t:"L'hérédité chez l'Homme",
k:["Un <b>caractère héréditaire</b> se transmet des parents aux enfants (couleur des yeux, groupe sanguin).","L'information héréditaire est portée par les <b>chromosomes</b>, dans le noyau des cellules.","L'Homme a <b>46 chromosomes</b> : 23 paires. Un gamète en a 23.","Le sexe : femme `XX`, homme `XY`.","Les <b>gènes</b> sont des parties des chromosomes. Ils déterminent les caractères.","Certaines maladies sont héréditaires (hémophilie, daltonisme). Les mariages entre proches parents augmentent le risque.","Le <b>clonage</b> produit un individu identique génétiquement (la brebis Dolly, 1996)."],

["vf","Les mariages entre proches parents augmentent le risque de maladies héréditaires.",true,"Les parents peuvent porter le même gène malade."]]}

{t:"المرابطون والموحدون",

{t:"Le vocabulaire de la description, de l'explication et de l'image (leçons 4 à 6)",
k:["<b>Décrire</b> : adjectifs de couleur, de forme, de taille. Indicateurs de lieu : à gauche, au fond, au premier plan.","<b>Expliquer</b> : cause, conséquence, but. Mots : car, donc, afin de, grâce à.","<b>L'image</b> : plan (gros plan, plan d'ensemble), premier plan, arrière-plan, cadrage, couleurs, lumière."],
w:[["premier plan","المقدمة / الواجهة"],["arrière-plan","الخلفية"],["indicateur de lieu","ظرف مكان"]],
x:[["m","Relie.",[["au premier plan","près de nous"],["à l'arrière-plan","loin de nous"]],"Premier = devant."],
["q","« Afin de » exprime :",["le but","le lieu"],0,"Afin de = pour."],
["o","Range pour décrire l'image.",["Au premier plan,","un enfant","lit","un livre"],"Lieu + sujet + verbe + complément."],

{s:"Outils de langue : Conjugaison",t:"Le verbe et le mode indicatif (leçons 7-8)",
k:["Le <b>verbe</b> exprime une action ou un état. Il se conjugue.","Trois groupes : 1er (-er), 2e (-ir, -issons), 3e (les autres).","L'<b>indicatif</b> exprime un fait réel.","Temps simples : présent, imparfait, passé simple, futur.","Temps composés : passé composé, plus-que-parfait (auxiliaire avoir ou être + participe passé)."],
w:[["verbe","فعل"],["groupe","مجموعة"],["indicatif","صيغة الإخبار"],["auxiliaire","فعل مساعد"]],
x:[["m","Relie chaque verbe à son groupe.",[["chanter","1er groupe"],["finir","2e groupe"],["prendre","3e groupe"]],"Finir → nous finissons : 2e groupe."],
["q","« Nous mangions » est à :",["l'imparfait","au futur"],0,"Terminaison -ions."],
["q","« Il a mangé » est au :",["passé composé","présent"],0,"Auxiliaire « a » + participe « mangé »."],
["o","Range pour faire une phrase au futur.",["Demain,","nous","visiterons","le musée"],"Futur : terminaison -rons."]]},

{t:"Le mode conditionnel (leçon 9)",
k:["Le <b>conditionnel</b> exprime une action possible, un souhait ou une demande polie.","Formation : radical du futur + terminaisons de l'imparfait.","je chanter<b>ais</b>, tu chanter<b>ais</b>, il chanter<b>ait</b>, nous chanter<b>ions</b>, vous chanter<b>iez</b>, ils chanter<b>aient</b>.","Avec « si » : Si j'avais le temps, je <b>viendrais</b>.","Politesse : Je <b>voudrais</b> un verre d'eau."],
w:[["conditionnel","صيغة الشرط"],["souhait","أمنية"],["politesse","أدب / لباقة"]],
x:[["q","« Je voudrais » exprime :",["une demande polie","un ordre"],0,"Plus poli que « je veux »."],
["q","Complète : Si j'avais un vélo, je … au parc.",["irais","vais","irai"],0,"Si + imparfait → conditionnel."],
["vf","« Nous partirions » est au conditionnel.",true,"Terminaison -ions sur le radical du futur."],
["o","Range la phrase.",["Si","il faisait beau,","nous","irions à la plage"],"Si + condition, puis le résultat."]]},

{t:"Le mode subjonctif (leçon 10)",
k:["Le <b>subjonctif</b> exprime un souhait, une obligation, un doute.","Il vient souvent après « que » : Il faut <b>que</b> tu <b>viennes</b>.","Terminaisons : -e, -es, -e, -ions, -iez, -ent.","Verbes à retenir : être (que je sois), avoir (que j'aie), aller (que j'aille), faire (que je fasse)."],
w:[["subjonctif","صيغة التمني والضرورة"],["obligation","وجوب"]],
x:[["q","Il faut que tu … tes devoirs.",["fasses","fais","feras"],0,"Après « il faut que » : subjonctif."],
["q","Je souhaite que vous … heureux.",["soyez","êtes"],0,"Souhait → subjonctif de être."],
["vf","Le subjonctif vient souvent après « que ».",true,"Il faut que, je veux que…"],
["o","Range la phrase.",["Il faut","que","nous","partions","tôt"],"Il faut que + sujet + verbe."]]},

{t:"Les verbes irréguliers (leçon 11)",
k:["Certains verbes changent de radical : ce sont des verbes irréguliers.","<b>être</b> : je suis, tu es, il est, nous sommes, vous êtes, ils sont.","<b>avoir</b> : j'ai, tu as, il a, nous avons, vous avez, ils ont.","<b>aller</b> : je vais, tu vas, il va, nous allons, vous allez, ils vont.","<b>faire</b> : je fais, tu fais, il fait, nous faisons, vous faites, ils font.","Il faut les apprendre par cœur."],
w:[["irrégulier","شاذ / غير قياسي"],["par cœur","عن ظهر قلب"]],
x:[["q","Nous … contents.",["sommes","êtes","sont"],0,"être avec nous : sommes."],
["q","Vous … vos devoirs.",["faites","faisez"],0,"Faire avec vous : faites."],
["m","Relie (verbe aller).",[["je","vais"],["nous","allons"],["ils","vont"]],"Aller est très irrégulier."],
["vf","« Ils ont » est le verbe avoir.",true,"avoir : ils ont."]]},

{t:"La voix passive (leçon 12)",
k:["Voix <b>active</b> : le sujet fait l'action. Le chat mange la souris.","Voix <b>passive</b> : le sujet subit l'action. La souris est mangée <b>par</b> le chat.","Formation : <b>être</b> + participe passé.","Le complément d'objet devient sujet. Le sujet devient <b>complément d'agent</b> (avec « par »)."],
w:[["voix active","المبني للمعلوم"],["voix passive","المبني للمجهول"],["complément d'agent","منفذ الفعل (بعد par)"]],
x:[["q","« La lettre est écrite par Sara. » La phrase est à la voix :",["passive","active"],0,"être + participe passé + par."],
["q","Passive de « Le vent casse la branche » :",["La branche est cassée par le vent.","Le vent est cassé par la branche."],0,"L'objet (la branche) devient sujet."],
["o","Range pour la voix passive.",["Le gâteau","est préparé","par","ma mère"],"Sujet + être + participe + par + agent."],
["vf","À la voix passive, on utilise l'auxiliaire être.",true,"être + participe passé."]]},

{t:"La voix pronominale (leçon 13)",
k:["Un verbe <b>pronominal</b> se conjugue avec un pronom : me, te, se, nous, vous, se.","Exemple : <b>se laver</b> → je me lave, tu te laves, il se lave.","Aux temps composés, on utilise l'auxiliaire <b>être</b> : elle s'est levée.","Sens réfléchi (on le fait à soi-même) ou réciproque (les uns aux autres : ils se parlent)."],
w:[["verbe pronominal","فعل ضميري"],["réfléchi","انعكاسي"],["réciproque","تبادلي"]],
x:[["q","Je … lave les mains.",["me","te","se"],0,"Avec je : me."],
["q","« Elle s'est levée » utilise l'auxiliaire :",["être","avoir"],0,"Les verbes pronominaux prennent être."],
["vf","« Ils se parlent » a un sens réciproque.",true,"Ils parlent l'un à l'autre."],
["o","Range la phrase.",["Nous","nous","levons","tôt"],"Sujet + pronom + verbe."]]},

{s:"Outils de langue : Grammaire",t:"Le classement des mots (leçon 14)",
k:["Les mots se classent en <b>classes grammaticales</b>.","Variables : nom, déterminant, adjectif, pronom, verbe.","Invariables : adverbe (vite), préposition (à, de, dans), conjonction (et, mais, car).","Exemple : Le (déterminant) petit (adjectif) chat (nom) dort (verbe) bien (adverbe)."],
w:[["nom","اسم"],["adjectif","صفة"],["adverbe","حال / ظرف"],["préposition","حرف جر"]],
x:[["m","Relie chaque mot à sa classe.",[["maison","nom"],["joli","adjectif"],["courir","verbe"],["lentement","adverbe"]],"Un adverbe se termine souvent par -ment."],
["q","Dans « Le chat dort », « Le » est :",["un déterminant","un nom"],0,"Il est devant le nom."],
["vf","« Et » est une conjonction.",true,"Et, mais, ou, donc, or, ni, car."],
["q","« Dans » est :",["une préposition","un adjectif"],0,"Elle indique souvent le lieu."]]},

{t:"Le nom et ses substituts (leçon 15)",
k:["Pour éviter les répétitions, on remplace un nom par un <b>substitut</b>.","Substituts : <b>pronoms</b> (il, elle, le, lui), <b>synonymes</b>, <b>périphrases</b>.","Exemple : Karim arrive. <b>Il</b> est content. <b>Le jeune garçon</b> sourit.","Périphrase : un groupe de mots qui désigne une chose. « Le roi des animaux » = le lion."],
w:[["substitut","معوض"],["pronom","ضمير"],["périphrase","كناية / تعبير بديل"]],
x:[["q","« La ville » dans « Fès est belle. Elle est ancienne. » est remplacée par :",["Elle","belle"],0,"Elle = Fès."],
["q","Une périphrase pour « le lion » :",["le roi des animaux","le chat"],0,"Un groupe de mots qui le désigne."],
["vf","On utilise des substituts pour éviter les répétitions.",true,"C'est leur rôle."],
["o","Range pour éviter la répétition.",["Sara","lit.","Elle","aime les livres."],"Elle remplace Sara."]]},

{t:"Les fonctions par rapport au nom (leçons 16-17)",
k:["Le nom peut être complété par :","l'<b>adjectif épithète</b> : une maison <b>blanche</b>.","le <b>complément du nom</b> : la maison <b>de mon oncle</b>.","la <b>proposition subordonnée relative</b> : la maison <b>qui est au coin</b>.","l'<b>apposition</b> : Fès, <b>la ville ancienne</b>, attire les touristes."],
w:[["épithète","نعت"],["complément du nom","مضاف إليه / تكملة الاسم"],["relative","جملة موصولة"],["apposition","بدل"]],
x:[["m","Relie.",[["un chat noir","adjectif épithète"],["le livre de Sami","complément du nom"],["l'élève qui chante","relative"]],"Qui = relative. De = complément du nom."],
["q","Dans « une robe en coton », « en coton » est :",["complément du nom","adjectif épithète"],0,"Préposition + nom."],
["vf","« qui habite ici » est une subordonnée relative.",true,"Elle commence par « qui »."],
["q","Dans « Rabat, la capitale, est belle », « la capitale » est :",["une apposition","un verbe"],0,"Entre virgules, elle explique le nom."]]},

{t:"Les phrases (leçons 18-19)",
k:["Types de phrases : <b>déclarative</b> (.), <b>interrogative</b> (?), <b>exclamative</b> (!), <b>injonctive</b> (ordre).","Forme <b>affirmative</b> ou <b>négative</b> (ne … pas).","Phrase <b>simple</b> : un seul verbe conjugué.","Phrase <b>complexe</b> : plusieurs verbes conjugués, donc plusieurs propositions.","Les propositions sont juxtaposées (,), coordonnées (et, mais) ou subordonnées (que, qui, quand)."],
w:[["phrase simple","جملة بسيطة"],["phrase complexe","جملة مركبة"],["proposition","جملة فرعية"]],
x:[["m","Relie chaque phrase à son type.",[["Quelle heure est-il ?","interrogative"],["Ferme la porte.","injonctive"],["Quelle belle journée !","exclamative"]],"Regarde la ponctuation."],
["q","« Je mange et je bois. » C'est une phrase :",["complexe","simple"],0,"Deux verbes conjugués."],
["q","Forme négative de « Il parle » :",["Il ne parle pas.","Il parle pas ne."],0,"ne + verbe + pas."],
["o","Range la phrase négative.",["Je","ne","suis","pas","fatigué"],"ne … pas entoure le verbe."]]},

{t:"Les fonctions dans la phrase (leçons 20 à 22)",
k:["<b>Sujet</b> : qui fait l'action. Question : qui est-ce qui ?","<b>COD</b> (complément d'objet direct) : verbe + quoi ? / qui ? — Il lit <b>un livre</b>.","<b>COI</b> : verbe + à qui ? / de quoi ? — Il parle <b>à son ami</b>.","<b>Attribut du sujet</b> : après être, paraître, sembler — Il est <b>malade</b>.","<b>Compléments circonstanciels</b> : de lieu (où ?), de temps (quand ?), de manière (comment ?), de cause (pourquoi ?). Ils peuvent être déplacés."],
w:[["sujet","فاعل / مبتدأ"],["COD","مفعول به مباشر"],["COI","مفعول به غير مباشر"],["complément circonstanciel","ظرف / مفعول فيه"]],
x:[["q","Dans « Le chat mange la souris », « la souris » est :",["COD","sujet"],0,"Le chat mange quoi ? la souris."],
["q","Dans « Il pense à ses vacances », « à ses vacances » est :",["COI","COD"],0,"Il pense à quoi ? Il y a « à »."],
["m","Relie chaque complément circonstanciel.",[["dans le jardin","lieu"],["hier","temps"],["doucement","manière"]],"Où ? Quand ? Comment ?"],
["vf","Dans « Elle est contente », « contente » est attribut du sujet.",true,"Après le verbe être."]]},

{t:"L'expression du temps (leçon 23)",
k:["Le temps peut s'exprimer par :","des adverbes : hier, aujourd'hui, demain, souvent.","des groupes nominaux : le matin, pendant les vacances.","des subordonnées : <b>quand</b>, <b>lorsque</b>, <b>pendant que</b>, <b>avant que</b>, <b>après que</b>.","Relations : <b>antériorité</b> (avant), <b>simultanéité</b> (en même temps), <b>postériorité</b> (après)."],
w:[["antériorité","الأسبقية"],["simultanéité","التزامن"],["postériorité","البعدية"]],
x:[["m","Relie.",[["avant que","antériorité"],["pendant que","simultanéité"],["après que","postériorité"]],"Avant, pendant, après."],
["q","« Quand il pleut, je reste à la maison. » « Quand il pleut » exprime :",["le temps","la cause"],0,"Quand = à quel moment."],
["o","Range la phrase.",["Lorsque","la cloche sonne,","les élèves","sortent"],"Subordonnée de temps, puis principale."],
["vf","« Demain » est un adverbe de temps.",true,"Il dit quand."]]},

{t:"L'expression de la cause et de la conséquence (leçon 24)",
k:["La <b>cause</b> répond à « pourquoi ? » : parce que, car, puisque, à cause de, grâce à.","La <b>conséquence</b> donne le résultat : donc, alors, c'est pourquoi, si bien que.","Exemple : Il est malade, <b>donc</b> il reste au lit. / Il reste au lit <b>parce qu</b>'il est malade.","« Grâce à » : cause positive. « À cause de » : cause négative."],
w:[["cause","سبب"],["conséquence","نتيجة"]],
x:[["m","Relie.",[["parce que","cause"],["c'est pourquoi","conséquence"]],"Parce que = pourquoi."],
["q","« Il a réussi … son travail. »",["grâce à","à cause de"],0,"Réussir est positif."],
["o","Range pour exprimer la conséquence.",["Il fait froid,","donc","je mets","mon manteau"],"Fait + donc + résultat."],
["vf","« Car » exprime la conséquence.",false,"« Car » exprime la cause."]]},

{t:"L'expression de l'opposition (leçon 25)",
k:["L'<b>opposition</b> met en relation deux idées contraires.","Mots : <b>mais</b>, <b>pourtant</b>, <b>cependant</b>, <b>alors que</b>, <b>malgré</b>, <b>bien que</b> (+ subjonctif).","Exemple : Il est petit, <b>mais</b> il est fort.","Malgré + nom : <b>Malgré</b> la pluie, nous sortons."],
w:[["opposition","تعارض / مقابلة"],["malgré","رغم"]],
x:[["q","« Il est riche, … il n'est pas heureux. »",["mais","donc","car"],0,"Deux idées opposées."],
["q","« … la fatigue, il continue. »",["Malgré","Parce que"],0,"Malgré + nom."],
["vf","« Cependant » exprime l'opposition.",true,"Comme « mais »."],
["o","Range la phrase.",["Il pleut,","pourtant","nous","jouons dehors"],"Idée 1 + pourtant + idée 2."]]},

{t:"Les types de textes (leçons 26-27, 33 à 35)",
k:["<b>Texte narratif</b> : raconte une histoire (passé simple, imparfait, schéma narratif).","<b>Texte descriptif</b> : décrit un lieu, une personne, un objet (adjectifs, indicateurs de lieu).","<b>Texte explicatif</b> : explique un phénomène (connecteurs logiques, présent).","<b>Texte argumentatif</b> : défend une opinion (thèse, arguments).","Un texte est <b>cohérent</b> quand les idées s'enchaînent avec des connecteurs."],
w:[["narratif","سردي"],["descriptif","وصفي"],["explicatif","تفسيري"],["argumentatif","حجاجي"]],
x:[["m","Relie chaque texte à son but.",[["Narratif","raconter"],["Descriptif","décrire"],["Explicatif","expliquer"],["Argumentatif","convaincre"]],"Chaque type a un but."],
["q","Un texte qui explique pourquoi la Terre tremble est :",["explicatif","narratif"],0,"Il explique un phénomène."],
["q","Le temps principal du récit au passé :",["le passé simple","le futur"],0,"Avec l'imparfait pour le décor."],
["vf","Un texte descriptif utilise beaucoup d'adjectifs.",true,"Pour dire comment c'est."]]},

{t:"L'énonciation (leçons 28-29)",
k:["L'<b>énonciation</b> : qui parle, à qui, où, quand.","<b>Énoncé ancré</b> dans la situation : je, tu, ici, maintenant, aujourd'hui ; temps : présent, passé composé, futur.","<b>Énoncé coupé</b> de la situation : il, elle, là-bas, ce jour-là ; temps : passé simple, imparfait.","Une lettre est souvent ancrée. Un conte est souvent coupé."],
w:[["énonciation","التلفظ"],["énonciateur","المتكلم"],["destinataire","المخاطب"]],
x:[["m","Relie.",[["je, ici, maintenant","énoncé ancré"],["il, là-bas, ce jour-là","énoncé coupé"]],"Ancré = la situation de celui qui parle."],
["q","« Aujourd'hui, je suis à la maison. » L'énoncé est :",["ancré","coupé"],0,"je, aujourd'hui."],
["vf","Un conte est souvent un énoncé coupé de la situation.",true,"« Il était une fois… »"],
["q","Le destinataire, c'est :",["celui à qui on parle","celui qui parle"],0,"Destinataire = qui reçoit le message."]]},

{t:"Les paroles rapportées (leçon 30)",
k:["<b>Discours direct</b> : Il dit : « Je viendrai demain. »","<b>Discours indirect</b> : Il dit <b>qu'il viendra</b> le lendemain.","Changements : pronoms (je → il), temps, indicateurs (demain → le lendemain, ici → là).","Verbes de parole : dire, demander, répondre, crier, murmurer.","Question : Il demande : « Viens-tu ? » → Il demande <b>si</b> je viens."],
w:[["verbe de parole","فعل القول"],["guillemets","مزدوجتان"]],
x:[["q","Indirect de : Elle dit : « J'ai froid. »",["Elle dit qu'elle a froid.","Elle dit qu'il a froid."],0,"je → elle."],
["q","Indirect de : Il demande : « Tu viens ? »",["Il demande si tu viens.","Il demande que tu viens."],0,"Question oui/non → si."],
["m","Relie (discours indirect au passé).",[["demain","le lendemain"],["ici","là"]],"Les indicateurs changent."],
["vf","« Murmurer » est un verbe de parole.",true,"On parle doucement."]]},

{t:"Les effets dans le texte : mise en relief, figures de style (leçon 31)",
k:["<b>Mise en relief</b> : « C'est … qui / que » pour insister. C'est <b>Sara</b> qui a gagné.","<b>Comparaison</b> : avec un outil (comme, tel, pareil à). Il est fort comme un lion.","<b>Métaphore</b> : sans outil. Ce lion attaque (pour un homme courageux).","<b>Personnification</b> : une chose agit comme une personne. La lune sourit.","<b>Énumération</b> : une liste de mots. <b>Hyperbole</b> : une exagération. Je meurs de faim."],
w:[["figure de style","صورة بلاغية"],["exagération","مبالغة"]],
x:[["m","Relie chaque phrase à sa figure.",[["Rapide comme l'éclair","comparaison"],["Le soleil rit","personnification"],["J'ai mille choses à faire","hyperbole"]],"Comme = comparaison."],
["q","« C'est mon frère qui a cassé le vase. » Cette phrase utilise :",["une mise en relief","une comparaison"],0,"C'est … qui."],
["vf","Une métaphore utilise le mot « comme ».",false,"La métaphore n'a pas d'outil."],
["q","« Je meurs de faim » est :",["une hyperbole","une personnification"],0,"C'est une exagération."]]},

{t:"Les points de vue narratifs (leçon 32)",
k:["<b>Interne</b> : on voit par les yeux d'un personnage, on connaît ses pensées.","<b>Externe</b> : le narrateur observe comme un témoin, sans connaître les pensées.","<b>Omniscient</b> : le narrateur sait tout sur tous les personnages, le passé et l'avenir."],
w:[["interne","داخلي"],["externe","خارجي"],["omniscient","كلي العلم"]],
x:[["q","« Un homme entra. Il portait un chapeau. Personne ne savait qui il était. » Point de vue :",["externe","interne"],0,"On observe sans connaître les pensées."],
["q","Le narrateur sait tout, même l'avenir. Point de vue :",["omniscient","externe"],0,"Omni = tout."],
["vf","En point de vue interne, on connaît les pensées d'un personnage.",true,"On voit par ses yeux."],
["m","Relie.",[["Interne","un personnage"],["Omniscient","tous les personnages"]],"Interne : un seul regard."]]},

{s:"Outils de langue : Orthographe",t:"Les homophones (leçons 36 à 38)",
k:["Les <b>homophones</b> se prononcent pareil mais s'écrivent différemment.","<b>a / à</b> : « a » = verbe avoir (on peut dire « avait »). « à » = préposition.","<b>et / est</b> : « est » = verbe être (on peut dire « était »). « et » = et puis.","<b>son / sont</b> : « sont » = verbe être (« étaient »). « son » = sa, ses.","<b>ou / où</b> : « ou » = ou bien. « où » = le lieu.","Verbes : <b>-er / -é</b> : on remplace par « vendre / vendu ». Il va mang<b>er</b> (vendre). Il a mang<b>é</b> (vendu)."],
w:[["homophone","متجانس صوتيا"],["astuce","حيلة"]],
x:[["q","Il … un chien.",["a","à"],0,"On peut dire : il avait un chien."],
["q","Le ciel … bleu.",["est","et"],0,"On peut dire : le ciel était bleu."],
["q","… habites-tu ?",["Où","Ou"],0,"On demande le lieu."],
["q","Je vais (manger) → je vais …",["manger","mangé"],0,"On peut dire : je vais vendre. | Donc -er."],

<script>// ===== Moteur de figures SVG (thème clair/sombre via classes CSS) =====
const FIG={};
const F=(()=>{
  const r=v=>Math.round(v*10)/10;
  const svg=(w,h,body,cap)=>'<figure class="figw"><svg class="fig" viewBox="0 0 '+w+' '+h+'" direction="ltr" role="img"'+(cap?' aria-label="'+cap.replace(/["`\[\]{}]/g,"")+'"':'')+'>'+body+'</svg>'+(cap?'<figcaption>'+(typeof fmt==="function"?fmt(cap):cap)+'</figcaption>':'')+'</figure>';
  const ln=(x1,y1,x2,y2,c)=>'<line x1="'+r(x1)+'" y1="'+r(y1)+'" x2="'+r(x2)+'" y2="'+r(y2)+'" class="'+(c||"l")+'"/>';
  const pl=(pts,c)=>'<polygon points="'+pts.map(p=>r(p[0])+","+r(p[1])).join(" ")+'" class="'+(c||"l")+'"/>';
  const pll=(pts,c)=>'<polyline points="'+pts.map(p=>r(p[0])+","+r(p[1])).join(" ")+'" class="'+(c||"l")+'"/>';
  const ci=(x,y,rad,c)=>'<circle cx="'+r(x)+'" cy="'+r(y)+'" r="'+r(rad)+'" class="'+(c||"l")+'"/>';
  const el=(x,y,rx,ry,c)=>'<ellipse cx="'+r(x)+'" cy="'+r(y)+'" rx="'+r(rx)+'" ry="'+r(ry)+'" class="'+(c||"l")+'"/>';
  const rc=(x,y,w,h,c,rr)=>'<rect x="'+r(x)+'" y="'+r(y)+'" width="'+r(w)+'" height="'+r(h)+'"'+(rr?' rx="'+rr+'"':'')+' class="'+(c||"l")+'"/>';
  const pa=(d,c)=>'<path d="'+d+'" class="'+(c||"l")+'"/>';
  const tx=(x,y,s,c,a)=>'<text x="'+r(x)+'" y="'+r(y)+'" class="'+(c||"t")+'" text-anchor="'+(a||"middle")+'" dominant-baseline="middle">'+s+'</text>';
  const dot=(x,y,c)=>ci(x,y,3,c||"fi");
  const arr=(x1,y1,x2,y2,c,hc)=>{const a=Math.atan2(y2-y1,x2-x1),s=8;
    return ln(x1,y1,x2-Math.cos(a)*s*.6,y2-Math.sin(a)*s*.6,c||"l")+pl([[x2,y2],[x2-s*Math.cos(a-.4),y2-s*Math.sin(a-.4)],[x2-s*Math.cos(a+.4),y2-s*Math.sin(a+.4)]],hc||"fi")};
  const mid=(A,B)=>[(A[0]+B[0])/2,(A[1]+B[1])/2];
  const tick=(A,B,n,c)=>{const M=mid(A,B),dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,px=-uy*5,py=ux*5;let s="";
    for(let i=0;i<(n||1);i++){const o=(i-((n||1)-1)/2)*4;s+=ln(M[0]+ux*o-px,M[1]+uy*o-py,M[0]+ux*o+px,M[1]+uy*o+py,c||"l")}return s};
  const ra=(P,A,B,s)=>{s=s||10;const u=[(A[0]-P[0]),(A[1]-P[1])],v=[(B[0]-P[0]),(B[1]-P[1])],lu=Math.hypot(...u),lv=Math.hypot(...v);
    const a=[P[0]+u[0]/lu*s,P[1]+u[1]/lu*s],b=[P[0]+v[0]/lv*s,P[1]+v[1]/lv*s],c=[a[0]+v[0]/lv*s,a[1]+v[1]/lv*s];return pll([a,c,b],"l thin")};
  const lab=(P,s,dx,dy,c)=>tx(P[0]+(dx||0),P[1]+(dy||0),s,c||"t b");
  // géométrie
  const sub=(A,B)=>[A[0]-B[0],A[1]-B[1]],add=(A,B)=>[A[0]+B[0],A[1]+B[1]],mul=(A,k)=>[A[0]*k,A[1]*k];
  const foot=(P,A,B)=>{const d=sub(B,A),t=((P[0]-A[0])*d[0]+(P[1]-A[1])*d[1])/(d[0]*d[0]+d[1]*d[1]);return add(A,mul(d,t))};
  const circum=(A,B,C)=>{const d=2*(A[0]*(B[1]-C[1])+B[0]*(C[1]-A[1])+C[0]*(A[1]-B[1]));
    const sq=P=>P[0]*P[0]+P[1]*P[1];return[(sq(A)*(B[1]-C[1])+sq(B)*(C[1]-A[1])+sq(C)*(A[1]-B[1]))/d,(sq(A)*(C[0]-B[0])+sq(B)*(A[0]-C[0])+sq(C)*(B[0]-A[0]))/d]};
  const dist=(A,B)=>Math.hypot(A[0]-B[0],A[1]-B[1]);
  const ext=(A,B,k)=>add(A,mul(sub(B,A),k)); // point sur (AB) au paramètre k
  return{svg,ln,pl,pll,ci,el,rc,pa,tx,dot,arr,mid,tick,ra,lab,sub,add,mul,foot,circum,dist,ext,r};
})();
function figHtml(spec){if(!spec)return"";const sp=String(spec),ix=sp.indexOf(":"),n=ix<0?sp:sp.slice(0,ix),a=ix<0?"":sp.slice(ix+1);const f=FIG[n];if(!f)return"";try{return f(a?a.split("|"):[])}catch(e){return""}}

// ===== Figures — Mathématiques =====
(()=>{const {svg,ln,pl,pll,ci,el,rc,pa,tx,dot,arr,mid,tick,ra,lab,sub,add,mul,foot,circum,dist,ext}=F;
const kv=a=>{const o={};(a||[]).forEach(s=>{const i=s.indexOf("=");if(i>0)o[s.slice(0,i)]=s.slice(i+1);else if(s)o[s]=true});return o};
const chev=(A,B,c)=>{const M=mid(A,B),a=Math.atan2(B[1]-A[1],B[0]-A[0]),s=6;return pll([[M[0]-s*Math.cos(a-.6),M[1]-s*Math.sin(a-.6)],M,[M[0]-s*Math.cos(a+.6),M[1]-s*Math.sin(a+.6)]],c||"l")};

// Barres de fractions : "n/d" ou "étiquette;n/d"
FIG.bars=a=>{a=a.length?a:["3/4"];const long=a.some(s=>s.split(";")[0].length>5),W=long?210:240,X=long?120:80,H=26,G=16;let b="";
  a.forEach((s,i)=>{const [lb,fr]=s.includes(";")?s.split(";"):[s,s];const [n,d]=fr.split("/").map(Number),y=10+i*(H+G),w=W/d;
    for(let k=0;k<d;k++)b+=rc(X+k*w,y,w,H,k<n?"fa2 l":"fs l");b+=tx(X-12,y+H/2,lb,"t b","end")});
  return svg(340,a.length*(H+G)+6,b)};
FIG.fracEq=()=>FIG.bars(["3/4","1/2","2/4"]).replace("</svg>","</svg>")+"";
FIG.fracAdd=()=>FIG.bars(["1/4 = 3/12;3/12","1/6 = 2/12;2/12","total;5/12"]);

FIG.symax=()=>{let b=ln(170,10,170,190,"l d a")+tx(170,200,"(D)","t a");
  const M=[80,70],Mp=[260,70],H=[170,70];b+=ln(M[0],M[1],Mp[0],Mp[1],"l thin")+ra(H,M,[170,10],9)+tick(M,H,1)+tick(H,Mp,1)+dot(...M)+dot(...Mp)+lab(M,"M",-12,-10)+lab(Mp,"M'",14,-10);
  const T=[[60,120],[120,110],[95,175]],Tp=T.map(p=>[340-p[0],p[1]]);b+=pl(T,"fs l")+pl(Tp,"fs l");
  ["A","B","C"].forEach((n,i)=>{b+=lab(T[i],n,i===0?-12:i===1?10:-8,i===2?12:-6)+lab(Tp[i],n+"'",i===0?14:i===1?-12:10,i===2?12:-6)});
  return svg(340,210,b)};
FIG.axes=()=>{let b="";
  b+=rc(20,30,90,90,"fs l")+ln(65,20,65,130,"l d a")+ln(10,75,120,75,"l d a")+ln(14,24,116,126,"l d a")+ln(116,24,14,126,"l d a")+tx(65,150,"carré : 4 axes","t s");
  b+=rc(140,45,100,60,"fs l")+ln(190,35,190,115,"l d a")+ln(130,75,250,75,"l d a")+tx(190,150,"rectangle : 2 axes","t s");
  const P=[[270,120],[350,120],[310,51]];b+=pl(P,"fs l");P.forEach((p,i)=>{const o=mid(P[(i+1)%3],P[(i+2)%3]);b+=ln(...ext(p,o,-.25),...ext(p,o,1.3),"l d a")});b+=tx(310,150,"triangle : 3 axes","t s");
  return svg(380,162,b)};
FIG.fracMul=()=>{const X=70,Y=30,W=240,H=150;let b="";
  for(let c=0;c<4;c++)for(let r=0;r<3;r++){const inC=c<3,inR=r<2;b+=rc(X+c*60,Y+r*50,60,50,inC&&inR?"fov l":inC||inR?"fa2 l":"fs l")}
  b+=pa("M"+X+" "+(Y-8)+"h180","l a")+tx(X+90,Y-18,"3/4","t a b")+pa("M"+(X-8)+" "+Y+"v100","l m")+tx(X-24,Y+50,"2/3","t m b");
  b+=tx(X+W/2,Y+H+20,"6 cases sur 12 : 6/12 = 1/2","t s");return svg(330,205,b)};

FIG.triMid=a=>{const o=kv(a);const A=[170,25],B=[40,190],C=[300,190],I=mid(A,B),J=mid(A,C);let b=pl([A,B,C],"l");
  b+=ln(...I,...J,"l a thick")+tick(A,I,1)+tick(I,B,1)+tick(A,J,2)+tick(J,C,2)+chev(I,J,"l a")+chev(B,C,"l");
  if(o.K){const K=mid(B,C);b+=pl([I,J,K],"l a")+tick(B,K,3)+tick(K,C,3)+dot(...K)+lab(K,"K",0,14)}
  [[A,"A",0,-12],[B,"B",-12,6],[C,"C",12,6],[I,"I",-14,0],[J,"J",14,0]].forEach(p=>{b+=dot(...p[0])+lab(p[0],p[1],p[2],p[3])});
  if(o.BC)b+=tx(170,208,"BC = "+o.BC,"t m b");if(o.IJ)b+=tx(170,96,"IJ = "+o.IJ,"t a b");if(o.AC)b+=tx(258,96,"AC = "+o.AC,"t m b","start");if(o.AJ)b+=tx(252,70,"AJ = "+o.AJ,"t a b","start");if(o.AB)b+=tx(82,96,"AB = "+o.AB,"t m b","end");
  if(o.par)b+=tx(170,224,"(IJ) ∥ (BC)","t s");
  return svg(340,o.BC||o.par?232:212,b)};
FIG.varignon=()=>{const A=[60,40],B=[260,25],C=[300,170],D=[40,190];const I=mid(A,B),J=mid(B,C),K=mid(C,D),L=mid(D,A);
  let b=pl([A,B,C,D],"l")+ln(...A,...C,"l d")+pl([I,J,K,L],"l a thick");
  [[A,"A",-10,-8],[B,"B",8,-8],[C,"C",12,4],[D,"D",-12,6],[I,"I",0,-12],[J,"J",14,0],[K,"K",0,14],[L,"L",-14,0]].forEach(p=>{b+=dot(...p[0])+lab(p[0],p[1],p[2],p[3])});
  return svg(340,205,b)};
FIG.prio=()=>{let b="";const L=[["1","( )","parenthèses"],["2","× ÷","multiplier, diviser"],["3","+ −","additionner"]];
  L.forEach((s,i)=>{const x=6+i*128;b+=rc(x,30,112,56,"fs l",10)+tx(x+56,52,s[1],"t big")+tx(x+56,74,s[2],"t s")+ci(x+12,30,11,"fa2 l")+tx(x+12,31,s[0],"t b");if(i<2)b+=arr(x+114,58,x+126,58)});
  return svg(380,100,b)};
const TRI=[[60,180],[290,180],[200,45]];
const triBase=()=>{let b=pl(TRI,"fs l");[["A",-12,6],["B",12,6],["C",0,-12]].forEach((n,i)=>{b+=lab(TRI[i],n[0],n[1],n[2])});return b};
FIG.mediatrices=()=>{const [A,B,C]=TRI,O=circum(A,B,C);let b=ci(O[0],O[1],dist(O,A),"l d")+triBase();
  [[A,B],[B,C],[C,A]].forEach(([P,Q])=>{const M=mid(P,Q);b+=ln(...ext(M,O,-.35),...ext(M,O,1.25),"l a")+ra(M,P,O,8)+tick(P,M)+tick(M,Q)});
  b+=dot(...O,"fa")+lab(O,"O",12,-8,"t a b");return svg(340,300,b,"Les médiatrices se coupent en O, centre du cercle circonscrit.")};
FIG.hauteurs=()=>{const [A,B,C]=TRI,O=circum(A,B,C),H=sub(add(add(A,B),C),mul(O,2));let b=triBase();
  [[A,B,C],[B,C,A],[C,A,B]].forEach(([P,Q,R])=>{const Hf=foot(P,Q,R);b+=ln(...P,...Hf,"l a")+ra(Hf,P,Q,8)});
  b+=dot(...H,"fa")+lab(H,"H",12,-8,"t a b");return svg(340,200,b,"Les hauteurs se coupent en H, l'orthocentre.")};
FIG.medianes=()=>{const [A,B,C]=TRI,G=[(A[0]+B[0]+C[0])/3,(A[1]+B[1]+C[1])/3];let b=triBase();
  [[A,B,C],[B,C,A],[C,A,B]].forEach(([P,Q,R])=>{const M=mid(Q,R);b+=ln(...P,...M,"l a")+tick(Q,M)+tick(M,R)+dot(...M)});
  b+=dot(...G,"fa")+lab(G,"G",14,-8,"t a b");return svg(340,200,b,"Les médianes se coupent en G, le centre de gravité.")};
FIG.bissectrices=()=>{const [A,B,C]=TRI,a=dist(B,C),bb=dist(A,C),c=dist(A,B);const I=[(a*A[0]+bb*B[0]+c*C[0])/(a+bb+c),(a*A[1]+bb*B[1]+c*C[1])/(a+bb+c)];
  const rIn=dist(I,foot(I,A,B));let b=ci(I[0],I[1],rIn,"l d")+triBase();
  [[A,B,C,c,bb],[B,C,A,a,c],[C,A,B,bb,a]].forEach(([P,Q,R,pq,pr])=>{const D=add(mul(Q,pr/(pq+pr)),mul(R,pq/(pq+pr)));b+=ln(...P,...D,"l a")});

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
try{const s=ls(KEY);if(s)P=Object.assign(P,JSON.parse(s))}catch(e){}

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");

function fmt(s){
  s=String(s).replace(/\[\[([^\/\]]+)\/([^\]]+)\]\]/g,'<span class="fr"><span>$1</span><span>$2</span></span>');
  s=s.replace(/\{([A-Z']+)\}/g,'<span class="vec">$1</span>');
  return s.replace(/`([^`]+)`/g,'<span class="m" dir="ltr">$1</span>');
}
function plain(s){return String(s).replace(/<[^>]+>/g," ").replace(/`/g,"").replace(/\[\[([^\/\]]+)\/([^\]]+)\]\]/g,"$1 / $2").replace(/\{([A-Z']+)\}/g,"$1").replace(/\s+/g," ").trim()}
const isWordy=s=>/[؀-ۿa-zA-Zàâçéèêëîïôûùüœ]{3,}/.test(String(s).replace(/<[^>]+>/g,""));
function optHtml(o){return isWordy(o)&&!/[\[`{]/.test(o)?fmt(o):fmt('`'+o+'`')}

/* ---- voix : écouter (synthèse) ---- */
const canSpeak=(()=>{try{return "speechSynthesis" in window && typeof SpeechSynthesisUtterance!=="undefined"}catch(e){return false}})();
const SPK='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10L5 10H2z" fill="currentColor"/><path d="M11 5.5c1 .8 1 4.2 0 5M12.8 3.8c2 1.8 2 6.6 0 8.4" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>';
const MIC='<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5" fill="currentColor"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.5M5.5 14.5h5" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>';
function speak(text,l){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=l==="ar"?"ar-SA":"fr-FR";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}

/* ---- voix : lire au micro (enregistrement + reconnaissance) ---- */
const R={key:null,on:false,url:null,heard:"",err:null,noRec:false,target:"",l:"fr"};
let mediaRec=null,stream=null,recog=null,recTimer=null;
const RecCtor=(()=>{try{return window.SpeechRecognition||window.webkitSpeechRecognition||null}catch(e){return null}})();
function tools(text,l,key){
  const p=esc(plain(text));
  return '<span class="lineTools">'+(canSpeak?'<button type="button" class="say" data-say="'+p+'" data-sl="'+l+'" aria-label="Écouter">'+SPK+'</button>':'')+
    '<button type="button" class="say mic'+(R.key===key&&R.on?' on':'')+'" data-rec="'+p+'" data-sl="'+l+'" data-rk="'+key+'" aria-label="'+t().mic+'">'+MIC+'</button></span>';
}
function norm(s){return s.normalize("NFD").replace(/[̀-ًͯ-ْـ]/g,"").toLowerCase().replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[^\p{L}\p{N}\s]/gu," ").split(/\s+/).filter(Boolean)}
function recPanel(key){
  if(R.key!==key)return "";const x=t();let h='<div class="recpanel" role="status">';
  if(R.err)h+='<div class="err">'+R.err+'</div>';
  else if(R.on)h+='<div><span class="recdot"></span>'+x.recording+'</div><div><button type="button" class="btn" data-recstop>'+x.stop+'</button></div>';
  else{
    if(R.url)h+='<div>'+x.listen+'</div><audio controls src="'+R.url+'"></audio>';
    if(R.heard){const tw=norm(R.target),hw=new Set(norm(R.heard));const ok=tw.filter(w=>hw.has(w)).length;
      h+='<div class="heard">'+x.heard+' <b>'+esc(R.heard)+'</b></div><div class="heard">'+x.match(ok,tw.length)+'</div>'}
    else if(R.noRec)h+='<div class="heard">'+x.noRec+'</div>';
    h+='<div><button type="button" class="btn ghost" data-rec="'+esc(R.target)+'" data-sl="'+R.l+'" data-rk="'+key+'">'+x.again2+'</button></div>';
  }
  return h+'</div>';
}
async function startRec(target,l,key){
  stopRec(true);
  Object.assign(R,{key,on:true,url:null,heard:"",err:null,noRec:!RecCtor,target,l});render();
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("nomic");
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const chunks=[];mediaRec=new MediaRecorder(stream);
    mediaRec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    mediaRec.onstop=()=>{try{if(R.url)URL.revokeObjectURL(R.url)}catch(e){}R.url=chunks.length?URL.createObjectURL(new Blob(chunks,{type:mediaRec.mimeType||"audio/webm"})):null;
      if(stream)stream.getTracks().forEach(tr=>tr.stop());stream=null;R.on=false;render()};
    mediaRec.start();
    if(RecCtor){try{recog=new RecCtor();recog.lang=l==="ar"?"ar-MA":"fr-FR";recog.interimResults=true;recog.continuous=true;
      recog.onresult=e=>{let s="";for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript+" ";R.heard=s.trim()};
      recog.onerror=()=>{};recog.start()}catch(e){recog=null;R.noRec=true}}
    recTimer=setTimeout(()=>stopRec(),30000);
  }catch(e){R.on=false;R.err=t().micNo;if(stream)stream.getTracks().forEach(tr=>tr.stop());stream=null;render()}
}
function stopRec(silent){
  clearTimeout(recTimer);
  try{if(recog)recog.stop()}catch(e){}recog=null;
  try{if(mediaRec&&mediaRec.state!=="inactive"){mediaRec.stop();mediaRec=null;return}}catch(e){}
  mediaRec=null;if(stream){stream.getTracks().forEach(tr=>tr.stop());stream=null}
  if(!silent){R.on=false;render()}
}
function resetRec(){if(R.on)stopRec(true);R.key=null;R.on=false}

/* ---- utilitaires ---- */
function shuffle(n,seed){const a=[...Array(n).keys()];let s=seed*9301+49297;for(let i=n-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  if(n>1&&a.every((v,i)=>v===i))a.push(a.shift());return a}
function subj(id){return SUBJ.find(s=>s.id===id)}
const nSets=L=>Math.ceil(L.x.length/SET);
const setRange=(L,s)=>[s*SET,Math.min(L.x.length,(s+1)*SET)];
function lessonEx(sid,i){const e=(P.ex[sid]||{})[i];return e&&typeof e==="object"?e:{}}
function sStats(S){const r=P.read[S.id]||{};let nr=0,ns=0,ok=0,tot=0,all=0;
  S.L.forEach((L,i)=>{all+=L.x.length;if(r[i])nr++;const e=lessonEx(S.id,i);for(const k in e){ns++;ok+=e[k];const [a,b]=setRange(L,+k);tot+=b-a}});
  return{nr,ns,ok,tot,n:S.L.length,all}}

/* ---- rendu ---- */
function render(){
  const x=t();
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.documentElement.dataset.size=size;
  document.title=x.name;$("appName").textContent=x.name;
  $("bLang").textContent=lang==="ar"?"FR":"ع";$("bSize").textContent=x.sizeL[size%3];
  const arrow=lang==="ar"?" ←":" →";
  let h="";
  const nav=a=>'<nav class="nav"><button type="button" data-go="home" aria-current="'+(a==="home")+'">'+x.subjects+'</button><button type="button" data-go="parents" aria-current="'+(a==="parents")+'">'+x.parents+'</button></nav>';
  if(view.s==="home"){
    h+=nav("home")+'<div class="starbar"><span>'+x.stars+'</span><b>⭐ '+(P.stars||0)+'</b></div><h2>'+x.choose+'</h2><p class="lead">'+x.lead+'</p><div class="subjects">';
    SUBJ.forEach(S=>{const st=sStats(S);
      h+='<button type="button" class="subj" data-subj="'+S.id+'"><span class="sym">'+S.sym+'</span><b>'+S.name[lang==="ar"?0:1]+'</b><span>'+x.lessons(st.n)+' · '+x.exN(st.all)+'</span><div class="bar"><i style="width:'+Math.round(st.nr/st.n*100)+'%"></i></div></button>'});
    h+='</div>';
  }
  else if(view.s==="subj"){
    const S=subj(view.id);let sec=null;
    h+='<button type="button" class="back" data-go="home">'+x.back+'</button><h2>'+S.name[lang==="ar"?0:1]+'</h2>';
    const ne=Object.keys((P.err||{})[S.id]||{}).length;h+='<div class="quick"><button type="button" class="set" data-quiz="mix"><span class="qi"><b>🔀 '+x.mix+'</b><span>'+x.mixInfo+'</span></span></button><button type="button" class="set" data-quiz="err"'+(ne?'':' disabled')+'><span class="qi"><b>🔁 '+x.errs+'</b><span>'+(ne?x.errsInfo(ne):x.errsNone)+'</span></span></button></div>';
    h+='<div dir="'+(S.lang==="ar"?"rtl":"ltr")+'" class="content">';
    S.L.forEach((L,i)=>{
      if(L.s&&L.s!==sec){if(sec!==null)h+='</ol>';sec=L.s;h+='<h3>'+L.s+'</h3><ol class="lessons">'}
      else if(sec===null){sec="";h+='<ol class="lessons">'}
      const r=(P.read[S.id]||{})[i],e=lessonEx(S.id,i);let got=0,any=false;for(const k in e){got+=e[k];any=true}
      let c='';if(r)c+='<span class="chip ok">✓ '+x.read+'</span>';if(any)c+='<span class="chip'+(got===L.x.length?' ok':'')+'">'+x.exs(got,L.x.length)+'</span>';
      h+='<li><button type="button" data-lesson="'+i+'"><span class="num">'+(i+1)+'</span><span class="tt">'+fmt(L.t)+'</span>'+(c?'<span class="chips">'+c+'</span>':'')+'</button></li>';
    });
    h+='</ol></div>';
  }
  else if(view.s==="lesson"){
    const S=subj(view.id),L=S.L[view.i],step=view.step||0,dir=S.lang==="ar"?"rtl":"ltr";
    if(step===0){const r=P.read[S.id]=P.read[S.id]||{};if(!r[view.i]){r[view.i]=true;save()}}
    h+='<button type="button" class="back" data-back>'+x.back+'</button>';
    h+='<h2 dir="'+dir+'" class="content"><span class="num" style="margin-inline-end:8px">'+(view.i+1)+'</span>'+fmt(L.t)+'</h2>';
    h+='<div class="steps" role="tablist">'+x.st.map((n,k)=>'<button type="button" role="tab" data-step="'+k+'" aria-selected="'+(k===step)+'"><small>'+(k+1)+'</small>'+n+'</button>').join("")+'</div>';
    if(step===0){
      const kf=(KF[S.id]||{})[view.i]||[];if(canSpeak)h+='<div class="actions" style="margin:0 0 10px"><button type="button" class="btn ghost" data-readall>'+(view.reading?'⏹ '+x.stopAll:'🔊 '+x.readAll)+'</button></div>';
      h+='<div dir="'+dir+'" class="content"><div class="sheet"><ul class="keys">'+L.k.map((s,j)=>'<li><span class="t">'+fmt(s)+'</span>'+tools(s,S.lang,"k"+j)+recPanel("k"+j)+'</li>'+kf.filter(f=>f[0]===j).map(f=>'<li class="figli">'+figHtml(f[1])+'</li>').join("")).join("")+'</ul></div></div>';
      h+='<div class="actions"><button type="button" class="btn" data-step="1">'+x.st[1]+arrow+'</button></div>';
    } else if(step===1){
      h+='<div dir="'+dir+'" class="content"><table class="gloss"><tbody>'+L.w.map((w,j)=>'<tr><td class="'+(S.lang==="ar"?"ar":"la")+'">'+esc(w[0])+'</td><td class="'+(/[؀-ۿ]/.test(w[1])?"ar":"la")+'" dir="auto">'+esc(w[1])+'</td></tr>').join("")+'</tbody></table></div>';
      h+='<div class="actions"><button type="button" class="btn" data-step="2">'+x.st[2]+arrow+'</button></div>';
    } else if(step===2){
      h+=view.g?'<div dir="'+dir+'" class="content">'+player(S,L)+'</div>':setsHtml(S,L);
    } else {
      h+='<div class="tip"><h4>'+x.tipH+'</h4><p>'+S.tip[lang==="ar"?0:1]+'</p></div><h3>'+x.autH+'</h3><ul class="advice">'+x.aut.map(a=>'<li>'+a+'</li>').join("")+'</ul>';
    }
  }
  else if(view.s==="quiz"){
    const S=subj(view.id),dir=S.lang==="ar"?"rtl":"ltr";
    h+='<button type="button" class="back" data-backsubj>'+x.back+'</button><h2>'+(view.mode==="err"?'🔁 '+x.errs:'🔀 '+x.mix)+'</h2><p class="lead">'+S.name[lang==="ar"?0:1]+'</p>';
    h+='<div dir="'+dir+'" class="content">'+player(S)+'</div>';
  }
  else if(view.s==="parents"){
    let R0=0,E=0,O=0,TT=0,N=0;const rows=SUBJ.map(S=>{const st=sStats(S);R0+=st.nr;E+=st.ns;O+=st.ok;TT+=st.tot;N+=st.n;

    h+='<div class="stats"><div class="stat"><b>'+R0+'/'+N+'</b><span>'+x.stRead+'</span></div><div class="stat"><b>'+E+'</b><span>'+x.stEx+'</span></div><div class="stat"><b>'+(TT?Math.round(O/TT*100)+'%':'–')+'</b><span>'+x.stOk+'</span></div></div>';
    h+='<h3>'+x.subjects+'</h3><div style="overflow-x:auto"><table class="ptable"><thead><tr><th>'+x.tSub+'</th><th>'+x.tRead+'</th><th>'+x.tEx+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    h+='<h3>'+x.autH+'</h3><ul class="advice">'+x.aut.map(a=>'<li>'+a+'</li>').join("")+'</ul>';
    h+=view.confirm?'<div class="confirm"><span>'+x.confirmQ+'</span><button type="button" class="btn" data-wipe>'+x.yes+'</button><button type="button" class="btn ghost" data-nowipe>'+x.no+'</button></div>':'<button type="button" class="reset" data-reset>'+x.reset+'</button>';
