function setsHtml(S,L){
  const x=t(),e=lessonEx(S.id,view.i);let h='<p class="lead">'+x.setsLead+'</p><div class="sets">';
  for(let s=0;s<nSets(L);s++){const [a,b]=setRange(L,s),done=e[s]!=null;
    h+='<button type="button" class="set" data-set="'+s+'"><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><b>'+x.set(s+1)+'</b><span>'+x.setInfo(a+1,b)+'</span></span>'+(done?'<span class="chip'+(e[s]===b-a?' ok':'')+'">'+x.best(e[s],b-a)+'</span>':'')+'</button>'}
  return h+'</div>';
}

/* ---- lecteur d'exercices (séries, mélange, erreurs) ---- */
function newEx(){return{tried:[],done:false,hint:0,first:true,placed:[],ordCheck:null,mSel:null,mDone:[],mMiss:null,msg:null,gFill:[],gCheck:null}}
function newG(list,extra){return Object.assign({list,pos:0,e:newEx(),score:0,end:false,sh:null},extra||{})}
function startSet(s){const L=subj(view.id).L[view.i];const [a,b]=setRange(L,s);const list=[];for(let k=a;k<b;k++)list.push([view.i,k]);view.g=newG(list,{mode:"set",set:s});resetRec()}
function startQuiz(mode){const S=subj(view.id);let list=[];
  if(mode==="err")list=Object.keys((P.err||{})[S.id]||{}).map(k=>k.split(".").map(Number)).filter(([i,k])=>S.L[i]&&S.L[i].x[k]).slice(0,10);
  else{const all=[];S.L.forEach((L,i)=>L.x.forEach((_,k)=>all.push([i,k])));let sd=(Date.now()%100000)+7;
    for(let n=0;n<10&&all.length;n++){sd=(sd*9301+49297)%233280;list.push(all.splice(Math.floor(sd/233280*all.length),1)[0])}}
  view={s:"quiz",id:S.id,mode};view.g=newG(list,{mode});resetRec()}
function fullSentence(E){if(E[0]==="o")return E[2].join(" ");if(E[0]==="g"){const parts=E[1].split("___");return parts.map((p,i)=>p+(i<E[2].length?E[2][i]:"")).join("")}return E[1]}
function cur(S){const G=view.g,[li,k]=G.list[G.pos];return{li,k,L:S.L[li],E:S.L[li].x[k]}}
function player(S){
  const x=t(),G=view.g,n=G.list.length;
  if(!n)return '<div class="card end"><p>'+x.errsNone+'</p></div>';
  if(G.end){const more=G.mode==="set"&&G.set<nSets(S.L[view.i])-1;
    return '<div class="card end"><div class="big">'+G.score+' / '+n+'</div><p><b>'+x.endT(G.score,n)+'</b></p><p class="star">'+x.starEarn+'</p><p>'+x.endP+'</p><div class="actions" style="justify-content:center">'+
      (more?'<button type="button" class="btn" data-set="'+(G.set+1)+'">'+x.nextSet+'</button>':'')+
      (G.mode==="set"?'<button type="button" class="btn ghost" data-again>'+x.again+'</button><button type="button" class="btn ghost" data-sets>'+x.toSets+'</button>':'<button type="button" class="btn" data-quiz="'+G.mode+'">'+(G.mode==="err"?x.errs:x.mix)+'</button><button type="button" class="btn ghost" data-backsubj>'+x.toList+'</button>')+'</div></div>'}
  const {li,k,L,E}=cur(S),st=G.e,type=E[0],seed=li*31+k;
  let h='<div class="dots">';for(let i=0;i<n;i++)h+='<span class="dot'+(i<G.pos?' done':i===G.pos?' cur':'')+'"></span>';
  h+='<span>'+(G.mode==="set"?x.set(G.set+1)+' · ':'')+(G.pos+1)+' / '+n+'</span></div>';
  h+='<div class="card">';
  if(G.mode!=="set")h+='<div class="from">'+x.fromL(li+1,fmt(L.t))+'</div>';
  h+='<div class="kind">'+x.kinds[type]+'</div>';
  if(E.fig)h+=figHtml(E.fig);
  if(type!=="g")h+='<div class="qrow"><p class="qtext">'+fmt(E[1])+'</p>'+(canSpeak?'<button type="button" class="say" data-say="'+esc(plain(E[1]))+'" data-sl="'+S.lang+'" aria-label="Écouter">'+SPK+'</button>':'')+'</div>';
  if(type==="q"||type==="vf"){
    const opts=type==="q"?E[2]:[x.vrai,x.faux],ans=type==="q"?E[3]:(E[2]?0:1);
    const order=type==="q"?(G.sh||(G.sh=shuffle(opts.length,seed))):[0,1];
    h+='<div class="'+(type==="vf"?"vfrow":"opts")+'">';
    order.forEach(j=>{let c="opt";if(st.done&&j===ans)c+=" right";else if(st.tried.includes(j))c+=" tried";
      h+='<button type="button" class="'+c+'" data-opt="'+j+'"'+(st.done||st.tried.includes(j)?' disabled':'')+'>'+(type==="q"?optHtml(opts[j]):opts[j])+'</button>'});
    h+='</div>';
  } else if(type==="o"){
    const items=E[2],sh=G.sh||(G.sh=shuffle(items.length,seed));
    h+='<div class="slot" data-empty="'+x.orderEmpty+'">'+st.placed.map((j,p)=>{let c="tok placed";if(st.ordCheck)c+=st.ordCheck[p]?" good":" bad";if(st.done)c="tok good";
      return '<button type="button" class="'+c+'" data-unplace="'+p+'"'+(st.done?' disabled':'')+'>'+fmt(items[j])+'</button>'}).join("")+'</div>';
    h+='<div class="pool">'+sh.filter(j=>!st.placed.includes(j)).map(j=>'<button type="button" class="tok" data-place="'+j+'">'+fmt(items[j])+'</button>').join("")+'</div>';
    if(!st.done)h+='<div class="actions"><button type="button" class="btn" data-ocheck'+(st.placed.length<items.length?' disabled':'')+'>'+x.check+'</button><button type="button" class="btn ghost" data-oclear'+(st.placed.length?'':' disabled')+'>'+x.clear+'</button></div>';
  } else if(type==="g"){
    const bank=E[2].concat(E[3]),sh=G.sh||(G.sh=shuffle(bank.length,seed)),parts=E[1].split("___"),nb=E[2].length;
    let s='';const filled=st.gFill.filter(v=>v!=null).length;let nextB=-1;for(let i=0;i<nb;i++)if(st.gFill[i]==null){nextB=i;break}
    parts.forEach((p,i)=>{s+=fmt(p);if(i<nb){const f=st.gFill[i];
      if(f==null)s+='<span class="blank'+(i===nextB&&!st.done?' next':'')+'">&nbsp;</span>';
      else{let c="blank filled";if(st.done)c+=" good";else if(st.gCheck&&st.gCheck[i]===true)c+=" good";else if(st.gCheck&&st.gCheck[i]===false)c+=" bad";
        s+='<button type="button" class="'+c+'" data-gun="'+i+'"'+(st.done||(st.gCheck&&st.gCheck[i]===true)?' disabled':'')+'>'+fmt(bank[f])+'</button>'}}});
    h+='<div class="qrow"><p class="gap">'+s+'</p>'+(canSpeak&&st.done?'<button type="button" class="say" data-say="'+esc(plain(fullSentence(E)))+'" data-sl="'+S.lang+'" aria-label="Écouter">'+SPK+'</button>':'')+'</div>';
    if(!st.done){
      if(!filled)h+='<p class="lead" style="font-size:.85em;margin:0 0 8px">'+x.gapTip+'</p>';
      h+='<div class="pool">'+sh.filter(j=>!st.gFill.includes(j)).map(j=>'<button type="button" class="tok" data-gfill="'+j+'"'+(filled>=nb?' disabled':'')+'>'+fmt(bank[j])+'</button>').join("")+'</div>';
      h+='<div class="actions"><button type="button" class="btn" data-gcheck'+(filled<nb?' disabled':'')+'>'+x.check+'</button><button type="button" class="btn ghost" data-gclear'+(filled?'':' disabled')+'>'+x.clear+'</button></div>';
    }
  } else if(type==="m"){
    const pairs=E[2],sh=G.sh||(G.sh=shuffle(pairs.length,seed));
    if(!st.done&&!st.mDone.length)h+='<p class="lead" style="font-size:.85em;margin:0 0 8px">'+x.matchTip+'</p>';
    h+='<div class="mgrid"><div class="mcol">'+pairs.map((p,i)=>{const d=st.mDone.includes(i);
      return '<button type="button" class="mi'+(d?' done':st.mSel===i?' sel':'')+'" data-ml="'+i+'"'+(d?' disabled':'')+'>'+(d?'<span class="pair">'+(st.mDone.indexOf(i)+1)+'</span>':'')+fmt(p[0])+'</button>'}).join("")+'</div>';
    h+='<div class="mcol">'+sh.map(j=>{const d=st.mDone.includes(j);
      return '<button type="button" class="mi'+(d?' done':st.mMiss===j?' miss':'')+'" data-mr="'+j+'"'+(d?' disabled':'')+'>'+(d?'<span class="pair">'+(st.mDone.indexOf(j)+1)+'</span>':'')+fmt(pairs[j][1])+'</button>'}).join("")+'</div></div>';
  }
  if(st.msg==="no")h+='<div class="feedback no" role="status">'+(type==="o"?x.orderNo:type==="g"?x.gapNo:type==="m"?x.matchNo:x.notyet)+'</div>';
  const steps=E[E.length-1].split(" | ");
  if(st.done){
    h+='<div class="feedback ok" role="status"><b>'+x.good+'</b>'+fmt(steps.join(" "))+'</div>';
    if(type==="o"||type==="g"){const key="ex"+li+"."+k,sent=fullSentence(E);
      h+='<div class="qrow" style="margin-top:12px;align-items:center"><span style="flex:1;font-size:.9em;color:var(--soft)">'+x.mic+'</span>'+tools(sent,S.lang,key)+'</div>'+recPanel(key)}
  }
  if(!st.done&&st.hint>0)h+='<div class="hint"><h4>'+x.helpH+'</h4><ol>'+steps.slice(0,st.hint).map(s=>'<li>'+fmt(s)+'</li>').join("")+'</ol></div>';
  h+='<div class="actions">';
  if(!st.done)h+='<button type="button" class="btn help" data-hint'+(st.hint>=steps.length?' disabled':'')+'>'+(st.hint?x.more:x.help)+'</button>';
  else h+='<button type="button" class="btn" data-next>'+(G.pos===n-1?x.finish:x.next)+'</button>';
  h+='</div></div>';
  return h;
}
function errKey(){const S=subj(view.id),[li,k]=view.g.list[view.g.pos];return[S.id,li+"."+k]}
function solved(){const G=view.g;G.e.done=true;G.e.msg=null;const [sid,key]=errKey();P.err=P.err||{};
  if(G.e.first){G.score++;if(P.err[sid]&&P.err[sid][key]){delete P.err[sid][key];save()}}
  else{(P.err[sid]=P.err[sid]||{})[key]=1;save()}}
function miss(){view.g.e.first=false;view.g.e.msg="no"}

/* lecture de toute la leçon */
function readAll(){const S=subj(view.id),L=S.L[view.i];try{speechSynthesis.cancel();view.reading=true;
  L.k.forEach((s,j)=>{const u=new SpeechSynthesisUtterance(plain(s));u.lang=S.lang==="ar"?"ar-SA":"fr-FR";u.rate=.85;if(j===L.k.length-1)u.onend=()=>{view.reading=false;render()};speechSynthesis.speak(u)});}catch(e){view.reading=false}render()}

document.addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b||b.disabled)return;const d=b.dataset;
  if(b.id==="bLang"){lang=lang==="ar"?"fr":"ar";ls(KEY+"-lang",lang);render();return}
  if(b.id==="bSize"){size=size%3+1;ls(KEY+"-size",size);render();return}
  if(d.say!=null){speak(d.say,d.sl);return}
  if(d.readall!=null){if(view.reading){try{speechSynthesis.cancel()}catch(e){}view.reading=false;render()}else readAll();return}
  if(d.rec!=null){if(R.on&&R.key===d.rk){stopRec();return}startRec(d.rec,d.sl,d.rk);return}
  if(d.recstop!=null){stopRec();return}
  const go=v=>{resetRec();try{if(view.reading)speechSynthesis.cancel()}catch(e){}view=v;render();scrollTo(0,0)};
  if(d.go){go({s:d.go});return}
  if(d.subj){go({s:"subj",id:d.subj});return}
  if(d.lesson!=null){go({s:"lesson",id:view.id,i:+d.lesson,step:0});return}
  if(d.back!=null||d.backsubj!=null){go({s:"subj",id:view.id});return}
  if(d.quiz){startQuiz(d.quiz);render();scrollTo(0,0);return}
  if(d.step!=null){resetRec();try{if(view.reading)speechSynthesis.cancel()}catch(e){}view.reading=false;view.step=+d.step;view.g=null;render();scrollTo(0,0);return}
  if(d.reset!=null){view.confirm=true;render();return}
  if(d.nowipe!=null){view.confirm=false;render();return}
  if(d.wipe!=null){P={read:{},ex:{},err:{},stars:0};save();view.confirm=false;render();return}
  if(d.set!=null){startSet(+d.set);render();scrollTo(0,0);return}
  if(d.sets!=null){resetRec();view.g=null;render();scrollTo(0,0);return}
  const G=view.g;if(!G||G.end||!G.list.length)return;const S=subj(view.id),{E}=cur(S),st=G.e;
  if(d.again!=null){startSet(G.set);render();return}
  if(d.hint!=null){st.hint++;render();return}
  if(d.next!=null){resetRec();
    if(G.pos<G.list.length-1){G.pos++;G.e=newEx();G.sh=null}
    else{G.end=true;P.stars=(P.stars||0)+1;
      if(G.mode==="set"){const all=P.ex[S.id]=P.ex[S.id]||{};let e=all[view.i];if(!e||typeof e!=="object")e=all[view.i]={};e[G.set]=Math.max(e[G.set]??0,G.score)}
      save()}
    render();scrollTo(0,0);return}
  if(d.opt!=null){const j=+d.opt,ans=E[0]==="q"?E[3]:(E[2]?0:1);if(j===ans)solved();else{st.tried.push(j);miss()}render();return}
  if(d.place!=null){st.placed.push(+d.place);st.ordCheck=null;st.msg=null;render();return}
  if(d.unplace!=null){st.placed.splice(+d.unplace,1);st.ordCheck=null;st.msg=null;render();return}
  if(d.oclear!=null){st.placed=[];st.ordCheck=null;st.msg=null;render();return}
  if(d.ocheck!=null){const chk=st.placed.map((j,p)=>E[2][j]===E[2][p]);if(chk.every(Boolean))solved();else{st.ordCheck=chk;miss()}render();return}
  if(d.gfill!=null){const nb=E[2].length;let k=-1;for(let i=0;i<nb;i++)if(st.gFill[i]==null){k=i;break}if(k>=0){st.gFill[k]=+d.gfill;if(st.gCheck)st.gCheck[k]=null;st.msg=null}render();return}
  if(d.gun!=null){const i=+d.gun;st.gFill[i]=null;if(st.gCheck)st.gCheck[i]=null;st.msg=null;render();return}
  if(d.gclear!=null){st.gFill=st.gFill.map((f,i)=>st.gCheck&&st.gCheck[i]===true?f:null);st.msg=null;render();return}
  if(d.gcheck!=null){const bank=E[2].concat(E[3]);const chk=E[2].map((a,i)=>st.gFill[i]!=null&&bank[st.gFill[i]]===a);if(chk.every(Boolean))solved();else{st.gCheck=chk;miss()}render();return}
  if(d.ml!=null){st.mSel=+d.ml;st.mMiss=null;st.msg=null;render();return}
  if(d.mr!=null){const j=+d.mr;if(st.mSel==null)return;
    if(j===st.mSel){st.mDone.push(j);st.mSel=null;st.mMiss=null;st.msg=null;if(st.mDone.length===E[2].length)solved()}
    else{st.mMiss=j;miss()}render();return}
});
applyFigs();
render();
</script>
